          comparisons: "出土戰國卜筮祭禱竹簡中所見之「司命」，其執掌壽疾之功能與後世道教注籍之官如何銜接？"
        },
        researcher: {
          searchTerms: "司命; 大司命; 文昌司命; 算盡則死; 包山楚簡",

      {

        title: "本命",

        q: -1, r: 1,

        hexColor: "#34d399",
        status: "待材料核對（待連線）",

          citations: "《雲笈七籤·卷二十四·日月星辰部》：「凡人本命之日，夜半沐浴，存其星官降光注身。」"

      },
      {
        id: "mingji",
        title: "命籍",
        subtitle: "黑籍注死・丹簡書生之冥府官僚文書",
        q: 0, r: -1,
        color: 0xf43f5e,
        hexColor: "#f43f5e",
        status: "待材料核對（待連線）",
        beginner: {
          step1_question: "命運在古典文本中如何被「白紙黑字」化？生與死真有名冊嗎？",
          step2_concept: "古人將人間官僚行政體系的「戶籍」與「文書治理」投射至幽冥天曹。北斗落死籍、南極注生籍；修道修行被理解為將名字從地府死籍銷去、轉移至仙班玉簡的「轉籍」過程。",
          step3_evidence: "《抱朴子內篇·微旨》：「天地有司過之神，隨人所犯輕重，以奪其算，算減則人貧耗疾病……算盡乃死耳。」"
        },
        course: {
          topicMap: "漢唐戶籍文牒制度 → 冥府泰山與北斗之籍帳建構",
          materials: ["長沙東牌樓東漢簡牘", "《真誥·運象篇》", "《赤書玉訣妙經》"],
          comparisons: "漢代地券墓誌中的「解注」辭，與道教儀式中向天曹上奏章「除死籍」的表文格式之演變歷程。"
        },
        researcher: {
          searchTerms: "黑籍; 丹簡; 除死名; 算數; 泰山府君",
          imageRef: "吐魯番阿斯塔那出土唐代隨葬道教買地券與消災牒文（模擬文獻拓本）",
          dispute: "【歷史制度爭議】：「除死籍、付生籍」之文書規範，其符籙表章究竟在何種程度上完全套用漢魏律令？學界對「六天宮室」與「太山死名」之管轄交疊現象論證仍未統一。",
          citations: "陶弘景《真誥·運象篇第一》：「受生者名在左府，將死者名在黑籍。」"
        }
      }
    ];

    // ==========================================
    // 2. Three.js 場景、燈光、相機與六角島生成
    // ==========================================
    let scene, camera, renderer, controls;
    let raycaster, mouse;
    let currentMode = "beginner"; // 'beginner' | 'course' | 'researcher'
    let selectedIsland = null;
    const islandMeshes = [];

    const HEX_RADIUS = 3.6;
    const HEX_HEIGHT = 0.8;

    // 平頂六角座標轉世界空間 (q, r -> x, z)
    function hexToWorld(q, r, radius) {
      const x = radius * (3 / 2 * q);
      const z = radius * (Math.sqrt(3) / 2 * q + Math.sqrt(3) * r);
      return { x, z };
    }

    function initScene() {
      const container = document.getElementById("canvas-container");
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0e17);
      scene.fog = new THREE.FogExp2(0x0a0e17, 0.025);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 18, 22);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = Math.PI / 2 - 0.05; // 限制不能低於水平面
      controls.minDistance = 6;
      controls.maxDistance = 50;
      controls.target.set(0, 0, 0);

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      // 環境光與主定向光（星空幽邃調性）
      const ambientLight = new THREE.AmbientLight(0x2a3b5c, 1.2);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xe2e8f0, 1.5);
      dirLight.position.set(12, 24, 15);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.bias = -0.0005;
      scene.add(dirLight);

      const fillLight = new THREE.PointLight(0x38bdf8, 1.8, 40);
      fillLight.position.set(-10, 8, -8);
      scene.add(fillLight);

      // 背景星辰微粒
      createStarfield();

      // 生成六角概念島
      buildIslands();

      // 監聽事件
      window.addEventListener("resize", onWindowResize);
      window.addEventListener("pointerdown", onPointerDown);

      animate();
    }

    // 建立星宿背景粒子
    function createStarfield() {
      const starGeo = new THREE.BufferGeometry();
      const count = 400;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 120;
        positions[i + 1] = Math.random() * 40 - 5;
        positions[i + 2] = (Math.random() - 0.5) * 120;
      }
      starGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const starMat = new THREE.PointsMaterial({
        color: 0x94a3b8,
        size: 0.25,
        transparent: true,
        opacity: 0.6
      });
      const stars = new THREE.Points(starGeo, starMat);
      scene.add(stars);
    }

    // 建構個別六角島嶼
    function buildIslands() {
      ISLANDS_DATA.forEach(data => {
        const { x, z } = hexToWorld(data.q, data.r, HEX_RADIUS);
        const islandGroup = new THREE.Group();
        islandGroup.position.set(x, 0, z);

        // 1. 六角柱基底 (平頂: 旋轉 30度或半徑計算)
        const hexGeo = new THREE.CylinderGeometry(HEX_RADIUS * 0.92, HEX_RADIUS * 0.95, HEX_HEIGHT, 6);
        const hexMat = new THREE.MeshStandardMaterial({
          color: 0x1e293b,
          roughness: 0.5,
          metalness: 0.2,
          flatShading: true
        });
        const hexMesh = new THREE.Mesh(hexGeo, hexMat);
        hexMesh.rotation.y = Math.PI / 6; // 旋轉使邊角對齊
        hexMesh.receiveShadow = true;
        hexMesh.castShadow = true;
        islandGroup.add(hexMesh);

        // 2. 六角外圈發光邊線
        const edgeGeo = new THREE.EdgesGeometry(hexGeo);
        const edgeMat = new THREE.LineBasicMaterial({
          color: data.color,
          linewidth: 2,
          transparent: true,
          opacity: 0.7
        });
        const edgeLine = new THREE.LineSegments(edgeGeo, edgeMat);
        edgeLine.rotation.y = Math.PI / 6;
        edgeLine.position.y = 0.01;
        islandGroup.add(edgeLine);

        // 3. 節點標誌柱體與光環 (待核對之未連線標記)
        const markerGeo = new THREE.OctahedronGeometry(0.7, 0);
        const markerMat = new THREE.MeshStandardMaterial({
          color: data.color,
          emissive: data.color,
          emissiveIntensity: 0.35,
          roughness: 0.3,
          wireframe: false
        });
        const markerMesh = new THREE.Mesh(markerGeo, markerMat);
        markerMesh.position.y = HEX_HEIGHT / 2 + 1.2;
        markerMesh.castShadow = true;
        islandGroup.add(markerMesh);

        // 連動自轉用屬性
        islandGroup.userData = {
          data: data,
          markerMesh: markerMesh,
          baseMat: hexMat,
          originY: 0
        };

        scene.add(islandGroup);
        islandMeshes.push(islandGroup);
      });
    }

    // ==========================================
    // 3. 互動拾取 (Raycaster) 與相機動畫
    // ==========================================
    function onPointerDown(event) {
      // 避免點擊側邊欄觸發畫布射線
      if (event.clientX > window.innerWidth - 420 && !document.getElementById("side-drawer").classList.contains("translate-x-full")) {
        return;
      }

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      // 檢測相交的六角島嶼
      const interactableTargets = [];
      islandMeshes.forEach(group => {
        group.children.forEach(child => interactableTargets.push(child));
      });

      const intersects = raycaster.intersectObjects(interactableTargets, false);

      if (intersects.length > 0) {
        // 向上尋找母體 group
        let hitGroup = intersects[0].object.parent;
        if (hitGroup && hitGroup.userData && hitGroup.userData.data) {
          selectIsland(hitGroup.userData.data.id);
        }
      }
    }

    function selectIsland(id) {
      const targetGroup = islandMeshes.find(g => g.userData.data.id === id);
      if (!targetGroup) return;

      selectedIsland = targetGroup.userData.data;

      // 相機平滑推近聚焦
      const targetPos = targetGroup.position;
      new TWEEN.Tween(controls.target)
        .to({ x: targetPos.x, y: targetPos.y + 1, z: targetPos.z }, 800)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      new TWEEN.Tween(camera.position)
        .to({ x: targetPos.x + 5, y: targetPos.y + 7, z: targetPos.z + 8 }, 800)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      // 開啟側邊欄並渲染深度資訊
      renderDrawer();
    }

    function focusIslandById(id) {
      selectIsland(id);
    }

    // ==========================================
    // 4. 三種閱讀路徑渲染器
    // ==========================================
    function setReaderMode(mode) {
      currentMode = mode;
      
      // 更新按鈕外觀
      document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.classList.remove("bg-indigo-600", "text-white", "shadow-md");
        btn.classList.add("text-slate-300");
      });
      const activeBtn = document.getElementById(`btn-${mode}`);
      if (activeBtn) {
        activeBtn.classList.remove("text-slate-300");
        activeBtn.classList.add("bg-indigo-600", "text-white", "shadow-md");
      }

      if (selectedIsland) {
        renderDrawer();
      }
    }

    function renderDrawer() {
      if (!selectedIsland) return;

      const drawer = document.getElementById("side-drawer");
      drawer.classList.remove("translate-x-full");

      document.getElementById("drawer-title").textContent = selectedIsland.title;
      document.getElementById("drawer-coord").textContent = `Axial Coordinates: q=${selectedIsland.q}, r=${selectedIsland.r} | ${selectedIsland.subtitle}`;
      
      const tag = document.getElementById("drawer-tag");
      tag.textContent = selectedIsland.id;
      tag.style.backgroundColor = `${selectedIsland.hexColor}25`;
      tag.style.color = selectedIsland.hexColor;
      tag.style.borderColor = `${selectedIsland.hexColor}50`;

      const contentBox = document.getElementById("drawer-dynamic-content");
      contentBox.innerHTML = ""; // 清空

      if (currentMode === "beginner") {
        // 初學者路徑：問題導讀 → 概念簡介 → 材料例證
        contentBox.innerHTML = `
          <div class="space-y-4">
            <div class="p-3.5 rounded-lg bg-indigo-950/40 border border-indigo-700/50">
              <span class="text-[10px] uppercase font-mono font-bold text-indigo-400 block mb-1">【步驟一：問題導讀】</span>
              <p class="text-xs font-medium text-slate-100 leading-snug">${selectedIsland.beginner.step1_question}</p>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-slate-400 block mb-1">【步驟二：概念簡介】</span>
              <p class="text-xs text-slate-300 leading-relaxed">${selectedIsland.beginner.step2_concept}</p>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-emerald-400 block mb-1">【步驟三：材料例證】</span>
              <blockquote class="text-xs text-emerald-200/90 font-serif border-l-2 border-emerald-500 pl-2.5 py-0.5 leading-relaxed">
                ${selectedIsland.beginner.step3_evidence}
              </blockquote>
            </div>
          </div>
        `;
      } else if (currentMode === "course") {
        // 課程使用者路徑：主題地圖 → 指定材料 → 比較問題
        const materialsList = selectedIsland.course.materials
          .map(m => `<li class="font-serif text-slate-200 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>${m}</li>`)
          .join("");

        contentBox.innerHTML = `
          <div class="space-y-4">
            <div class="p-3.5 rounded-lg bg-amber-950/30 border border-amber-600/40">
              <span class="text-[10px] uppercase font-mono font-bold text-amber-400 block mb-1">【課程主題地圖位階】</span>
              <p class="text-xs font-medium text-slate-100">${selectedIsland.course.topicMap}</p>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-slate-400 block mb-1.5">【本單元研讀文本材料】</span>
              <ul class="space-y-1.5 text-xs">
                ${materialsList}
              </ul>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-cyan-400 block mb-1">【課堂討論與比較問題】</span>
              <p class="text-xs text-slate-300 leading-relaxed">${selectedIsland.course.comparisons}</p>
            </div>
          </div>
        `;
      } else if (currentMode === "researcher") {
        // 研究者路徑：文獻檢索 → 原典影像 → 版本與爭議 → 引用資料
        contentBox.innerHTML = `
          <div class="space-y-4 font-mono text-[11px]">
            <div class="p-3 rounded-lg bg-slate-800/80 border border-slate-700">
              <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1 font-sans">【索引檢索詞 (Search Terms)】</span>
              <code class="text-amber-300 text-xs">${selectedIsland.researcher.searchTerms}</code>
            </div>
            <div class="p-3 rounded-lg bg-slate-800/80 border border-slate-700">
              <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1 font-sans">【原典圖像 / 簡帛鏈結】</span>
              <div class="p-2 bg-slate-900 rounded border border-slate-800 text-slate-300 flex items-center justify-between">
                <span>${selectedIsland.researcher.imageRef}</span>
                <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 font-sans">模擬標引</span>
              </div>
            </div>
            <div class="p-3 rounded-lg bg-rose-950/30 border border-rose-700/40">
              <span class="text-[10px] uppercase font-bold text-rose-400 block mb-1 font-sans">【版本考異與文獻爭議】</span>
              <p class="text-slate-300 font-sans leading-relaxed text-xs">${selectedIsland.researcher.dispute}</p>
            </div>
            <div class="p-3 rounded-lg bg-slate-800/80 border border-slate-700">
              <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1 font-sans">【原文引據標註】</span>
              <div class="p-2 rounded bg-slate-950/70 border border-slate-800 font-serif text-slate-200 text-xs leading-relaxed">
                ${selectedIsland.researcher.citations}
              </div>
            </div>
          </div>
        `;
      }
    }

    function closeDrawer() {
      document.getElementById("side-drawer").classList.add("translate-x-full");
      selectedIsland = null;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ==========================================
    // 5. 動畫迴圈 (標誌微浮動、緩動更新)
    // ==========================================
    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update();
      controls.update();

      // 各島節點標誌輕微自轉與呼吸浮動
      const t = time * 0.0015;
      islandMeshes.forEach((group, idx) => {
        const marker = group.userData.markerMesh;
        if (marker) {
          marker.rotation.y = t * 0.5 + idx;
          marker.rotation.x = Math.sin(t + idx) * 0.15;
          marker.position.y = (HEX_HEIGHT / 2 + 1.2) + Math.sin(t * 1.5 + idx) * 0.08;
        }
      });

      renderer.render(scene, camera);
    }

    // 啟動場景
    initScene();
  </script>
</body>
</html>
