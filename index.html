<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>道教科儀與思想史：星辰・命籍・身體・生命 十二辰式盤系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js, OrbitControls, TWEEN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background-color: #060911;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 3px;
    }
  </style>
</head>
<body class="relative select-none">

  <!-- 3D 渲染畫布容器 -->
  <div id="canvas-container" class="absolute inset-0"></div>

  <!-- 頂部學術導言與核心問題面板 -->
  <header class="absolute top-4 left-4 right-4 md:right-auto md:w-[500px] z-10 pointer-events-none">
    <div class="bg-slate-900/90 backdrop-blur-md p-4 rounded-xl border border-slate-700/80 shadow-2xl pointer-events-auto">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40">道教思想史式盤體系</span>
        <span class="text-xs text-slate-400">中央天樞 × 十二辰位</span>
      </div>
      <h1 class="text-sm font-bold text-slate-100 tracking-wide mb-1.5 leading-snug">
        宇宙胚胎、胞結沉淪與星真解脫：漢魏晉南北朝身體本體論與命籍重構
      </h1>
      <p class="text-[11px] text-slate-300 leading-relaxed">
        從「九天胎變結胞」、「二十四結節病理」、「亦離亦合陶器之喻」到「五斗分司與雷法超越」，呈現道教身命觀之深層辯證。
      </p>
    </div>
  </header>

  <!-- 閱讀路徑切換列 (初學者 / 課程 / 研究者) -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 flex gap-2 bg-slate-900/90 backdrop-blur-md p-1.5 rounded-2xl border border-slate-700/90 shadow-xl">
    <button onclick="setReaderMode('beginner')" id="btn-beginner" class="mode-btn px-3.5 py-1.5 rounded-xl text-xs font-medium transition-all bg-indigo-600 text-white shadow-md">
      初學者導讀
    </button>
    <button onclick="setReaderMode('course')" id="btn-course" class="mode-btn px-3.5 py-1.5 rounded-xl text-xs font-medium transition-all text-slate-300 hover:text-white hover:bg-slate-800">
      課程地圖
    </button>
    <button onclick="setReaderMode('researcher')" id="btn-researcher" class="mode-btn px-3.5 py-1.5 rounded-xl text-xs font-medium transition-all text-slate-300 hover:text-white hover:bg-slate-800">
      研究者考證
    </button>
  </div>

  <!-- 五大理論模式與核心入口速選列 -->
  <div class="absolute top-4 right-4 z-10 hidden lg:flex flex-col gap-1 bg-slate-900/85 backdrop-blur-md p-2 rounded-xl border border-slate-700/70 text-xs w-56 max-h-[85vh] overflow-y-auto custom-scrollbar">
    <span class="text-[10px] text-amber-400 font-bold px-2 py-1 uppercase tracking-wider">概念節點 / 式盤辰位</span>
    <button onclick="selectIslandById('beidou')" class="px-2.5 py-1 text-left rounded-lg hover:bg-slate-800 text-slate-200 transition-colors flex items-center justify-between">
      <span>中央天樞：北斗五斗分司</span><span class="w-2 h-2 rounded-full bg-cyan-400"></span>
    </button>
    <div class="h-px bg-slate-800 my-1"></div>
    <button onclick="selectIslandById('sector_0')" class="px-2.5 py-1 text-left rounded-lg hover:bg-slate-800 text-slate-300 transition-colors flex items-center justify-between">
      <span>子位｜從數到籍 (天師道)</span><span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
    </button>
    <button onclick="selectIslandById('sector_1')" class="px-2.5 py-1 text-left rounded-lg hover:bg-slate-800 text-slate-300 transition-colors flex items-center justify-between">
      <span>丑位｜身即小宇宙 (太平經)</span><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
    </button>
    <button onclick="selectIslandById('sector_2')" class="px-2.5 py-1 text-left rounded-lg hover:bg-slate-800 text-slate-300 transition-colors flex items-center justify-between">
      <span>寅位｜建除生殺 (太平經)</span><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
    </button>
    <button onclick="selectIslandById('sector_3')" class="px-2.5 py-1 text-left rounded-lg hover:bg-slate-800 text-slate-300 transition-colors flex items-center justify-between">
      <span>卯位｜九天胎變司命勒籍</span><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
    </button>
    <button onclick="selectIslandById('sector_4')" class="px-2.5 py-1 text-left rounded-lg hover:bg-slate-800 text-slate-300 transition-colors flex items-center justify-between">
      <span>辰位｜二十四結節病理</span><span class="w-1.5 h-1.5 rounded-full bg-purple-400"></span>
    </button>
    <button onclick="selectIslandById('sector_5')" class="px-2.5 py-1 text-left rounded-lg hover:bg-slate-800 text-slate-300 transition-colors flex items-center justify-between">
      <span>巳位｜陶弘景亦離亦合論</span><span class="w-1.5 h-1.5 rounded-full bg-purple-400"></span>
    </button>
    <button onclick="selectIslandById('sector_6')" class="px-2.5 py-1 text-left rounded-lg hover:bg-slate-800 text-slate-300 transition-colors flex items-center justify-between">
      <span>午位｜解結成真逆修造化</span><span class="w-1.5 h-1.5 rounded-full bg-purple-400"></span>
    </button>
    <button onclick="selectIslandById('sector_7')" class="px-2.5 py-1 text-left rounded-lg hover:bg-slate-800 text-slate-300 transition-colors flex items-center justify-between">
      <span>未位｜星真同構身神合一</span><span class="w-1.5 h-1.5 rounded-full bg-blue-400"></span>
    </button>
    <button onclick="selectIslandById('sector_8')" class="px-2.5 py-1 text-left rounded-lg hover:bg-slate-800 text-slate-300 transition-colors flex items-center justify-between">
      <span>申位｜星宿錯綜燃燈調泰</span><span class="w-1.5 h-1.5 rounded-full bg-blue-400"></span>
    </button>
    <button onclick="selectIslandById('sector_9')" class="px-2.5 py-1 text-left rounded-lg hover:bg-slate-800 text-slate-300 transition-colors flex items-center justify-between">
      <span>酉位｜本命星君祿食日料</span><span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
    </button>
    <button onclick="selectIslandById('sector_10')" class="px-2.5 py-1 text-left rounded-lg hover:bg-slate-800 text-slate-300 transition-colors flex items-center justify-between">
      <span>戌位｜拜斗醮謝削落死籍</span><span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
    </button>
    <button onclick="selectIslandById('sector_11')" class="px-2.5 py-1 text-left rounded-lg hover:bg-slate-800 text-slate-300 transition-colors flex items-center justify-between">
      <span>亥位｜雷法變神終極超越</span><span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span>
    </button>
  </div>

  <!-- 側邊深度檢視抽屜 -->
  <aside id="side-drawer" class="absolute top-0 right-0 bottom-0 w-full sm:w-[480px] bg-slate-900/95 backdrop-blur-xl border-l border-slate-700/80 shadow-2xl p-6 flex flex-col z-20 transform translate-x-full transition-transform duration-300 ease-out custom-scrollbar overflow-y-auto">
    <div class="flex items-center justify-between pb-4 border-b border-slate-800">
      <div class="flex items-center gap-2">
        <span id="drawer-tag" class="text-[11px] px-2 py-0.5 rounded font-mono uppercase tracking-wider font-semibold"></span>
        <span id="drawer-status" class="text-[11px] text-amber-400/90 font-medium">考訂已審查</span>
      </div>
      <button onclick="closeDrawer()" class="p-1 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-slate-100 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- 標題與理論模式 -->
    <div class="mt-4">
      <div class="text-xs font-mono text-slate-400" id="drawer-coord">圓盤位階</div>
      <h2 id="drawer-title" class="text-xl font-bold text-slate-100 mt-1">概念節點</h2>
      <p id="drawer-subtitle" class="text-xs text-slate-300 mt-1 leading-relaxed"></p>
    </div>

    <!-- 動態填入的階層內容 -->
    <div id="drawer-dynamic-content" class="mt-5 flex-1 flex flex-col gap-4 text-xs text-slate-300"></div>

    <div class="mt-6 p-3 rounded-lg bg-slate-800/80 border border-slate-700/80 text-[11px] text-slate-400">
      <span class="font-semibold text-cyan-400 block mb-0.5">學術註腳與文獻對照</span>
      本系統各節點嚴格遵循芝加哥格式（Chicago Manual of Style），明確標示《正統道藏》經號（CT編號）、卷次與當代學術專著，以供相互對照核驗。
    </div>
  </aside>

  <!-- JavaScript 控制與非同步資料載入 -->
  <script>
    let ISLANDS_DATA = [];
    let scene, camera, renderer, controls;
    let raycaster, mouse;
    let currentMode = "beginner";
    let selectedIsland = null;
    const clickableMeshes = [];

    const INNER_RADIUS = 3.2;
    const RING_INNER = 3.6;
    const RING_OUTER = 9.4;
    const DISK_HEIGHT = 0.65;
    const TOTAL_SECTORS = 12;

    async function loadIslandsData() {
      try {
        const response = await fetch('./islands.json');
        if (!response.ok) {
          throw new Error(`HTTP 錯誤狀態碼: ${response.status}`);
        }
        ISLANDS_DATA = await response.json();

        ISLANDS_DATA.forEach(item => {
          if (typeof item.color === 'string') {
            item.color = parseInt(item.color, 16);
          }
        });

        initScene();
      } catch (error) {
        console.error("文獻載入失敗：", error);
        document.getElementById("canvas-container").innerHTML = `
          <div class="flex items-center justify-center h-full px-4">
            <div class="bg-rose-950/90 border border-rose-500 text-rose-200 px-6 py-5 rounded-xl max-w-lg text-sm shadow-2xl">
              <h3 class="font-bold text-base mb-2">⚠️ 文獻資料庫 (islands.json) 讀取失敗</h3>
              <p class="text-xs leading-relaxed text-rose-300 mb-2">若您是在本機直接雙擊開啟 HTML 檔案，瀏覽器安全性限制（CORS）會阻擋非同步讀取同目錄下的 JSON 檔案。</p>
              <p class="text-xs text-rose-400">請將檔案上傳至 GitHub Pages 託管，或在本機使用簡易 HTTP 伺服器（如 VS Code Live Server）開啟即可正常瀏覽。</p>
            </div>
          </div>
        `;
      }
    }

    function initScene() {
      const container = document.getElementById("canvas-container");

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060911);
      scene.fog = new THREE.FogExp2(0x060911, 0.02);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 21, 24);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = Math.PI / 2 - 0.05;
      controls.minDistance = 6;
      controls.maxDistance = 55;
      controls.target.set(0, 0, 0);

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      const ambientLight = new THREE.AmbientLight(0x23324d, 1.4);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xe2e8f0, 1.6);
      dirLight.position.set(12, 25, 14);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.bias = -0.0005;
      scene.add(dirLight);

      const centerLight = new THREE.PointLight(0x38bdf8, 2.2, 28);
      centerLight.position.set(0, 3, 0);
      scene.add(centerLight);

      createStarfield();
      buildDialSystem();

      window.addEventListener("resize", onWindowResize);
      window.addEventListener("pointerdown", onPointerDown);

      animate();
    }

    function createStarfield() {
      const starGeo = new THREE.BufferGeometry();
      const count = 450;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 140;
        positions[i + 1] = Math.random() * 50 - 5;
        positions[i + 2] = (Math.random() - 0.5) * 140;
      }
      starGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const starMat = new THREE.PointsMaterial({
        color: 0x94a3b8,
        size: 0.22,
        transparent: true,
        opacity: 0.55
      });
      scene.add(new THREE.Points(starGeo, starMat));
    }

    function buildDialSystem() {
      // 1. 中央天樞圓島 (北斗樞紐)
      const centerGeo = new THREE.CylinderGeometry(INNER_RADIUS, INNER_RADIUS, DISK_HEIGHT, 48);
      const centerMat = new THREE.MeshStandardMaterial({
        color: 0x111c30,
        roughness: 0.4,
        metalness: 0.3
      });
      const centerMesh = new THREE.Mesh(centerGeo, centerMat);
      centerMesh.receiveShadow = true;
      centerMesh.castShadow = true;

      const centerEdgeGeo = new THREE.EdgesGeometry(centerGeo);
      const centerEdgeMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.8 });
      centerMesh.add(new THREE.LineSegments(centerEdgeGeo, centerEdgeMat));

      const centerMarkerGeo = new THREE.OctahedronGeometry(0.85, 0);
      const centerMarkerMat = new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        emissive: 0x0284c7,
        emissiveIntensity: 0.5,
        roughness: 0.2
      });
      const centerMarker = new THREE.Mesh(centerMarkerGeo, centerMarkerMat);
      centerMarker.position.y = DISK_HEIGHT / 2 + 1.25;
      centerMesh.add(centerMarker);

      const beidouData = ISLANDS_DATA.find(d => d.id === "beidou");
      centerMesh.userData = {
        data: beidouData,
        markerMesh: centerMarker,
        focusPos: new THREE.Vector3(0, 0, 0)
      };
      scene.add(centerMesh);
      clickableMeshes.push(centerMesh);

      // 2. 外環十二等分扇區
      const sectorAngle = (Math.PI * 2) / TOTAL_SECTORS;
      const angleGap = 0.035;

      for (let i = 0; i < TOTAL_SECTORS; i++) {
        const startAng = i * sectorAngle + angleGap / 2;
        const endAng = (i + 1) * sectorAngle - angleGap / 2;

        const shape = new THREE.Shape();
        const segments = 24;
        for (let s = 0; s <= segments; s++) {
          const theta = startAng + (endAng - startAng) * (s / segments);
          const x = Math.cos(theta) * RING_OUTER;
          const y = Math.sin(theta) * RING_OUTER;
          if (s === 0) shape.moveTo(x, y);
          else shape.lineTo(x, y);
        }
        for (let s = segments; s >= 0; s--) {
          const theta = startAng + (endAng - startAng) * (s / segments);
          const x = Math.cos(theta) * RING_INNER;
          const y = Math.sin(theta) * RING_INNER;
          shape.lineTo(x, y);
        }
        shape.closePath();

        const extrudeSettings = {
          depth: DISK_HEIGHT,
          bevelEnabled: true,
          bevelSegments: 2,
          steps: 1,
          bevelSize: 0.05,
          bevelThickness: 0.05
        };

        const sectorGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        sectorGeo.rotateX(Math.PI / 2);

        const sectorData = ISLANDS_DATA.find(d => d.sectorIndex === i);
        const sectorMat = new THREE.MeshStandardMaterial({
          color: 0x16233b,
          roughness: 0.55,
          metalness: 0.2
        });

        const sectorMesh = new THREE.Mesh(sectorGeo, sectorMat);
        sectorMesh.position.y = DISK_HEIGHT / 2;
        sectorMesh.receiveShadow = true;
        sectorMesh.castShadow = true;

        const edgeGeo = new THREE.EdgesGeometry(sectorGeo);
        const edgeMat = new THREE.LineBasicMaterial({
          color: sectorData ? sectorData.color : 0x334155,
          transparent: true,
          opacity: 0.75
        });
        sectorMesh.add(new THREE.LineSegments(edgeGeo, edgeMat));

        const midAngle = i * sectorAngle + sectorAngle / 2;
        const midRadius = (RING_INNER + RING_OUTER) / 2;
        const posX = Math.cos(midAngle) * midRadius;
        const posZ = -Math.sin(midAngle) * midRadius;

        const markerGeo = new THREE.OctahedronGeometry(0.65, 0);
        const markerMat = new THREE.MeshStandardMaterial({
          color: sectorData.color,
          emissive: sectorData.color,
          emissiveIntensity: 0.4,
          roughness: 0.2
        });
        const marker = new THREE.Mesh(markerGeo, markerMat);
        marker.position.set(posX, DISK_HEIGHT / 2 + 1.15, posZ);
        marker.castShadow = true;
        scene.add(marker);

        sectorMesh.userData = {
          data: sectorData,
          markerMesh: marker,
          focusPos: new THREE.Vector3(posX, 0, posZ)
        };
        clickableMeshes.push(sectorMesh);
        scene.add(sectorMesh);
      }
    }

    function onPointerDown(event) {
      if (event.clientX > window.innerWidth - 480 && !document.getElementById("side-drawer").classList.contains("translate-x-full")) {
        return;
      }

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(clickableMeshes, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj && !obj.userData.data && obj.parent) {
          obj = obj.parent;
        }
        if (obj && obj.userData && obj.userData.data) {
          selectIsland(obj.userData);
        }
      }
    }

    function selectIsland(userData) {
      selectedIsland = userData.data;
      const targetPos = userData.focusPos;

      new TWEEN.Tween(controls.target)
        .to({ x: targetPos.x, y: 0.5, z: targetPos.z }, 800)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      new TWEEN.Tween(camera.position)
        .to({ x: targetPos.x + 5, y: 8, z: targetPos.z + 8 }, 800)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      renderDrawer();
    }

    function selectIslandById(id) {
      const mesh = clickableMeshes.find(m => m.userData.data && m.userData.data.id === id);
      if (mesh) {
        selectIsland(mesh.userData);
      }
    }

    function setReaderMode(mode) {
      currentMode = mode;
      document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.classList.remove("bg-indigo-600", "text-white", "shadow-md");
        btn.classList.add("text-slate-300");
      });
      const activeBtn = document.getElementById(`btn-${mode}`);
      if (activeBtn) {
        activeBtn.classList.remove("text-slate-300");
        activeBtn.classList.add("bg-indigo-600", "text-white", "shadow-md");
      }

      if (selectedIsland) {
        renderDrawer();
      }
    }

    function renderDrawer() {
      if (!selectedIsland) return;

      const drawer = document.getElementById("side-drawer");
      drawer.classList.remove("translate-x-full");

      document.getElementById("drawer-title").textContent = selectedIsland.title;
      document.getElementById("drawer-subtitle").textContent = selectedIsland.subtitle;

      const posText = selectedIsland.isCenter 
        ? "天盤樞機：中央天極" 
        : `圓盤位階：第 ${selectedIsland.sectorIndex + 1} 辰位 / 12 等分（${selectedIsland.modelType}）`;
      document.getElementById("drawer-coord").textContent = posText;
      
      const tag = document.getElementById("drawer-tag");
      tag.textContent = selectedIsland.modelType;
      tag.style.backgroundColor = `${selectedIsland.hexColor}25`;
      tag.style.color = selectedIsland.hexColor;
      tag.style.borderColor = `${selectedIsland.hexColor}50`;

      const contentBox = document.getElementById("drawer-dynamic-content");
      contentBox.innerHTML = "";

      if (currentMode === "beginner") {
        contentBox.innerHTML = `
          <div class="space-y-4">
            <div class="p-3.5 rounded-lg bg-indigo-950/40 border border-indigo-700/50">
              <span class="text-[10px] uppercase font-mono font-bold text-indigo-400 block mb-1">【步驟一：問題導讀】</span>
              <p class="text-xs font-medium text-slate-100 leading-snug">${selectedIsland.beginner.step1_question}</p>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-slate-400 block mb-1">【步驟二：概念簡介】</span>
              <p class="text-xs text-slate-300 leading-relaxed">${selectedIsland.beginner.step2_concept}</p>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-emerald-400 block mb-1">【步驟三：材料例證】</span>
              <blockquote class="text-xs text-emerald-200/90 font-serif border-l-2 border-emerald-500 pl-2.5 py-0.5 leading-relaxed">
                ${selectedIsland.beginner.step3_evidence}
              </blockquote>
            </div>
          </div>
        `;
      } else if (currentMode === "course") {
        const materialsList = selectedIsland.course.materials
          .map(m => `<li class="font-serif text-slate-200 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>${m}</li>`)
          .join("");

        contentBox.innerHTML = `
          <div class="space-y-4">
            <div class="p-3.5 rounded-lg bg-amber-950/30 border border-amber-600/40">
              <span class="text-[10px] uppercase font-mono font-bold text-amber-400 block mb-1">【課程主題地圖位階】</span>
              <p class="text-xs font-medium text-slate-100">${selectedIsland.course.topicMap}</p>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-slate-400 block mb-1.5">【本單元研讀文獻書目】</span>
              <ul class="space-y-1.5 text-xs">${materialsList}</ul>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-cyan-400 block mb-1">【課堂思辨與比較問題】</span>
              <p class="text-xs text-slate-300 leading-relaxed">${selectedIsland.course.comparisons}</p>
            </div>
          </div>
        `;
      } else if (currentMode === "researcher") {
        contentBox.innerHTML = `
          <div class="space-y-4 font-mono text-[11px]">
            <div class="p-3 rounded-lg bg-slate-800/80 border border-slate-700">
              <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1 font-sans">【索引檢索詞 (Search Terms)】</span>
              <code class="text-amber-300 text-xs">${selectedIsland.researcher.searchTerms}</code>
            </div>
            <div class="p-3 rounded-lg bg-slate-800/80 border border-slate-700">
              <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1 font-sans">【原典圖像 / 寫本標引】</span>
              <div class="p-2 bg-slate-900 rounded border border-slate-800 text-slate-300 flex items-center justify-between">
                <span>${selectedIsland.researcher.imageRef}</span>
                <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 font-sans">經本圖示</span>
              </div>
            </div>
            <div class="p-3 rounded-lg bg-rose-950/30 border border-rose-700/40">
              <span class="text-[10px] uppercase font-bold text-rose-400 block mb-1 font-sans">【版本考異與文獻爭議】</span>
              <p class="text-slate-300 font-sans leading-relaxed text-xs">${selectedIsland.researcher.dispute}</p>
            </div>
            <div class="p-3 rounded-lg bg-slate-800/80 border border-slate-700">
              <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1 font-sans">【芝加哥格式原文註腳 (Chicago Citation)】</span>
              <div class="p-2 rounded bg-slate-950/70 border border-slate-800 font-serif text-slate-200 text-xs leading-relaxed">
                ${selectedIsland.researcher.citations}
              </div>
            </div>
          </div>
        `;
      }
    }

    function closeDrawer() {
      document.getElementById("side-drawer").classList.add("translate-x-full");
      selectedIsland = null;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update();
      controls.update();

      const t = time * 0.0015;
      clickableMeshes.forEach((mesh, idx) => {
        const marker = mesh.userData.markerMesh;
        if (marker) {
          marker.rotation.y = t * 0.6 + idx;
          marker.rotation.x = Math.sin(t + idx) * 0.15;
          marker.position.y = (DISK_HEIGHT / 2 + 1.15) + Math.sin(t * 1.5 + idx) * 0.08;
        }
      });

      renderer.render(scene, camera);
    }

    loadIslandsData();
  </script>
</body>
</html>
