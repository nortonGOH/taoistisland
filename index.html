<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星辰・命籍・身命 政策與概念島</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js, OrbitControls, TWEEN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 3px;
    }
  </style>
</head>
<body class="relative select-none">

  <!-- 3D 渲染畫布容器 -->
  <div id="canvas-container" class="absolute inset-0"></div>

  <!-- 頂部標題與主問題面板 -->
  <header class="absolute top-4 left-4 right-4 md:right-auto md:w-[480px] z-10 pointer-events-none">
    <div class="bg-slate-900/85 backdrop-blur-md p-4 rounded-xl border border-slate-700/80 shadow-2xl pointer-events-auto">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40">文獻概念島原型</span>
        <span class="text-xs text-slate-400">平頂六角拓撲體系</span>
      </div>
      <h1 class="text-base font-bold text-slate-100 tracking-wide mb-1.5">
        不同時期與文本，如何描述星辰、命籍、身體與生命之間的關係？
      </h1>
      <p class="text-xs text-slate-300 leading-relaxed">
        節點目前歸入「待核對／待整理」狀態；未經嚴格文獻原句引據與版本考訂者，暫不建立協作連線，保留學術存疑空間。
      </p>
    </div>
  </header>

  <!-- 閱讀路徑切換列 (初學者 / 課程 / 研究者) -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 flex gap-2 bg-slate-900/90 backdrop-blur-md p-1.5 rounded-2xl border border-slate-700/90 shadow-xl">
    <button onclick="setReaderMode('beginner')" id="btn-beginner" class="mode-btn px-3.5 py-1.5 rounded-xl text-xs font-medium transition-all bg-indigo-600 text-white shadow-md">
      初學者導讀
    </button>
    <button onclick="setReaderMode('course')" id="btn-course" class="mode-btn px-3.5 py-1.5 rounded-xl text-xs font-medium transition-all text-slate-300 hover:text-white hover:bg-slate-800">
      課程地圖
    </button>
    <button onclick="setReaderMode('researcher')" id="btn-researcher" class="mode-btn px-3.5 py-1.5 rounded-xl text-xs font-medium transition-all text-slate-300 hover:text-white hover:bg-slate-800">
      研究者考證
    </button>
  </div>

  <!-- 節點速選入口懸浮列 -->
  <div id="quick-entry-menu" class="absolute top-4 right-4 z-10 hidden md:flex flex-col gap-1.5 bg-slate-900/80 backdrop-blur-md p-2 rounded-xl border border-slate-700/70 text-xs">
    <span class="text-[10px] text-slate-400 font-mono uppercase px-2 mb-0.5">Core Entries</span>
    <button onclick="focusIslandById('beidou')" class="px-3 py-1.5 text-left rounded-lg hover:bg-slate-800 text-slate-200 transition-colors flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-cyan-400"></span>北斗 (Beidou)
    </button>
    <button onclick="focusIslandById('siming')" class="px-3 py-1.5 text-left rounded-lg hover:bg-slate-800 text-slate-200 transition-colors flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-amber-400"></span>司命 (Siming)
    </button>
    <button onclick="focusIslandById('benming')" class="px-3 py-1.5 text-left rounded-lg hover:bg-slate-800 text-slate-200 transition-colors flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-400"></span>本命 (Benming)
    </button>
    <button onclick="focusIslandById('mingji')" class="px-3 py-1.5 text-left rounded-lg hover:bg-slate-800 text-slate-200 transition-colors flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-rose-400"></span>命籍 (Mingji)
    </button>
  </div>

  <!-- 側邊深度檢視抽屜 -->
  <aside id="side-drawer" class="absolute top-0 right-0 bottom-0 w-full sm:w-[420px] bg-slate-900/95 backdrop-blur-xl border-l border-slate-700/80 shadow-2xl p-6 flex flex-col z-20 transform translate-x-full transition-transform duration-300 ease-out custom-scrollbar overflow-y-auto">
    <div class="flex items-center justify-between pb-4 border-b border-slate-800">
      <div class="flex items-center gap-2">
        <span id="drawer-tag" class="text-[11px] px-2 py-0.5 rounded font-mono uppercase tracking-wider"></span>
        <span id="drawer-status" class="text-[11px] text-slate-400">待材料核對</span>
      </div>
      <button onclick="closeDrawer()" class="p-1 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-slate-100 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- 標題與軸向坐標 -->
    <div class="mt-4">
      <div class="text-xs font-mono text-slate-400" id="drawer-coord">Axial (q, r): 0, 0</div>
      <h2 id="drawer-title" class="text-2xl font-bold text-slate-100 mt-1">概念島嶼</h2>
    </div>

    <!-- 依閱讀模式動態填入內容 -->
    <div id="drawer-dynamic-content" class="mt-6 flex-1 flex flex-col gap-5 text-xs text-slate-300"></div>

    <div class="mt-6 p-3 rounded-lg bg-slate-800/80 border border-slate-700/80 text-[11px] text-slate-400">
      <span class="font-semibold text-amber-400 block mb-0.5">⚠️ 連線檢驗原則</span>
      若缺乏具體年代之出土簡帛、道藏經卷、正史志書或星曆算表之相互引據，跨概念弧線維持虛擬或隱藏，避免將後世推論倒填為早期定論。
    </div>
  </aside>

  <!-- JavaScript 控制邏輯 -->
  <script>
    let ISLANDS_DATA = [];
    let scene, camera, renderer, controls;
    let raycaster, mouse;
    let currentMode = "beginner";
    let selectedIsland = null;
    const islandMeshes = [];

    const HEX_RADIUS = 3.6;
    const HEX_HEIGHT = 0.8;

    // 平頂六角座標轉換 (q, r -> x, z)
    function hexToWorld(q, r, radius) {
      const x = radius * (3 / 2 * q);
      const z = radius * (Math.sqrt(3) / 2 * q + Math.sqrt(3) * r);
      return { x, z };
    }

    // 非同步載入同層級的 islands.json
    async function loadIslandsData() {
      try {
        const response = await fetch('./islands.json');
        if (!response.ok) {
          throw new Error(`HTTP 錯誤狀態碼: ${response.status}`);
        }
        ISLANDS_DATA = await response.json();

        // 轉換 16 進位顏色字串為數值
        ISLANDS_DATA.forEach(item => {
          if (typeof item.color === 'string') {
            item.color = parseInt(item.color, 16);
          }
        });

        initScene();
      } catch (error) {
        console.error("文獻載入失敗：", error);
        document.getElementById("canvas-container").innerHTML = `
          <div class="flex items-center justify-center h-full px-4">
            <div class="bg-rose-950/90 border border-rose-500 text-rose-200 px-6 py-5 rounded-xl max-w-lg text-sm shadow-2xl">
              <h3 class="font-bold text-base mb-2">⚠️ 文獻資料庫 (islands.json) 讀取失敗</h3>
              <p class="text-xs leading-relaxed text-rose-300 mb-3">若您是直接以「點兩下開啟檔案 (file:///)」方式檢視，瀏覽器安全性限制（CORS）會阻擋非同步讀取。</p>
              <p class="text-xs text-rose-400">請將檔案上傳至 GitHub Pages 託管，或在本機以簡易伺服器（如 VS Code Live Server）開啟。</p>
            </div>
          </div>
        `;
      }
    }

    function initScene() {
      const container = document.getElementById("canvas-container");

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0e17);
      scene.fog = new THREE.FogExp2(0x0a0e17, 0.025);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 18, 22);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = Math.PI / 2 - 0.05;
      controls.minDistance = 6;
      controls.maxDistance = 50;
      controls.target.set(0, 0, 0);

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      const ambientLight = new THREE.AmbientLight(0x2a3b5c, 1.2);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xe2e8f0, 1.5);
      dirLight.position.set(12, 24, 15);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.bias = -0.0005;
      scene.add(dirLight);

      const fillLight = new THREE.PointLight(0x38bdf8, 1.8, 40);
      fillLight.position.set(-10, 8, -8);
      scene.add(fillLight);

      createStarfield();
      buildIslands();

      window.addEventListener("resize", onWindowResize);
      window.addEventListener("pointerdown", onPointerDown);

      animate();
    }

    function createStarfield() {
      const starGeo = new THREE.BufferGeometry();
      const count = 400;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 120;
        positions[i + 1] = Math.random() * 40 - 5;
        positions[i + 2] = (Math.random() - 0.5) * 120;
      }
      starGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const starMat = new THREE.PointsMaterial({
        color: 0x94a3b8,
        size: 0.25,
        transparent: true,
        opacity: 0.6
      });
      const stars = new THREE.Points(starGeo, starMat);
      scene.add(stars);
    }

    function buildIslands() {
      ISLANDS_DATA.forEach(data => {
        const { x, z } = hexToWorld(data.q, data.r, HEX_RADIUS);
        const islandGroup = new THREE.Group();
        islandGroup.position.set(x, 0, z);

        const hexGeo = new THREE.CylinderGeometry(HEX_RADIUS * 0.92, HEX_RADIUS * 0.95, HEX_HEIGHT, 6);
        const hexMat = new THREE.MeshStandardMaterial({
          color: 0x1e293b,
          roughness: 0.5,
          metalness: 0.2,
          flatShading: true
        });
        const hexMesh = new THREE.Mesh(hexGeo, hexMat);
        hexMesh.rotation.y = Math.PI / 6;
        hexMesh.receiveShadow = true;
        hexMesh.castShadow = true;
        islandGroup.add(hexMesh);

        const edgeGeo = new THREE.EdgesGeometry(hexGeo);
        const edgeMat = new THREE.LineBasicMaterial({
          color: data.color,
          linewidth: 2,
          transparent: true,
          opacity: 0.7
        });
        const edgeLine = new THREE.LineSegments(edgeGeo, edgeMat);
        edgeLine.rotation.y = Math.PI / 6;
        edgeLine.position.y = 0.01;
        islandGroup.add(edgeLine);

        const markerGeo = new THREE.OctahedronGeometry(0.7, 0);
        const markerMat = new THREE.MeshStandardMaterial({
          color: data.color,
          emissive: data.color,
          emissiveIntensity: 0.35,
          roughness: 0.3
        });
        const markerMesh = new THREE.Mesh(markerGeo, markerMat);
        markerMesh.position.y = HEX_HEIGHT / 2 + 1.2;
        markerMesh.castShadow = true;
        islandGroup.add(markerMesh);

        islandGroup.userData = {
          data: data,
          markerMesh: markerMesh
        };

        scene.add(islandGroup);
        islandMeshes.push(islandGroup);
      });
    }

    function onPointerDown(event) {
      if (event.clientX > window.innerWidth - 420 && !document.getElementById("side-drawer").classList.contains("translate-x-full")) {
        return;
      }

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) *
