<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>道教科儀與思想史：靈寶五劫天輪式盤系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js, OrbitControls, TWEEN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background-color: #060911;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 3px;
    }
  </style>
</head>
<body class="relative select-none">

  <!-- 3D 渲染畫布容器 -->
  <div id="canvas-container" class="absolute inset-0"></div>

  <!-- 頂部學術導言與核心問題面板 -->
  <header class="absolute top-4 left-4 right-4 md:right-auto md:w-[500px] z-10 pointer-events-none">
    <div class="bg-slate-900/90 backdrop-blur-md p-4 rounded-xl border border-slate-700/80 shadow-2xl pointer-events-auto">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/40">靈寶大劫運度專題</span>
        <span class="text-xs text-slate-400">玄都玉京樞紐 × 靈寶五劫天輪</span>
      </div>
      <h1 class="text-sm font-bold text-slate-100 tracking-wide mb-1.5 leading-snug">
        道教科儀與思想史：靈寶五劫天輪式盤系統
      </h1>
      <p class="text-[11px] text-slate-300 leading-relaxed">
        中央為玄都玉京真文母源；外環巨型扇區（內徑 9.7、外徑 12.5）獨立呈現靈寶五劫（龍漢、延康、赤明、開皇、上皇）之宇宙大劫運度與文獻考證。
      </p>
    </div>
  </header>

  <!-- 閱讀路徑切換列 (初學者 / 課程 / 研究者) -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 flex gap-2 bg-slate-900/90 backdrop-blur-md p-1.5 rounded-2xl border border-slate-700/90 shadow-xl">
    <button onclick="setReaderMode('beginner')" id="btn-beginner" class="mode-btn px-3.5 py-1.5 rounded-xl text-xs font-medium transition-all bg-indigo-600 text-white shadow-md">
      初學者導讀
    </button>
    <button onclick="setReaderMode('course')" id="btn-course" class="mode-btn px-3.5 py-1.5 rounded-xl text-xs font-medium transition-all text-slate-300 hover:text-white hover:bg-slate-800">
      課程地圖
    </button>
    <button onclick="setReaderMode('researcher')" id="btn-researcher" class="mode-btn px-3.5 py-1.5 rounded-xl text-xs font-medium transition-all text-slate-300 hover:text-white hover:bg-slate-800">
      研究者考證
    </button>
  </div>

  <!-- 靈寶五劫天輪專屬入口速選列 -->
  <div class="absolute top-4 right-4 z-10 hidden lg:flex flex-col gap-1 bg-slate-900/85 backdrop-blur-md p-2 rounded-xl border border-slate-700/70 text-xs w-68 max-h-[85vh] overflow-y-auto custom-scrollbar">
    <span class="text-[10px] text-cyan-400 font-bold px-2 py-1 uppercase tracking-wider">靈寶五劫天輪選單</span>
    <button onclick="selectIslandById('beidou')" class="px-2.5 py-1.5 text-left rounded-lg hover:bg-slate-800 text-slate-200 transition-colors flex items-center justify-between">
      <span>中央樞紐：玄都玉京天台</span><span class="w-2 h-2 rounded-full bg-cyan-400"></span>
    </button>

    <div class="h-px bg-slate-800 my-1"></div>
    <span class="text-[9px] text-slate-400 px-2 uppercase font-semibold">【外環：靈寶經派五劫期】</span>
    <button onclick="selectIslandById('kalpa_longhan')" class="px-2.5 py-1.5 text-left rounded-lg hover:bg-slate-800 text-slate-200 transition-colors flex items-center justify-between">
      <span>🌌 龍漢劫｜真文始萌・人民淳樸</span><span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
    </button>
    <button onclick="selectIslandById('kalpa_yankang')" class="px-2.5 py-1.5 text-left rounded-lg hover:bg-slate-800 text-slate-200 transition-colors flex items-center justify-between">
      <span>🌑 延康劫｜真文隱光・天地幽冥</span><span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
    </button>
    <button onclick="selectIslandById('kalpa_chiming')" class="px-2.5 py-1.5 text-left rounded-lg hover:bg-slate-800 text-slate-200 transition-colors flex items-center justify-between">
      <span>🔥 赤明劫｜赤明開光・天地復位</span><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
    </button>
    <button onclick="selectIslandById('kalpa_kaihuang')" class="px-2.5 py-1.5 text-left rounded-lg hover:bg-slate-800 text-slate-200 transition-colors flex items-center justify-between">
      <span>☀️ 開皇劫｜開通三象・天地復正</span><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
    </button>
    <button onclick="selectIslandById('kalpa_shanghuang')" class="px-2.5 py-1.5 text-left rounded-lg hover:bg-slate-800 text-slate-200 transition-colors flex items-center justify-between">
      <span>✨ 上皇劫｜人心日偽・廣行救度</span><span class="w-1.5 h-1.5 rounded-full bg-purple-400"></span>
    </button>
  </div>

  <!-- 側邊深度檢視抽屜 -->
  <aside id="side-drawer" class="absolute top-0 right-0 bottom-0 w-full sm:w-[480px] bg-slate-900/95 backdrop-blur-xl border-l border-slate-700/80 shadow-2xl p-6 flex flex-col z-20 transform translate-x-full transition-transform duration-300 ease-out custom-scrollbar overflow-y-auto">
    <div class="flex items-center justify-between pb-4 border-b border-slate-800">
      <div class="flex items-center gap-2">
        <span id="drawer-tag" class="text-[11px] px-2 py-0.5 rounded font-mono uppercase tracking-wider font-semibold"></span>
        <span id="drawer-status" class="text-[11px] text-cyan-400 font-medium">考證已審查</span>
      </div>
      <button onclick="closeDrawer()" class="p-1 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-slate-100 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="mt-4">
      <div class="text-xs font-mono text-slate-400" id="drawer-coord">天輪樞機</div>
      <h2 id="drawer-title" class="text-xl font-bold text-slate-100 mt-1">劫期節點</h2>
      <p id="drawer-subtitle" class="text-xs text-slate-300 mt-1 leading-relaxed"></p>
    </div>

    <div id="drawer-dynamic-content" class="mt-5 flex-1 flex flex-col gap-4 text-xs text-slate-300"></div>
  </aside>

  <!-- 中央彈出式對話方塊 (Modal Dialog) -->
  <div id="narrative-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md hidden transition-opacity duration-200">
    <div class="relative w-full max-w-2xl bg-slate-900/95 border border-cyan-500/40 rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-950/60">
        <div class="flex items-center gap-2.5">
          <span class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span>
          <span class="text-xs font-semibold px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">步驟四：深度論述</span>
          <h3 id="modal-title" class="text-sm font-bold text-slate-100">文獻專題闡釋</h3>
        </div>
        <button onclick="closeNarrativeModal()" class="p-1 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-slate-100 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modal-body" class="p-6 overflow-y-auto custom-scrollbar text-sm text-slate-200 leading-relaxed space-y-3.5 font-sans"></div>
      <div class="flex justify-end px-6 py-3 border-t border-slate-800 bg-slate-950/40">
        <button onclick="closeNarrativeModal()" class="px-4 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 transition-colors">
          關閉
        </button>
      </div>
    </div>
  </div>

  <!-- JavaScript 控制與獨立五劫天輪生成 -->
  <script>
    let ISLANDS_DATA = [];
    let scene, camera, renderer, controls;
    let raycaster, mouse;
    let currentMode = "beginner";
    let selectedIsland = null;
    const clickableMeshes = [];

    // 天輪幾何尺寸：中央天樞半徑 3.8，外環靈寶五劫扇區 內徑 9.7、外徑 12.5（無十二辰環）
    const INNER_RADIUS = 3.8;
    const KALPA_RING_INNER = 9.7;
    const KALPA_RING_OUTER = 12.5;
    const DISK_HEIGHT = 0.7;
    const TOTAL_KALPAS = 5;

    const KALPA_BADGES = [
      { id: "kalpa_longhan", name: "龍漢", emoji: "🌌", color: "#38bdf8" },
      { id: "kalpa_yankang", name: "延康", emoji: "🌑", color: "#94a3b8" },
      { id: "kalpa_chiming", name: "赤明", emoji: "🔥", color: "#f97316" },
      { id: "kalpa_kaihuang", name: "開皇", emoji: "☀️", color: "#10b981" },
      { id: "kalpa_shanghuang", name: "上皇", emoji: "✨", color: "#a855f7" }
    ];

    function createBadgeTexture(emoji, text, colorHex) {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");

      ctx.beginPath();
      ctx.arc(128, 128, 110, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
      ctx.fill();
      ctx.lineWidth = 8;
      ctx.strokeStyle = colorHex;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(128, 128, 96, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(226, 232, 240, 0.35)";
      ctx.stroke();

      ctx.font = "80px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(emoji, 128, 105);

      ctx.font = "bold 38px sans-serif";
      ctx.fillStyle = colorHex;
      ctx.fillText(text, 128, 185);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    async function loadIslandsData() {
      try {
        const response = await fetch('./islands.json');
        if (!response.ok) {
          throw new Error(`HTTP 錯誤狀態碼: ${response.status}`);
        }
        ISLANDS_DATA = await response.json();

        ISLANDS_DATA.forEach(item => {
          if (typeof item.color === 'string') {
            item.color = parseInt(item.color, 16);
          }
        });

        initScene();
      } catch (error) {
        console.error("資料載入失敗：", error);
        document.getElementById("canvas-container").innerHTML = `
          <div class="flex items-center justify-center h-full px-4">
            <div class="bg-rose-950/90 border border-rose-500 text-rose-200 px-6 py-5 rounded-xl max-w-lg text-sm shadow-2xl">
              <h3 class="font-bold text-base mb-2">⚠️ 資料庫 (islands.json) 讀取失敗</h3>
              <p class="text-xs leading-relaxed text-rose-300 mb-2">請確認本機有開啟 HTTP 伺服器，或已正確發布至 GitHub Pages。</p>
            </div>
          </div>
        `;
      }
    }

    function initScene() {
      const container = document.getElementById("canvas-container");

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060911);
      scene.fog = new THREE.FogExp2(0x060911, 0.016);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 26, 30);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = Math.PI / 2 - 0.05;
      controls.minDistance = 6;
      controls.maxDistance = 75;
      controls.target.set(0, 0, 0);

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      const ambientLight = new THREE.AmbientLight(0x23324d, 1.5);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xe2e8f0, 1.8);
      dirLight.position.set(15, 30, 18);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.bias = -0.0005;
      scene.add(dirLight);

      const centerLight = new THREE.PointLight(0x38bdf8, 2.8, 35);
      centerLight.position.set(0, 4, 0);
      scene.add(centerLight);

      createStarfield();
      buildDialSystem();

      window.addEventListener("resize", onWindowResize);
      window.addEventListener("pointerdown", onPointerDown);

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeNarrativeModal();
        }
      });

      animate();
    }

    function createStarfield() {
      const starGeo = new THREE.BufferGeometry();
      const count = 600;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 180;
        positions[i + 1] = Math.random() * 70 - 5;
        positions[i + 2] = (Math.random() - 0.5) * 180;
      }
      starGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const starMat = new THREE.PointsMaterial({
        color: 0x94a3b8,
        size: 0.22,
        transparent: true,
        opacity: 0.55
      });
      scene.add(new THREE.Points(starGeo, starMat));
    }

    // 建立厚度扇區模型
    function createSectorMesh(startAng, endAng, innerR, outerR, colorHex) {
      const shape = new THREE.Shape();
      const segments = 32;
      for (let s = 0; s <= segments; s++) {
        const theta = startAng + (endAng - startAng) * (s / segments);
        const x = Math.cos(theta) * outerR;
        const y = Math.sin(theta) * outerR;
        if (s === 0) shape.moveTo(x, y);
        else shape.lineTo(x, y);
      }
      for (let s = segments; s >= 0; s--) {
        const theta = startAng + (endAng - startAng) * (s / segments);
        const x = Math.cos(theta) * innerR;
        const y = Math.sin(theta) * innerR;
        shape.lineTo(x, y);
      }
      shape.closePath();

      const extrudeSettings = {
        depth: DISK_HEIGHT,
        bevelEnabled: true,
        bevelSegments: 2,
        steps: 1,
        bevelSize: 0.06,
        bevelThickness: 0.06
      };

      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.rotateX(Math.PI / 2);

      const mat = new THREE.MeshStandardMaterial({
        color: 0x111c30,
        roughness: 0.5,
        metalness: 0.25
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = DISK_HEIGHT / 2;
      mesh.receiveShadow = true;
      mesh.castShadow = true;

      const edgeGeo = new THREE.EdgesGeometry(geo);
      const edgeMat = new THREE.LineBasicMaterial({
        color: colorHex,
        transparent: true,
        opacity: 0.85
      });
      mesh.add(new THREE.LineSegments(edgeGeo, edgeMat));

      return mesh;
    }

    function buildDialSystem() {
      // 1. 中央玄都玉京天樞樞紐圓台 (不含十二辰宮)
      const centerGeo = new THREE.CylinderGeometry(INNER_RADIUS, INNER_RADIUS, DISK_HEIGHT, 48);
      const centerMat = new THREE.MeshStandardMaterial({
        color: 0x0f1a2e,
        roughness: 0.35,
        metalness: 0.4
      });
      const centerMesh = new THREE.Mesh(centerGeo, centerMat);
      centerMesh.receiveShadow = true;
      centerMesh.castShadow = true;

      const centerEdgeGeo = new THREE.EdgesGeometry(centerGeo);
      const centerEdgeMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.85 });
      centerMesh.add(new THREE.LineSegments(centerEdgeGeo, centerEdgeMat));

      // 中央懸浮八面體金光結晶
      const crystalGeo = new THREE.OctahedronGeometry(1.1, 0);
      const crystalMat = new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        emissive: 0x0284c7,
        emissiveIntensity: 0.7,
        roughness: 0.15
      });
      const crystalMesh = new THREE.Mesh(crystalGeo, crystalMat);
      crystalMesh.position.y = DISK_HEIGHT / 2 + 1.4;
      centerMesh.add(crystalMesh);

      const beidouData = ISLANDS_DATA.find(d => d.id === "beidou");
      centerMesh.userData = {
        data: beidouData,
        markerMesh: crystalMesh,
        focusPos: new THREE.Vector3(0, 0, 0)
      };
      scene.add(centerMesh);
      clickableMeshes.push(centerMesh);

      // 2. 獨立環：靈寶五劫天輪 (內徑 9.7、外徑 12.5，五等分巨型扇區)
      const kalpaAngle = (Math.PI * 2) / TOTAL_KALPAS;
      const kalpaGap = 0.035;

      for (let k = 0; k < TOTAL_KALPAS; k++) {
        const startAng = k * kalpaAngle + kalpaGap / 2;
        const endAng = (k + 1) * kalpaAngle - kalpaGap / 2;

        const kalpaData = ISLANDS_DATA.find(d => d.kalpaIndex === k);
        const kalpaMesh = createSectorMesh(startAng, endAng, KALPA_RING_INNER, KALPA_RING_OUTER, kalpaData ? kalpaData.hexColor : "#38bdf8");

        const midAngle = k * kalpaAngle + kalpaAngle / 2;
        const midRadius = (KALPA_RING_INNER + KALPA_RING_OUTER) / 2;
        const posX = Math.cos(midAngle) * midRadius;
        const posZ = -Math.sin(midAngle) * midRadius;

        const kBadge = KALPA_BADGES[k];
        const badgeTexture = createBadgeTexture(kBadge.emoji, `${kBadge.name}劫`, kalpaData ? kalpaData.hexColor : "#38bdf8");
        const spriteMat = new THREE.SpriteMaterial({ map: badgeTexture, transparent: true, depthTest: true });
        const badgeSprite = new THREE.Sprite(spriteMat);
        badgeSprite.scale.set(1.9, 1.9, 1.0);
        badgeSprite.position.set(posX, DISK_HEIGHT / 2 + 1.5, posZ);
        scene.add(badgeSprite);

        kalpaMesh.userData = {
          data: kalpaData,
          markerMesh: badgeSprite,
          focusPos: new THREE.Vector3(posX, 0, posZ)
        };
        badgeSprite.userData = kalpaMesh.userData;

        clickableMeshes.push(kalpaMesh);
        clickableMeshes.push(badgeSprite);
        scene.add(kalpaMesh);
      }
    }

    function onPointerDown(event) {
      if (
        (event.clientX > window.innerWidth - 500 && !document.getElementById("side-drawer").classList.contains("translate-x-full")) ||
        !document.getElementById("narrative-modal").classList.contains("hidden")
      ) {
        return;
      }

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(clickableMeshes, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj && !obj.userData.data && obj.parent) {
          obj = obj.parent;
        }
        if (obj && obj.userData && obj.userData.data) {
          selectIsland(obj.userData);
        }
      }
    }

    function selectIsland(userData) {
      selectedIsland = userData.data;
      const targetPos = userData.focusPos;

      new TWEEN.Tween(controls.target)
        .to({ x: targetPos.x, y: 0.5, z: targetPos.z }, 800)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      new TWEEN.Tween(camera.position)
        .to({ x: targetPos.x + 6, y: 9, z: targetPos.z + 10 }, 800)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      renderDrawer();
    }

    function selectIslandById(id) {
      const mesh = clickableMeshes.find(m => m.userData.data && m.userData.data.id === id);
      if (mesh) {
        selectIsland(mesh.userData);
      }
    }

    function setReaderMode(mode) {
      currentMode = mode;
      document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.classList.remove("bg-indigo-600", "text-white", "shadow-md");
        btn.classList.add("text-slate-300");
      });
      const activeBtn = document.getElementById(`btn-${mode}`);
      if (activeBtn) {
        activeBtn.classList.remove("text-slate-300");
        activeBtn.classList.add("bg-indigo-600", "text-white", "shadow-md");
      }

      if (selectedIsland) {
        renderDrawer();
      }
    }

    function openNarrativeModal() {
      if (!selectedIsland) return;
      const modal = document.getElementById("narrative-modal");
      document.getElementById("modal-title").textContent = `${selectedIsland.title}・深度考證論述`;
      document.getElementById("modal-body").innerHTML = selectedIsland.beginner.step4_narrative || "<p>暫無詳細論述。</p>";
      modal.classList.remove("hidden");
    }

    function closeNarrativeModal() {
      const modal = document.getElementById("narrative-modal");
      modal.classList.add("hidden");
    }

    document.getElementById("narrative-modal").addEventListener("click", (e) => {
      if (e.target.id === "narrative-modal") {
        closeNarrativeModal();
      }
    });

    function renderDrawer() {
      if (!selectedIsland) return;

      const drawer = document.getElementById("side-drawer");
      drawer.classList.remove("translate-x-full");

      document.getElementById("drawer-title").textContent = selectedIsland.title;
      document.getElementById("drawer-subtitle").textContent = selectedIsland.subtitle;

      let posText = "天輪樞機：玄都玉京天台";
      if (selectedIsland.isKalpa) {
        posText = `靈寶大劫天輪：第 ${selectedIsland.kalpaIndex + 1} 劫期【${selectedIsland.title.split('：')[0]}】（${selectedIsland.modelType}）`;
      }
      document.getElementById("drawer-coord").textContent = posText;
      
      const tag = document.getElementById("drawer-tag");
      tag.textContent = selectedIsland.modelType;
      tag.style.backgroundColor = `${selectedIsland.hexColor}25`;
      tag.style.color = selectedIsland.hexColor;
      tag.style.borderColor = `${selectedIsland.hexColor}50`;

      const contentBox = document.getElementById("drawer-dynamic-content");
      contentBox.innerHTML = "";

      if (currentMode === "beginner") {
        contentBox.innerHTML = `
          <div class="space-y-4">
            <div class="p-3.5 rounded-lg bg-indigo-950/40 border border-indigo-700/50">
              <span class="text-[10px] uppercase font-mono font-bold text-indigo-400 block mb-1">【步驟一：問題導讀】</span>
              <p class="text-xs font-medium text-slate-100 leading-snug">${selectedIsland.beginner.step1_question}</p>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-slate-400 block mb-1">【步驟二：概念簡介】</span>
              <p class="text-xs text-slate-300 leading-relaxed">${selectedIsland.beginner.step2_concept}</p>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-emerald-400 block mb-1">【步驟三：材料例證】</span>
              <blockquote class="text-xs text-emerald-200/90 font-serif border-l-2 border-emerald-500 pl-2.5 py-0.5 leading-relaxed">
                ${selectedIsland.beginner.step3_evidence}
              </blockquote>
            </div>
            <div class="pt-1">
              <button onclick="openNarrativeModal()" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-cyan-500/20 via-cyan-600/30 to-cyan-500/20 border border-cyan-500/50 hover:border-cyan-400 text-cyan-200 hover:text-white transition-all shadow-lg flex items-center justify-between group">
                <span class="text-xs font-bold flex items-center gap-2">
                  <span class="w-2 h-2 rounded-full bg-cyan-400 group-hover:scale-125 transition-transform"></span>
                  【步驟四：內容敘述】開啟專題考證對話方塊
                </span>
                <svg class="w-4 h-4 text-cyan-400 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                </svg>
              </button>
            </div>
          </div>
        `;
      } else if (currentMode === "course") {
        const materialsList = selectedIsland.course.materials
          .map(m => `<li class="font-serif text-slate-200 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>${m}</li>`)
          .join("");

        contentBox.innerHTML = `
          <div class="space-y-4">
            <div class="p-3.5 rounded-lg bg-cyan-950/30 border border-cyan-600/40">
              <span class="text-[10px] uppercase font-mono font-bold text-cyan-400 block mb-1">【課程主題地圖位階】</span>
              <p class="text-xs font-medium text-slate-100">${selectedIsland.course.topicMap}</p>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-slate-400 block mb-1.5">【本單元研讀文獻書目】</span>
              <ul class="space-y-1.5 text-xs">${materialsList}</ul>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-cyan-300 block mb-1">【課堂思辨與比較問題】</span>
              <p class="text-xs text-slate-300 leading-relaxed">${selectedIsland.course.comparisons}</p>
            </div>
          </div>
        `;
      } else if (currentMode === "researcher") {
        contentBox.innerHTML = `
          <div class="space-y-4 font-mono text-[11px]">
            <div class="p-3 rounded-lg bg-slate-800/80 border border-slate-700">
              <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1 font-sans">【索引檢索詞 (Search Terms)】</span>
              <code class="text-cyan-300 text-xs">${selectedIsland.researcher.searchTerms}</code>
            </div>
            <div class="p-3 rounded-lg bg-slate-800/80 border border-slate-700">
              <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1 font-sans">【原典圖像 / 寫本標引】</span>
              <div class="p-2 bg-slate-900 rounded border border-slate-800 text-slate-300 flex items-center justify-between">
                <span>${selectedIsland.researcher.imageRef}</span>
                <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 font-sans">經本圖示</span>
              </div>
            </div>
            <div class="p-3 rounded-lg bg-rose-950/30 border border-rose-700/40">
              <span class="text-[10px] uppercase font-bold text-rose-400 block mb-1 font-sans">【版本考異與文獻辨析】</span>
              <p class="text-slate-300 font-sans leading-relaxed text-xs">${selectedIsland.researcher.dispute}</p>
            </div>
          </div>
        `;
      }
    }

    function closeDrawer() {
      document.getElementById("side-drawer").classList.add("translate-x-full");
      selectedIsland = null;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update();
      controls.update();

      const t = time * 0.0015;

      // 中央結晶微轉動
      const centerObj = clickableMeshes.find(m => m.userData.data && m.userData.data.id === "beidou");
      if (centerObj && centerObj.userData.markerMesh) {
        centerObj.userData.markerMesh.rotation.y = t * 0.4;
        centerObj.userData.markerMesh.rotation.x = Math.sin(t) * 0.2;
      }

      // 外環靈寶五劫徽章呼吸浮動
      clickableMeshes.forEach((mesh, idx) => {
        if (!mesh.userData.data || mesh.userData.data.id === "beidou") return;
        const marker = mesh.userData.markerMesh;
        if (marker && marker.isSprite) {
          marker.position.y = (DISK_HEIGHT / 2 + 1.5) + Math.sin(t * 1.5 + idx) * 0.09;
        }
      });

      renderer.render(scene, camera);
    }

    loadIslandsData();
  </script>
</body>
</html>
