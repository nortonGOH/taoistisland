<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background-color: #060911;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);

    }

</head>
<body class="relative select-none">

  <!-- 3D 渲染畫布容器 -->
  <div id="canvas-container" class="absolute inset-0"></div>

  <!-- 【左側面板】：多層次道教思想史 -->
  <header class="absolute top-4 left-4 z-20 pointer-events-none">
    <div id="left-panel" class="bg-slate-900/95 backdrop-blur-md p-4 rounded-xl border border-slate-700/80 shadow-2xl pointer-events-auto w-[calc(100vw-2rem)] sm:w-[560px] md:w-[620px] transition-all duration-300">
      
      <!-- 頂部列：標題與收合切換按鈕 -->

        <h1 class="text-base font-bold text-slate-100 tracking-wide leading-snug">
          多層次道教思想史
        </h1>
        <button id="btn-toggle-left" onclick="toggleLeftPanel()" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-white transition-all flex items-center gap-1.5 text-xs">
          <span id="left-collapse-text">收合說明</span>
          <svg id="left-collapse-icon" class="w-3.5 h-3.5 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7-7" />
          </svg>
        </button>
      </div>

      <!-- 可收合之主體內容 -->
      <div id="left-panel-content" class="transition-all duration-300">
        <p class="text-[11px] text-slate-300 leading-relaxed mb-2.5 mt-2">
          <strong>五方五氣本體圖形：</strong>東方木（綠色長方形）、南方火（紅色三角形）、西方金（白色圓形）、北方水（黑色波浪形）、中央土（黃色正方形）。<br>
          <strong>第六層玉京神境：</strong>金闕玄臺、八方寶樹、七寶華林；<strong>第一層：</strong>地下九壘九宮格與金剛剛風。
        </p>
        <!-- 視角快速跳轉列 -->
        <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-800">

            🌐 全覽宇宙諸盤
          </button>
          <button onclick="focusProtoDisk()" class="px-2.5 py-1 rounded bg-yellow-500/20 hover:bg-yellow-500/30 border border-yellow-500/40 text-[11px] text-yellow-300 font-semibold transition-colors">
            ✨ 聚焦：五方五氣五行幾何盤

          <button onclick="focusYujingSacred()" class="px-2.5 py-1 rounded bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-[11px] text-amber-300 transition-colors">

          </button>

          <button onclick="focusZodiacDisk()" class="px-2.5 py-1 rounded bg-blue-500/20 hover:bg-blue-500/30 border border-blue-500/40 text-[11px] text-blue-300 transition-colors">

          </button>

      </div>

    </div>
  </header>

    <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">

    <div class="flex items-center justify-between px-2 py-1 border-b border-slate-800 mb-1">

      <button onclick="toggleRightPanel()" class="px-2 py-0.5 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-100 transition-colors flex items-center gap-1 text-[11px]" title="收起清單">

    <!-- 五方五氣五行新形制選項 -->
    <span class="text-[10px] text-yellow-400 font-bold px-2 py-0.5 uppercase tracking-wider">【五劫前】五方五氣五行形制</span>
    <button onclick="selectIslandById('proto_center')" class="px-2 py-1 text-left rounded-lg hover:bg-slate-800 text-slate-200 transition-colors flex items-center justify-between">

  <!-- 側邊深度檢視抽屜 -->

        <span id="drawer-tag" class="text-[11px] px-2 py-0.5 rounded font-mono uppercase tracking-wider font-semibold"></span>

      <button onclick="closeDrawer()" class="p-1 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-slate-100 transition-colors">

  <!-- 中央彈出式對話方塊 -->

      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-950/60">
        <div class="flex items-center gap-2.5">
          <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
          <span class="text-xs font-semibold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">步驟四：深度論述</span>

        <button onclick="closeNarrativeModal()" class="p-1 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-slate-100 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>

      </div>

        <button onclick="closeNarrativeModal()" class="px-4 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 transition-colors">關閉</button>

  <script>
    let ISLANDS_DATA = [];
    let scene, camera, renderer, controls;
    let raycaster, mouse;
    let currentMode = "beginner";
    let selectedIsland = null;
    const clickableMeshes = [];

    let isLeftPanelCollapsed = false;
    let isRightPanelOpen = true;

    // 空間座標配置
    const ZODIAC_CENTER    = new THREE.Vector3(-14, 0, 8);   // 左盤：十二辰星盤
    const KALPA_CENTER     = new THREE.Vector3(14, 0, 8);    // 右盤：靈寶五劫輪
    const PROTO_HEIGHT     = 5.2;                            // 右盤上層五方五氣高程差
    const COSMOLOGY_CENTER = new THREE.Vector3(0, 0, -18);   // 後方垂直立體軸：靈寶六層空間體系

    const DISK_HEIGHT = 0.65;
    const TOTAL_SECTORS = 12;
    const TOTAL_KALPAS = 5;

    const ZODIAC_LIST = [
      { branch: "子", animal: "鼠", emoji: "🐭" },
      { branch: "丑", animal: "牛", emoji: "🐮" },
      { branch: "寅", animal: "虎", emoji: "🐯" },
      { branch: "卯", animal: "兔", emoji: "🐰" },
      { branch: "辰", animal: "龍", emoji: "🐲" },
      { branch: "巳", animal: "蛇", emoji: "🐍" },
      { branch: "午", animal: "馬", emoji: "🐴" },
      { branch: "未", animal: "羊", emoji: "🐑" },
      { branch: "申", animal: "猴", emoji: "🐵" },
      { branch: "酉", animal: "雞", emoji: "🐔" },
      { branch: "戌", animal: "狗", emoji: "🐶" },
      { branch: "亥", animal: "豬", emoji: "🐗" }
    ];

    const KALPA_BADGES = [
      { id: "kalpa_longhan", name: "龍漢", emoji: "🌌", color: "#38bdf8" },
      { id: "kalpa_yankang", name: "延康", emoji: "🌑", color: "#94a3b8" },
      { id: "kalpa_chiming", name: "赤明", emoji: "🔥", color: "#f97316" },
      { id: "kalpa_kaihuang", name: "開皇", emoji: "☀️", color: "#10b981" },
      { id: "kalpa_shanghuang", name: "上皇", emoji: "✨", color: "#a855f7" }
    ];

    const NINE_STRATA_NAMES = [
      "一壘・色潤地", "二壘・剛色地", "三壘・石脂地",
      "四壘・潤澤地", "五壘・金剛地", "六壘・水澤地",
      "七壘・大綱地", "八壘・冥源地", "九壘・洞淵地"
    ];

    let dynamicGangfengRing = null;
    let dynamicUpliftParticles = null;
    let dynamicPetalParticles = null;
    let dynamicYujingAura = null;

    function toggleLeftPanel() {
      const content = document.getElementById("left-panel-content");
      const icon = document.getElementById("left-collapse-icon");
      const text = document.getElementById("left-collapse-text");
      isLeftPanelCollapsed = !isLeftPanelCollapsed;

      if (isLeftPanelCollapsed) {
        content.style.display = "none";
        icon.style.transform = "rotate(180deg)";
        if (text) text.textContent = "展開說明";
      } else {
        content.style.display = "block";
        icon.style.transform = "rotate(0deg)";
        if (text) text.textContent = "收合說明";
      }
    }

    function toggleRightPanel() {
      const rightPanel = document.getElementById("right-panel");
      const triggerBtn = document.getElementById("right-panel-trigger");
      isRightPanelOpen = !isRightPanelOpen;

      if (isRightPanelOpen) {
        rightPanel.style.display = "flex";
        triggerBtn.style.display = "none";
      } else {
        rightPanel.style.display = "none";
        triggerBtn.style.display = "inline-flex";
      }
    }

    // 通用圓形徽章貼圖生成
    function createBadgeTexture(emoji, text, colorHex) {
      const canvas = document.createElement("canvas");
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext("2d");

      ctx.beginPath();
      ctx.arc(128, 128, 110, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
      ctx.fill();
      ctx.lineWidth = 8;
      ctx.strokeStyle = colorHex;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(128, 128, 96, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(226, 232, 240, 0.35)";
      ctx.stroke();

      ctx.font = "75px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(emoji, 128, 105);

      ctx.font = "bold 28px sans-serif";
      ctx.fillStyle = colorHex;
      ctx.fillText(text, 128, 185);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    // ========================================================
    // 【五方五氣五行幾何專用貼圖生成器】
    // 東方木：長方形綠色 ｜ 南方火：三角形紅色 ｜ 西方金：圓形白色
    // 北方水：波浪形黑色 ｜ 中央土：正方形黃色
    // ========================================================
    function createFiveElementsBadgeTexture(shapeType, title, numText) {
      const canvas = document.createElement("canvas");
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext("2d");

      ctx.clearRect(0, 0, 256, 256);

      if (shapeType === "rect_wood") {
        // 【東方木】：長方形・綠色
        ctx.fillStyle = "rgba(6, 78, 59, 0.9)";
        ctx.fillRect(48, 20, 160, 216);
        ctx.lineWidth = 7;
        ctx.strokeStyle = "#10b981";
        ctx.strokeRect(48, 20, 160, 216);

        ctx.font = "bold 36px serif";
        ctx.fillStyle = "#a7f3d0";
        ctx.textAlign = "center";
        ctx.fillText("木德", 128, 75);
        ctx.font = "bold 44px sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.fillText(numText, 128, 135);
        ctx.font = "bold 24px sans-serif";
        ctx.fillStyle = "#6ee7b7";
        ctx.fillText(title, 128, 195);

      } else if (shapeType === "triangle_fire") {
        // 【南方火】：三角形・紅色
        ctx.beginPath();
        ctx.moveTo(128, 18);
        ctx.lineTo(240, 225);
        ctx.lineTo(16, 225);
        ctx.closePath();

        ctx.fillStyle = "rgba(127, 29, 29, 0.9)";
        ctx.fill();
        ctx.lineWidth = 7;
        ctx.strokeStyle = "#ef4444";
        ctx.stroke();

        ctx.font = "bold 32px serif";
        ctx.fillStyle = "#fecaca";
        ctx.textAlign = "center";
        ctx.fillText("火德", 128, 100);
        ctx.font = "bold 44px sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.fillText(numText, 128, 150);
        ctx.font = "bold 22px sans-serif";
        ctx.fillStyle = "#fca5a5";
        ctx.fillText(title, 128, 198);

      } else if (shapeType === "circle_metal") {
        // 【西方金】：圓形・白色
        ctx.beginPath();
        ctx.arc(128, 128, 108, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(241, 245, 249, 0.92)";
        ctx.fill();
        ctx.lineWidth = 8;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();

        ctx.font = "bold 34px serif";
        ctx.fillStyle = "#334155";
        ctx.textAlign = "center";
        ctx.fillText("金德", 128, 80);
        ctx.font = "bold 46px sans-serif";
        ctx.fillStyle = "#0f172a";
        ctx.fillText(numText, 128, 138);
        ctx.font = "bold 24px sans-serif";
        ctx.fillStyle = "#475569";
        ctx.fillText(title, 128, 190);

      } else if (shapeType === "wave_water") {
        // 【北方水】：波浪形・黑色 (黑底水波、深海玄冥)
        ctx.beginPath();
        ctx.arc(128, 128, 108, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(2, 6, 23, 0.95)";
        ctx.fill();
        ctx.lineWidth = 7;
        ctx.strokeStyle = "#38bdf8"; // 水藍色邊緣光暈凸顯黑色水德
        ctx.stroke();

        // 繪製水德三層波浪符號 〰️
        ctx.lineWidth = 6;
        ctx.strokeStyle = "#38bdf8";
        for (let waveY = 80; waveY <= 140; waveY += 30) {
          ctx.beginPath();
          ctx.moveTo(40, waveY);
          ctx.bezierCurveTo(80, waveY - 20, 110, waveY + 20, 150, waveY);
          ctx.bezierCurveTo(180, waveY - 20, 200, waveY + 15, 216, waveY);
          ctx.stroke();
        }

        ctx.font = "bold 34px serif";
        ctx.fillStyle = "#e0f2fe";
        ctx.textAlign = "center";
        ctx.fillText(numText, 128, 160);
        ctx.font = "bold 24px sans-serif";
        ctx.fillStyle = "#7dd3fc";
        ctx.fillText(title, 128, 205);

      } else if (shapeType === "square_earth") {
        // 【中央土】：正方形・黃色
        ctx.fillStyle = "rgba(234, 179, 8, 0.92)";
        ctx.fillRect(25, 25, 206, 206);
        ctx.lineWidth = 8;
        ctx.strokeStyle = "#fef08a";
        ctx.strokeRect(25, 25, 206, 206);

        ctx.font = "bold 36px serif";
        ctx.fillStyle = "#713f12";
        ctx.textAlign = "center";
        ctx.fillText("土德", 128, 75);
        ctx.font = "bold 46px sans-serif";
        ctx.fillStyle = "#422006";
        ctx.fillText(numText, 128, 135);
        ctx.font = "bold 24px sans-serif";
        ctx.fillStyle = "#78350f";
        ctx.fillText(title, 128, 195);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    function createNaturalTianshuTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext("2d");

      // 正方形底框（呼應中央土之正方）
      ctx.fillStyle = "rgba(202, 138, 4, 0.95)";
      ctx.fillRect(30, 30, 452, 452);
      ctx.lineWidth = 10;
      ctx.strokeStyle = "#fef08a";
      ctx.strokeRect(30, 30, 452, 452);

      // 內部自然天文赤文雲篆
      const grad = ctx.createRadialGradient(256, 256, 40, 256, 256, 220);
      grad.addColorStop(0, "rgba(220, 38, 38, 0.95)"); // 混洞赤文
      grad.addColorStop(0.7, "rgba(161, 98, 7, 0.85)");
      grad.addColorStop(1, "rgba(66, 32, 6, 0.6)");
      ctx.fillStyle = grad;
      ctx.fillRect(45, 45, 422, 422);

      ctx.lineWidth = 6;
      ctx.strokeStyle = "#fef08a";
      ctx.strokeRect(60, 60, 392, 392);

      ctx.font = "bold 56px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "#facc15";
      ctx.shadowBlur = 18;
      ctx.fillText("混洞赤文", 256, 210);

      ctx.fillStyle = "#fef08a";

    // 構建【靈寶第六層：玉京山金闕神聖景觀】3D 模型
    function buildYujingSanctuary(cosmoGroup, baseY) {

      const platformGeo2 = new THREE.CylinderGeometry(3.8, 4.1, 0.4, 8);

      // 玉京金闕殿宇

      orb.position.y = 3.65;

      // 八株七寶樹
      const treeAngles = [
        { ang: 0, text: "東方寶樹", color: "#10b981" },
        { ang: Math.PI / 4, text: "東南寶樹", color: "#34d399" },
        { ang: Math.PI / 2, text: "南方寶樹", color: "#f97316" },
        { ang: (3 * Math.PI) / 4, text: "西南寶樹", color: "#fb923c" },
        { ang: Math.PI, text: "西方寶樹", color: "#e2e8f0" },
        { ang: (5 * Math.PI) / 4, text: "西北寶樹", color: "#cbd5e1" },
        { ang: (3 * Math.PI) / 2, text: "北方寶樹", color: "#38bdf8" },
        { ang: (7 * Math.PI) / 4, text: "東北寶樹", color: "#60a5fa" }
      ];

      treeAngles.forEach(tree => {
        const dist = 4.6;
        const tx = Math.cos(tree.ang) * dist;
        const tz = Math.sin(tree.ang) * dist;

        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 1.6, 8), new THREE.MeshStandardMaterial({ color: 0x065f46 }));
        trunk.position.set(tx, 0.8, tz);
        yujingGroup.add(trunk);

        const crown = new THREE.Mesh(new THREE.DodecahedronGeometry(0.65, 0), new THREE.MeshStandardMaterial({ color: tree.color, emissive: tree.color, emissiveIntensity: 0.65, transparent: true, opacity: 0.88 }));
        crown.position.set(tx, 1.8, tz);
        yujingGroup.add(crown);
      });

      // 七寶華林光相層
      const hualinRingGeo = new THREE.RingGeometry(5.6, 7.4, 48);
      dynamicYujingAura = new THREE.Mesh(hualinRingGeo, new THREE.MeshStandardMaterial({ color: 0xfef08a, emissive: 0xca8a04, emissiveIntensity: 0.5, transparent: true, opacity: 0.35, side: THREE.DoubleSide }));
      dynamicYujingAura.rotation.x = Math.PI / 2;
      dynamicYujingAura.position.y = 0.1;
      yujingGroup.add(dynamicYujingAura);

      // 仙聖散花天花粒子系統
      const petalCount = 80;
      const petalPos = new Float32Array(petalCount * 3);
      for (let i = 0; i < petalCount * 3; i += 3) {
        const r = Math.random() * 5.0;
        const th = Math.random() * Math.PI * 2;
        petalPos[i] = Math.cos(th) * r;
        petalPos[i + 1] = 0.5 + Math.random() * 3.5;
        petalPos[i + 2] = Math.sin(th) * r;
      }
      const petalGeo = new THREE.BufferGeometry();
      petalGeo.setAttribute("position", new THREE.BufferAttribute(petalPos, 3));

      const focusWorldPos = COSMOLOGY_CENTER.clone().add(new THREE.Vector3(0, baseY + 2.2, 3.0));
      const yujingUserData = { data: daluoData, markerMesh: palace, focusPos: focusWorldPos };
      p1.userData = yujingUserData;
      palace.userData = yujingUserData;
      clickableMeshes.push(p1);
      clickableMeshes.push(palace);

      cosmoGroup.add(yujingGroup);
    }

    // 建立【靈寶空間體系】立體六層塔

      // 第 2~5 層圓台
      const midLayers = [

        { id: "lingbao_four_brahma", y: 16, radius: 5.0, color: "#c084fc", text: "第四層【種民聖界】四種民天 (避劫)", emoji: "✨" },
        { id: "lingbao_three_realms",y: 8,  radius: 6.6, color: "#10b981", text: "第三層【三界界域】三界二十八天", emoji: "🌌" },
        { id: "lingbao_earth_realm", y: 0,  radius: 8.0, color: "#f97316", text: "第二層【凡俗世界】五嶽十洲器界", emoji: "⛰️" }

      const axisMesh = new THREE.Mesh(axisGeo, axisMat);

      midLayers.forEach(lvl => {

        const ringMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.35, metalness: 0.4, transparent: true, opacity: 0.88 });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.position.y = lvl.y;

        const tex = createBadgeTexture(lvl.emoji, lvl.text, lvl.color);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
        sprite.scale.set(2.0, 2.0, 1.0);
        sprite.position.set(0, lvl.y + 1.35, lvl.radius + 0.9);
        cosmoGroup.add(sprite);

        const nodeData = ISLANDS_DATA.find(d => d.id === lvl.id);
        const worldPos = COSMOLOGY_CENTER.clone().add(new THREE.Vector3(0, lvl.y, lvl.radius + 0.9));
        const userDataObj = { data: nodeData, markerMesh: sprite, focusPos: worldPos };
        ringMesh.userData = userDataObj;
        sprite.userData = userDataObj;

        clickableMeshes.push(ringMesh);
        clickableMeshes.push(sprite);
        cosmoGroup.add(ringMesh);
      });

      // 第一層地下九壘九宮格 (Y = -8)
      const gridY = -8;
      const cellSize = 3.2;
      const cellGap = 0.4;
      const totalOffset = cellSize + cellGap;

      const strataGroup = new THREE.Group();
      strataGroup.position.set(0, gridY, 0);

      const strataNodeData = ISLANDS_DATA.find(d => d.id === "lingbao_nine_strata_gangfeng");

      let cellIdx = 0;
      for (let row = -1; row <= 1; row++) {
        for (let col = -1; col <= 1; col++) {
          const cx = col * totalOffset;
          const cz = row * totalOffset;

          const boxGeo = new THREE.BoxGeometry(cellSize, 0.4, cellSize);
          const boxMat = new THREE.MeshStandardMaterial({ color: 0x0b1329, roughness: 0.35, metalness: 0.3 });
          const boxMesh = new THREE.Mesh(boxGeo, boxMat);
          boxMesh.position.set(cx, 0, cz);

          const edgeMat = new THREE.LineBasicMaterial({ color: 0x64748b, opacity: 0.85, transparent: true });
          boxMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(boxGeo), edgeMat));

          const cellName = NINE_STRATA_NAMES[cellIdx];
          const cellTex = createBadgeTexture("🏛️", cellName, "#94a3b8");
          const cellSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: cellTex, transparent: true }));
          cellSprite.scale.set(1.3, 1.3, 1.0);
          cellSprite.position.set(cx, 0.95, cz);
          strataGroup.add(cellSprite);

          const cellWorldPos = COSMOLOGY_CENTER.clone().add(new THREE.Vector3(cx, gridY + 0.95, cz));
          const cellUserData = { data: strataNodeData, markerMesh: cellSprite, focusPos: cellWorldPos };
          boxMesh.userData = cellUserData;
          cellSprite.userData = cellUserData;

          clickableMeshes.push(boxMesh);
          clickableMeshes.push(cellSprite);
          strataGroup.add(boxMesh);

          cellIdx++;
        }
      }
      cosmoGroup.add(strataGroup);

      const strataMainTex = createBadgeTexture("🌪️", "第一層【九壘三十六土皇】風澤洞虛・金剛乘天", "#94a3b8");
      const strataMainSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: strataMainTex, transparent: true }));
      strataMainSprite.scale.set(2.3, 2.3, 1.0);
      strataMainSprite.position.set(0, gridY + 1.7, totalOffset * 1.5 + 1.4);
      cosmoGroup.add(strataMainSprite);

      const strataMainWorldPos = COSMOLOGY_CENTER.clone().add(new THREE.Vector3(0, gridY + 1.7, totalOffset * 1.5 + 1.4));
      strataMainSprite.userData = { data: strataNodeData, markerMesh: strataMainSprite, focusPos: strataMainWorldPos };
      clickableMeshes.push(strataMainSprite);

      // 天地對稱動態法理光索
      const rayPoints = [
        new THREE.Vector3(0, 28, 0), new THREE.Vector3(-totalOffset, gridY, -totalOffset),
        new THREE.Vector3(0, 28, 0), new THREE.Vector3(totalOffset, gridY, -totalOffset),
        new THREE.Vector3(0, 28, 0), new THREE.Vector3(-totalOffset, gridY, totalOffset),
        new THREE.Vector3(0, 28, 0), new THREE.Vector3(totalOffset, gridY, totalOffset)
      ];
      const rayGeo = new THREE.BufferGeometry().setFromPoints(rayPoints);
      const symmetryLines = new THREE.LineSegments(rayGeo, new THREE.LineDashedMaterial({ color: 0xfacc15, dashSize: 0.8, gapSize: 0.4, transparent: true, opacity: 0.65 }));
      symmetryLines.computeLineDistances();
      cosmoGroup.add(symmetryLines);

      // 風澤洞虛・金剛乘天 懸浮支撐力學場
      const gangfengRingGeo = new THREE.TorusGeometry(10.8, 0.45, 16, 64);
      dynamicGangfengRing = new THREE.Mesh(gangfengRingGeo, new THREE.MeshStandardMaterial({ color: 0xe2e8f0, emissive: 0x94a3b8, emissiveIntensity: 0.95, roughness: 0.1 }));

      dynamicGangfengRing.position.y = -12.5;
      cosmoGroup.add(dynamicGangfengRing);

      const innerCarrierRingGeo = new THREE.TorusGeometry(6.4, 0.3, 16, 48);
      const innerCarrierRing = new THREE.Mesh(innerCarrierRingGeo, new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.8, transparent: true, opacity: 0.8 }));
      innerCarrierRing.rotation.x = Math.PI / 2;
      innerCarrierRing.position.y = -11.0;
      cosmoGroup.add(innerCarrierRing);

      const upliftCount = 18;
      const upliftPoints = [];
      for (let u = 0; u < upliftCount; u++) {
        const uAng = (u * Math.PI * 2) / upliftCount;
        const urx = Math.cos(uAng) * 8.5;
        const urz = Math.sin(uAng) * 8.5;
        upliftPoints.push(new THREE.Vector3(urx, -12.5, urz));
        upliftPoints.push(new THREE.Vector3(urx * 0.45, -8.0, urz * 0.45));
      }
      const upliftLines = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(upliftPoints), new THREE.LineBasicMaterial({ color: 0x93c5fd, transparent: true, opacity: 0.65 }));
      cosmoGroup.add(upliftLines);

      const particleCount = 120;
      const particlePos = new Float32Array(particleCount * 3);
      for (let p = 0; p < particleCount * 3; p += 3) {
        const pR = Math.random() * 8.5;
        const pTh = Math.random() * Math.PI * 2;
        particlePos[p] = Math.cos(pTh) * pR;
        particlePos[p + 1] = -12.5 + Math.random() * 4.5;
        particlePos[p + 2] = Math.sin(pTh) * pR;
      }
      const particleGeo = new THREE.BufferGeometry();
      particleGeo.setAttribute("position", new THREE.BufferAttribute(particlePos, 3));
      dynamicUpliftParticles = new THREE.Points(particleGeo, new THREE.PointsMaterial({ color: 0x93c5fd, size: 0.28, transparent: true, opacity: 0.8 }));
      cosmoGroup.add(dynamicUpliftParticles);

      scene.add(cosmoGroup);
    }

    function buildSceneSystems() {

      // 左盤：十二辰星盤
      const zGroup = new THREE.Group();

      const sectorAngle = (Math.PI * 2) / TOTAL_SECTORS;
      for (let i = 0; i < TOTAL_SECTORS; i++) {
        const startAng = i * sectorAngle + 0.035;
        const endAng = (i + 1) * sectorAngle - 0.035;
        const sData = ISLANDS_DATA.find(d => d.sectorIndex === i && !d.isKalpa);
        const sectorMesh = createSectorMesh(startAng, endAng, 3.5, 8.8, sData ? sData.hexColor : "#fbbf24");

        const midA = i * sectorAngle + sectorAngle / 2;
        const lx = Math.cos(midA) * 6.2;
        const lz = -Math.sin(midA) * 6.2;

        const zodiac = ZODIAC_LIST[i];
        const badgeTexture = createBadgeTexture(zodiac.emoji, `${zodiac.branch}・${zodiac.animal}`, sData ? sData.hexColor : "#fbbf24");
        const badgeSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: badgeTexture, transparent: true }));
        badgeSprite.scale.set(1.4, 1.4, 1.0);
        badgeSprite.position.set(lx, DISK_HEIGHT / 2 + 1.25, lz);
        zGroup.add(badgeSprite);

        const wPos = ZODIAC_CENTER.clone().add(new THREE.Vector3(lx, 0, lz));
        const sUserData = { data: sData, markerMesh: badgeSprite, focusPos: wPos };
        sectorMesh.userData = sUserData;
        badgeSprite.userData = sUserData;

        clickableMeshes.push(sectorMesh);
        clickableMeshes.push(badgeSprite);
        zGroup.add(sectorMesh);
      }
      scene.add(zGroup);

      // 右盤下層：靈寶五劫天輪
      const kalpaGroup = new THREE.Group();
      kalpaGroup.position.copy(KALPA_CENTER);

      const kCenterGeo = new THREE.CylinderGeometry(3.2, 3.2, DISK_HEIGHT, 48);
      const kCenterMesh = new THREE.Mesh(kCenterGeo, new THREE.MeshStandardMaterial({ color: 0x1a0f2e, roughness: 0.35, metalness: 0.4 }));
      kCenterMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(kCenterGeo), new THREE.LineBasicMaterial({ color: 0xa855f7 })));

      const kalpaCenterData = ISLANDS_DATA.find(d => d.id === "kalpa_center");
      kCenterMesh.userData = { data: kalpaCenterData, focusPos: KALPA_CENTER.clone() };
      kalpaGroup.add(kCenterMesh);
      clickableMeshes.push(kCenterMesh);

      const kalpaAngle = (Math.PI * 2) / TOTAL_KALPAS;
      for (let k = 0; k < TOTAL_KALPAS; k++) {
        const startAng = k * kalpaAngle + 0.035;
        const endAng = (k + 1) * kalpaAngle - 0.035;
        const kpData = ISLANDS_DATA.find(d => d.kalpaIndex === k);
        const kalpaMesh = createSectorMesh(startAng, endAng, 3.6, 9.2, kpData ? kpData.hexColor : "#38bdf8");

        const midA = k * kalpaAngle + kalpaAngle / 2;
        const lx = Math.cos(midA) * 6.4;
        const lz = -Math.sin(midA) * 6.4;

        const kBadge = KALPA_BADGES[k];
        const tex = createBadgeTexture(kBadge.emoji, `${kBadge.name}劫`, kpData ? kpData.hexColor : "#38bdf8");
        const badgeSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
        badgeSprite.scale.set(1.7, 1.7, 1.0);
        badgeSprite.position.set(lx, DISK_HEIGHT / 2 + 1.45, lz);
        kalpaGroup.add(badgeSprite);

        const wPos = KALPA_CENTER.clone().add(new THREE.Vector3(lx, 0, lz));
        const kUserData = { data: kpData, markerMesh: badgeSprite, focusPos: wPos };
        kalpaMesh.userData = kUserData;
        badgeSprite.userData = kUserData;

        clickableMeshes.push(kalpaMesh);
        clickableMeshes.push(badgeSprite);
        kalpaGroup.add(kalpaMesh);
      }
      scene.add(kalpaGroup);

      // ========================================================
      // 右盤上層：【五方五氣五行新形制幾何盤】
      // 東方木：長方形綠色 ｜ 南方火：三角形紅色 ｜ 西方金：圓形白色
      // 北方水：波浪形黑色 ｜ 中央土：正方形黃色
      // ========================================================
      const protoGroup = new THREE.Group();
      protoGroup.position.set(KALPA_CENTER.x, PROTO_HEIGHT, KALPA_CENTER.z);

      // 支撐盤面（八角金玉雲台）
      const pBaseGeo = new THREE.CylinderGeometry(5.8, 5.8, 0.2, 48);
      const pBaseMat = new THREE.MeshStandardMaterial({ color: 0x221a08, transparent: true, opacity: 0.65, roughness: 0.3 });
      const pBaseMesh = new THREE.Mesh(pBaseGeo, pBaseMat);
      pBaseMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(pBaseGeo), new THREE.LineBasicMaterial({ color: 0xfacc15, opacity: 0.7 })));
      protoGroup.add(pBaseMesh);

      // 1. 【中央土・一氣】：黃色正方形台座與正方赤篆
      const cBoxGeo = new THREE.BoxGeometry(3.6, 0.35, 3.6);
      const cBoxMat = new THREE.MeshStandardMaterial({
        color: 0xca8a04,
        emissive: 0x854d0e,
        emissiveIntensity: 0.6,
        roughness: 0.25
      });
      const cBoxMesh = new THREE.Mesh(cBoxGeo, cBoxMat);
      cBoxMesh.position.set(0, 0.2, 0);
      cBoxMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(cBoxGeo), new THREE.LineBasicMaterial({ color: 0xfef08a, opacity: 0.95 })));
      protoGroup.add(cBoxMesh);

      const tianshuTex = createNaturalTianshuTexture();
      const tianshuSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tianshuTex, transparent: true, depthTest: true }));
      tianshuSprite.scale.set(3.4, 3.4, 1.0);
      tianshuSprite.position.set(0, 1.25, 0);
      protoGroup.add(tianshuSprite);

      const protoCenterData = ISLANDS_DATA.find(d => d.id === "proto_center");
      const protoCenterWorldPos = new THREE.Vector3(KALPA_CENTER.x, PROTO_HEIGHT, KALPA_CENTER.z);
      const pCenterUserData = { data: protoCenterData, markerMesh: tianshuSprite, focusPos: protoCenterWorldPos };
      cBoxMesh.userData = pCenterUserData;
      tianshuSprite.userData = pCenterUserData;
      clickableMeshes.push(cBoxMesh);
      clickableMeshes.push(tianshuSprite);

      // 2. 【四方五行特定形制台座與徽章】
      // 東木（綠色長方形）、南火（紅色三角形）、西金（白色圓形）、北水（黑色波浪形）
      const elementsSetup = [
        {
          id: "proto_east",
          angle: 0,
          dist: 4.6,
          shapeType: "rect_wood",
          title: "東方青天九氣",
          numText: "木九",
          color: "#10b981",
          // 3D 台座：長方體
          createGeo: () => new THREE.BoxGeometry(1.4, 0.35, 2.3),
          matColor: 0x064e3b,
          edgeColor: 0x10b981
        },
        {
          id: "proto_south",
          angle: -Math.PI / 2,
          dist: 4.6,
          shapeType: "triangle_fire",
          title: "南方赤天三氣",
          numText: "火三",
          color: "#ef4444",
          // 3D 台座：三棱柱（三角形）
          createGeo: () => new THREE.CylinderGeometry(1.2, 1.2, 0.35, 3),
          matColor: 0x7f1d1d,
          edgeColor: 0xef4444
        },
        {
          id: "proto_west",
          angle: Math.PI,
          dist: 4.6,
          shapeType: "circle_metal",
          title: "西方白天七氣",
          numText: "金七",
          color: "#ffffff",
          // 3D 台座：圓柱形（圓形）
          createGeo: () => new THREE.CylinderGeometry(1.15, 1.15, 0.35, 32),
          matColor: 0xe2e8f0,
          edgeColor: 0xffffff
        },
        {
          id: "proto_north",
          angle: Math.PI / 2,
          dist: 4.6,
          shapeType: "wave_water",
          title: "北方黑天五氣",
          numText: "水五",
          color: "#38bdf8",
          // 3D 台座：玄黑柱體搭配水紋
          createGeo: () => new THREE.CylinderGeometry(1.2, 1.2, 0.35, 24),
          matColor: 0x020617,
          edgeColor: 0x38bdf8
        }
      ];

      elementsSetup.forEach(el => {
        const lx = Math.cos(el.angle) * el.dist;
        const lz = -Math.sin(el.angle) * el.dist;

        // 3D 專屬造型幾何台座
        const geo = el.createGeo();
        const mat = new THREE.MeshStandardMaterial({ color: el.matColor, roughness: 0.3, metalness: 0.2 });
        const bMesh = new THREE.Mesh(geo, mat);
        bMesh.position.set(lx, 0.2, lz);
        if (el.shapeType === "triangle_fire") {
          bMesh.rotation.y = Math.PI / 6; // 調整三角形指向
        }
        bMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: el.edgeColor })));
        protoGroup.add(bMesh);

        // 專屬形制幾何徽章貼圖
        const tex = createFiveElementsBadgeTexture(el.shapeType, el.title, el.numText);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
        sprite.scale.set(1.5, 1.5, 1.0);
        sprite.position.set(lx, 1.2, lz);
        protoGroup.add(sprite);

        const nodeData = ISLANDS_DATA.find(d => d.id === el.id);
        const nodeWorldPos = new THREE.Vector3(KALPA_CENTER.x + lx, PROTO_HEIGHT, KALPA_CENTER.z + lz);
        const dirUserData = { data: nodeData, markerMesh: sprite, focusPos: nodeWorldPos };
        bMesh.userData = dirUserData;
        sprite.userData = dirUserData;

        clickableMeshes.push(bMesh);
        clickableMeshes.push(sprite);
      });

      scene.add(protoGroup);
    }

    function onPointerDown(event) {
      if (event.clientX > window.innerWidth - 500 && !document.getElementById("side-drawer").classList.contains("translate-x-full")) return;
      if (!document.getElementById("narrative-modal").classList.contains("hidden")) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(clickableMeshes, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj && !obj.userData.data && obj.parent) obj = obj.parent;
        if (obj && obj.userData && obj.userData.data) selectIsland(obj.userData);
      }
    }

    // 精準相機擺位
    function selectIsland(userData) {
      if (!userData || !userData.data) return;
      selectedIsland = userData.data;
      const targetPos = userData.focusPos;

      const lookAtY = targetPos.y + (selectedIsland.disk === "cosmology_lingbao" ? 0.2 : 0.8);
      const targetLookAt = new THREE.Vector3(targetPos.x, lookAtY, targetPos.z);

      let targetCamPos = new THREE.Vector3();

      if (selectedIsland.disk === "cosmology_lingbao") {
        if (selectedIsland.id === "lingbao_nine_strata_gangfeng") {
          targetCamPos.set(targetPos.x, targetPos.y + 7.5, targetPos.z + 10.5);
        } else if (selectedIsland.id === "lingbao_daluo") {
          targetCamPos.set(targetPos.x, targetPos.y + 4.5, targetPos.z + 9.5);
        } else {
          targetCamPos.set(targetPos.x, targetPos.y + 3.0, targetPos.z + 8.0);
        }
      } else if (selectedIsland.disk === "zodiac") {
        if (selectedIsland.isCenter) {
          targetCamPos.set(targetPos.x, targetPos.y + 6.5, targetPos.z + 7.5);
        } else {
          const dirFromCenter = new THREE.Vector3(targetPos.x - ZODIAC_CENTER.x, 0, targetPos.z - ZODIAC_CENTER.z).normalize();
          targetCamPos.copy(targetPos).add(dirFromCenter.clone().multiplyScalar(4.5));
          targetCamPos.y += 3.5;
        }
      } else if (selectedIsland.disk === "proto_lingbao") {
        if (selectedIsland.isCenter) {
          targetCamPos.set(targetPos.x, targetPos.y + 6.8, targetPos.z + 5.5);
        } else {
          const dirFromCenter = new THREE.Vector3(targetPos.x - KALPA_CENTER.x, 0, targetPos.z - KALPA_CENTER.z).normalize();
          targetCamPos.copy(targetPos).add(dirFromCenter.clone().multiplyScalar(4.2));
          targetCamPos.y += 3.2;
        }
      } else if (selectedIsland.disk === "kalpa") {
        if (selectedIsland.isCenter) {
          targetCamPos.set(targetPos.x, targetPos.y + 6.5, targetPos.z + 7.0);
        } else {
          const dirFromCenter = new THREE.Vector3(targetPos.x - KALPA_CENTER.x, 0, targetPos.z - KALPA_CENTER.z).normalize();
          targetCamPos.copy(targetPos).add(dirFromCenter.clone().multiplyScalar(4.5));
          targetCamPos.y += 3.5;
        }
      } else {
        targetCamPos.set(targetPos.x + 3.0, targetPos.y + 5.0, targetPos.z + 6.0);
      }

      new TWEEN.Tween(controls.target).to({ x: targetLookAt.x, y: targetLookAt.y, z: targetLookAt.z }, 800).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(camera.position).to({ x: targetCamPos.x, y: targetCamPos.y, z: targetCamPos.z }, 800).easing(TWEEN.Easing.Cubic.Out).start();

      renderDrawer();
    }

    function selectIslandById(id) {
      const mesh = clickableMeshes.find(m => m.userData && m.userData.data && m.userData.data.id === id && m.userData.focusPos);
      if (mesh) {
        selectIsland(mesh.userData);
        return;
      }

      const nodeData = ISLANDS_DATA.find(d => d.id === id);
      if (!nodeData) return;

      let calcFocusPos = new THREE.Vector3();
      if (nodeData.disk === "cosmology_lingbao") {
        const layerHeights = {
          lingbao_daluo: 28, lingbao_sanqing: 22, lingbao_four_brahma: 16,
          lingbao_three_realms: 8, lingbao_earth_realm: 0, lingbao_nine_strata_gangfeng: -8
        };
        const y = layerHeights[id] !== undefined ? layerHeights[id] : 0;
        calcFocusPos.set(COSMOLOGY_CENTER.x, y, COSMOLOGY_CENTER.z + 1.2);
      } else if (nodeData.disk === "zodiac") {
        if (nodeData.isCenter) {
          calcFocusPos.copy(ZODIAC_CENTER);
        } else {
          const ang = (Math.PI * 2) / TOTAL_SECTORS;
          const midA = nodeData.sectorIndex * ang + ang / 2;
          calcFocusPos.set(ZODIAC_CENTER.x + Math.cos(midA) * 6.2, 0, ZODIAC_CENTER.z - Math.sin(midA) * 6.2);
        }
      } else if (nodeData.disk === "proto_lingbao") {
        const protoDirs = {
          proto_center: { x: 0, z: 0 },
          proto_east:   { x: 4.6, z: 0 },
          proto_south:  { x: 0, z: 4.6 },
          proto_west:   { x: -4.6, z: 0 },
          proto_north:  { x: 0, z: -4.6 }
        };
        const offset = protoDirs[id] || { x: 0, z: 0 };
        calcFocusPos.set(KALPA_CENTER.x + offset.x, PROTO_HEIGHT, KALPA_CENTER.z + offset.z);
      } else if (nodeData.disk === "kalpa") {
        if (nodeData.isCenter) {
          calcFocusPos.copy(KALPA_CENTER);
        } else {
          const kang = (Math.PI * 2) / TOTAL_KALPAS;
          const midA = nodeData.kalpaIndex * kang + kang / 2;
          calcFocusPos.set(KALPA_CENTER.x + Math.cos(midA) * 6.4, 0, KALPA_CENTER.z - Math.sin(midA) * 6.4);
        }
      }

      selectIsland({ data: nodeData, focusPos: calcFocusPos });
    }

    function focusOverview() {
      new TWEEN.Tween(controls.target).to({ x: 0, y: 5, z: 0 }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(camera.position).to({ x: 0, y: 40, z: 50 }, 900).easing(TWEEN.Easing.Cubic.Out).start();
    }

    function focusYujingSacred() {
      selectIslandById('lingbao_daluo');
    }

    function focusCelestialSymmetry() {
      new TWEEN.Tween(controls.target).to({ x: COSMOLOGY_CENTER.x, y: 10, z: COSMOLOGY_CENTER.z }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(camera.position).to({ x: COSMOLOGY_CENTER.x + 18, y: 16, z: COSMOLOGY_CENTER.z + 28 }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      selectIslandById('lingbao_daluo');
    }

    function focusNineStrataGrid() {
      selectIslandById('lingbao_nine_strata_gangfeng');
    }

    function focusProtoDisk() {
      selectIslandById('proto_center');
    }

    function focusZodiacDisk() {
      selectIslandById('beidou');
    }

    function focusKalpaDisk() {
      selectIslandById('kalpa_center');
    }

    function setReaderMode(mode) {
      currentMode = mode;
      document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.classList.remove("bg-indigo-600", "text-white", "shadow-md");
        btn.classList.add("text-slate-300");
      });
      const activeBtn = document.getElementById(`btn-${mode}`);
      if (activeBtn) {
        activeBtn.classList.remove("text-slate-300");
        activeBtn.classList.add("bg-indigo-600", "text-white", "shadow-md");
      }
      if (selectedIsland) renderDrawer();
    }

    function openNarrativeModal() {
      if (!selectedIsland) return;
      const modal = document.getElementById("narrative-modal");
      document.getElementById("modal-title").textContent = `${selectedIsland.title}・深度考證論述`;
      document.getElementById("modal-body").innerHTML = selectedIsland.beginner.step4_narrative || "<p>暫無詳細論述。</p>";
      modal.classList.remove("hidden");
    }

    function closeNarrativeModal() {
      document.getElementById("narrative-modal").classList.add("hidden");
    }

    document.getElementById("narrative-modal").addEventListener("click", (e) => {
      if (e.target.id === "narrative-modal") closeNarrativeModal();
    });

              <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1 font-sans">【原典圖像 / 寫本標引】</span>
              <div class="p-2 bg-slate-900 rounded border border-slate-800 text-slate-300 flex items-center justify-between">
                <span>${selectedIsland.researcher.imageRef}</span>
                <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 font-sans">經本圖示</span>
              </div>
            </div>
            <div class="p-3 rounded-lg bg-rose-950/30 border border-rose-700/40">
              <span class="text-[10px] uppercase font-bold text-rose-400 block mb-1 font-sans">【版本考異與文獻辨析】</span>
              <p class="text-slate-300 font-sans leading-relaxed text-xs">${selectedIsland.researcher.dispute}</p>
            </div>
          </div>
        `;
      }
    }

    function closeDrawer() {
      document.getElementById("side-drawer").classList.add("translate-x-full");
      selectedIsland = null;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update();
      controls.update();

      const t = time * 0.0015;

      // 北斗星圖自轉
      const zCenterObj = clickableMeshes.find(m => m.userData.data && m.userData.data.id === "beidou");
      if (zCenterObj && zCenterObj.userData.markerMesh) {
        zCenterObj.userData.markerMesh.rotation.y = t * 0.2;
      }

      // 玉京山華林光相層旋轉
      if (dynamicYujingAura) {
        dynamicYujingAura.rotation.z = t * 0.18;
      }

      // 天花散落
      if (dynamicPetalParticles) {
        const positions = dynamicPetalParticles.geometry.attributes.position.array;
        for (let i = 1; i < positions.length; i += 3) {
          positions[i] -= 0.015;
          if (positions[i] < 0.2) positions[i] = 4.0;
        }
        dynamicPetalParticles.geometry.attributes.position.needsUpdate = true;
      }

      // 剛風風澤旋轉與粒子向上浮動
      if (dynamicGangfengRing) {
        dynamicGangfengRing.rotation.z = t * 0.45;
      }
      if (dynamicUpliftParticles) {
        const positions = dynamicUpliftParticles.geometry.attributes.position.array;
        for (let i = 1; i < positions.length; i += 3) {
          positions[i] += 0.065;
          if (positions[i] > -8.0) positions[i] = -12.5;
        }
        dynamicUpliftParticles.geometry.attributes.position.needsUpdate = true;
      }

      // 各標記微浮動
      clickableMeshes.forEach((mesh, idx) => {
        if (!mesh.userData.data || mesh.userData.data.isCenter) return;
        const marker = mesh.userData.markerMesh;
        if (marker && marker.isSprite) {
          let baseH = 1.25;
          if (mesh.userData.data.disk === "proto_lingbao") baseH = 1.2;
          else if (mesh.userData.data.disk === "cosmology_lingbao") baseH = 1.35;
          else if (mesh.userData.data.isKalpa) baseH = DISK_HEIGHT / 2 + 1.45;
          marker.position.y = (mesh.userData.focusPos.y + baseH) + Math.sin(t * 1.5 + idx) * 0.06;
        }
      });

      renderer.render(scene, camera);
    }

    loadIslandsData();
  </script>
</body>
</html>
