  <!-- JavaScript 控制與獨立雙盤幾何生成 -->
  <script>
    let ISLANDS_DATA = [];
    let scene, camera, renderer, controls;
    let raycaster, mouse;
    let currentMode = "beginner";
    let selectedIsland = null;
    const clickableMeshes = [];

    // 雙盤中心座標定義
    const ZODIAC_CENTER = new THREE.Vector3(-12, 0, 0); // 左盤：十二辰星盤
    const KALPA_CENTER = new THREE.Vector3(12, 0, 0);    // 右盤：靈寶五劫天輪

    // 左盤（十二辰位星盤）幾何尺寸
    const ZODIAC_INNER_R = 3.2;
    const ZODIAC_RING_INNER = 3.5;
    const ZODIAC_RING_OUTER = 8.8;
    const TOTAL_SECTORS = 12;

    // 右盤（靈寶五劫天輪）幾何尺寸
    const KALPA_INNER_R = 3.2;
    const KALPA_RING_INNER = 3.6;
    const KALPA_RING_OUTER = 9.2;
    const TOTAL_KALPAS = 5;

    const DISK_HEIGHT = 0.65;

    const ZODIAC_LIST = [
      { branch: "子", animal: "鼠", emoji: "🐭" },
      { branch: "丑", animal: "牛", emoji: "🐮" },
      { branch: "寅", animal: "虎", emoji: "🐯" },
      { branch: "卯", animal: "兔", emoji: "🐰" },
      { branch: "辰", animal: "龍", emoji: "🐲" },
      { branch: "巳", animal: "蛇", emoji: "🐍" },
      { branch: "午", animal: "馬", emoji: "🐴" },
      { branch: "未", animal: "羊", emoji: "🐑" },
      { branch: "申", animal: "猴", emoji: "🐵" },
      { branch: "酉", animal: "雞", emoji: "🐔" },
      { branch: "戌", animal: "狗", emoji: "🐶" },
      { branch: "亥", animal: "豬", emoji: "🐗" }
    ];

    const KALPA_BADGES = [
      { id: "kalpa_longhan", name: "龍漢", emoji: "🌌", color: "#38bdf8" },
      { id: "kalpa_yankang", name: "延康", emoji: "🌑", color: "#94a3b8" },
      { id: "kalpa_chiming", name: "赤明", emoji: "🔥", color: "#f97316" },
      { id: "kalpa_kaihuang", name: "開皇", emoji: "☀️", color: "#10b981" },
      { id: "kalpa_shanghuang", name: "上皇", emoji: "✨", color: "#a855f7" }
    ];

    function createBadgeTexture(emoji, text, colorHex) {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");

      ctx.beginPath();
      ctx.arc(128, 128, 110, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
      ctx.fill();
      ctx.lineWidth = 8;
      ctx.strokeStyle = colorHex;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(128, 128, 96, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(226, 232, 240, 0.35)";
      ctx.stroke();

      ctx.font = "75px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(emoji, 128, 105);

      ctx.font = "bold 38px sans-serif";
      ctx.fillStyle = colorHex;
      ctx.fillText(text, 128, 185);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    async function loadIslandsData() {
      try {
        const response = await fetch('./islands.json');
        if (!response.ok) {
          throw new Error(`HTTP 錯誤狀態碼: ${response.status}`);
        }
        ISLANDS_DATA = await response.json();

        ISLANDS_DATA.forEach(item => {
          if (typeof item.color === 'string') {
            item.color = parseInt(item.color, 16);
          }
        });

        initScene();
      } catch (error) {
        console.error("資料載入失敗：", error);
        document.getElementById("canvas-container").innerHTML = `
          <div class="flex items-center justify-center h-full px-4">
            <div class="bg-rose-950/90 border border-rose-500 text-rose-200 px-6 py-5 rounded-xl max-w-lg text-sm shadow-2xl">
              <h3 class="font-bold text-base mb-2">⚠️ 資料庫 (islands.json) 讀取失敗</h3>
              <p class="text-xs leading-relaxed text-rose-300 mb-2">請確認本機有開啟 HTTP 伺服器，或已正確發布至 GitHub Pages。</p>
            </div>
          </div>
        `;
      }
    }

    function initScene() {
      const container = document.getElementById("canvas-container");

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060911);
      scene.fog = new THREE.FogExp2(0x060911, 0.015);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 30, 36);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = Math.PI / 2 - 0.05;
      controls.minDistance = 6;
      controls.maxDistance = 85;
      controls.target.set(0, 0, 0);

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      const ambientLight = new THREE.AmbientLight(0x23324d, 1.5);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xe2e8f0, 1.8);
      dirLight.position.set(0, 35, 20);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.bias = -0.0005;
      scene.add(dirLight);

      const zodiacLight = new THREE.PointLight(0x38bdf8, 2.2, 30);
      zodiacLight.position.set(ZODIAC_CENTER.x, 4, ZODIAC_CENTER.z);
      scene.add(zodiacLight);

      const kalpaLight = new THREE.PointLight(0xa855f7, 2.2, 30);
      kalpaLight.position.set(KALPA_CENTER.x, 4, KALPA_CENTER.z);
      scene.add(kalpaLight);

      createStarfield();
      buildDualDisks();

      window.addEventListener("resize", onWindowResize);
      window.addEventListener("pointerdown", onPointerDown);

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeNarrativeModal();
        }
      });

      animate();
    }

    function createStarfield() {
      const starGeo = new THREE.BufferGeometry();
      const count = 700;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 220;
        positions[i + 1] = Math.random() * 80 - 10;
        positions[i + 2] = (Math.random() - 0.5) * 220;
      }

    function createSectorMesh(startAng, endAng, innerR, outerR, colorHex) {
      const shape = new THREE.Shape();
      const segments = 32;
      for (let s = 0; s <= segments; s++) {
        const theta = startAng + (endAng - startAng) * (s / segments);
        const x = Math.cos(theta) * outerR;
        const y = Math.sin(theta) * outerR;
        if (s === 0) shape.moveTo(x, y);
        else shape.lineTo(x, y);
      }
      for (let s = segments; s >= 0; s--) {
        const theta = startAng + (endAng - startAng) * (s / segments);
        const x = Math.cos(theta) * innerR;
        const y = Math.sin(theta) * innerR;
        shape.lineTo(x, y);
      }
      shape.closePath();

      const extrudeSettings = {
        depth: DISK_HEIGHT,
        bevelEnabled: true,
        bevelSegments: 2,
        steps: 1,
        bevelSize: 0.05,
        bevelThickness: 0.05
      };

      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.rotateX(Math.PI / 2);

      const mat = new THREE.MeshStandardMaterial({
        color: 0x111c30,
        roughness: 0.55,
        metalness: 0.25
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = DISK_HEIGHT / 2;
      mesh.receiveShadow = true;
      mesh.castShadow = true;

      const edgeGeo = new THREE.EdgesGeometry(geo);
      const edgeMat = new THREE.LineBasicMaterial({
        color: colorHex,
        transparent: true,
        opacity: 0.8
      });
      mesh.add(new THREE.LineSegments(edgeGeo, edgeMat));

      return mesh;
    }

    function buildDualDisks() {
      // ==========================================
      // 【左盤】：十二辰星命盤 (中心: ZODIAC_CENTER)
      // ==========================================
      const zodiacGroup = new THREE.Group();
      zodiacGroup.position.copy(ZODIAC_CENTER);

      const zCenterGeo = new THREE.CylinderGeometry(ZODIAC_INNER_R, ZODIAC_INNER_R, DISK_HEIGHT, 48);
      const zCenterMat = new THREE.MeshStandardMaterial({ color: 0x0f1a2e, roughness: 0.35, metalness: 0.4 });
      const zCenterMesh = new THREE.Mesh(zCenterGeo, zCenterMat);
      zCenterMesh.receiveShadow = true;
      zCenterMesh.castShadow = true;

      const zCenterEdgeGeo = new THREE.EdgesGeometry(zCenterGeo);
      const zCenterEdgeMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.85 });
      zCenterMesh.add(new THREE.LineSegments(zCenterEdgeGeo, zCenterEdgeMat));

      const beidouAsterism = createBeidouAsterism();
      zCenterMesh.add(beidouAsterism);

      const beidouData = ISLANDS_DATA.find(d => d.id === "beidou");
      zCenterMesh.userData = {
        data: beidouData,
        markerMesh: beidouAsterism,
        focusPos: ZODIAC_CENTER.clone()
      };
      zodiacGroup.add(zCenterMesh);
      clickableMeshes.push(zCenterMesh);

      const sectorAngle = (Math.PI * 2) / TOTAL_SECTORS;
      const angleGap = 0.035;

      for (let i = 0; i < TOTAL_SECTORS; i++) {
        const startAng = i * sectorAngle + angleGap / 2;
        const endAng = (i + 1) * sectorAngle - angleGap / 2;

        const sectorData = ISLANDS_DATA.find(d => d.sectorIndex === i && !d.isKalpa);
        const sectorMesh = createSectorMesh(startAng, endAng, ZODIAC_RING_INNER, ZODIAC_RING_OUTER, sectorData ? sectorData.hexColor : "#334155");

        const midAngle = i * sectorAngle + sectorAngle / 2;
        const midRadius = (ZODIAC_RING_INNER + ZODIAC_RING_OUTER) / 2;
        const localX = Math.cos(midAngle) * midRadius;
        const localZ = -Math.sin(midAngle) * midRadius;

        const zodiac = ZODIAC_LIST[i];
        const badgeTexture = createBadgeTexture(zodiac.emoji, `${zodiac.branch}・${zodiac.animal}`, sectorData ? sectorData.hexColor : "#fbbf24");
        const spriteMat = new THREE.SpriteMaterial({ map: badgeTexture, transparent: true, depthTest: true });
        const badgeSprite = new THREE.Sprite(spriteMat);
        badgeSprite.scale.set(1.4, 1.4, 1.0);
        badgeSprite.position.set(localX, DISK_HEIGHT / 2 + 1.25, localZ);
        zodiacGroup.add(badgeSprite);

        const worldFocus = ZODIAC_CENTER.clone().add(new THREE.Vector3(localX, 0, localZ));
        sectorMesh.userData = {
          data: sectorData,
          markerMesh: badgeSprite,
          focusPos: worldFocus
        };
        badgeSprite.userData = sectorMesh.userData;

        clickableMeshes.push(sectorMesh);
        clickableMeshes.push(badgeSprite);
        zodiacGroup.add(sectorMesh);
      }
      scene.add(zodiacGroup);

      // ==========================================
      // 【右盤】：靈寶五劫天輪 (中心: KALPA_CENTER)
      // ==========================================
      const kalpaGroup = new THREE.Group();
      kalpaGroup.position.copy(KALPA_CENTER);

      const kCenterGeo = new THREE.CylinderGeometry(KALPA_INNER_R, KALPA_INNER_R, DISK_HEIGHT, 48);
      const kCenterMat = new THREE.MeshStandardMaterial({ color: 0x1a0f2e, roughness: 0.35, metalness: 0.4 });
      const kCenterMesh = new THREE.Mesh(kCenterGeo, kCenterMat);
      kCenterMesh.receiveShadow = true;
      kCenterMesh.castShadow = true;

      const kCenterEdgeGeo = new THREE.EdgesGeometry(kCenterGeo);
      const kCenterEdgeMat = new THREE.LineBasicMaterial({ color: 0xa855f7, transparent: true, opacity: 0.85 });
      kCenterMesh.add(new THREE.LineSegments(kCenterEdgeGeo, kCenterEdgeMat));

      const crystalGeo = new THREE.OctahedronGeometry(1.0, 0);
      const crystalMat = new THREE.MeshStandardMaterial({
        color: 0xa855f7,
        emissive: 0x7e22ce,
        emissiveIntensity: 0.75,
        roughness: 0.15
      });
      const crystalMesh = new THREE.Mesh(crystalGeo, crystalMat);
      crystalMesh.position.y = DISK_HEIGHT / 2 + 1.35;
      kCenterMesh.add(crystalMesh);

      const kalpaCenterData = ISLANDS_DATA.find(d => d.id === "kalpa_center");
      kCenterMesh.userData = {
        data: kalpaCenterData,
        markerMesh: crystalMesh,
        focusPos: KALPA_CENTER.clone()
      };
      kalpaGroup.add(kCenterMesh);
      clickableMeshes.push(kCenterMesh);

      const kalpaAngle = (Math.PI * 2) / TOTAL_KALPAS;
      const kalpaGap = 0.035;

      for (let k = 0; k < TOTAL_KALPAS; k++) {
        const startAng = k * kalpaAngle + kalpaGap / 2;
        const endAng = (k + 1) * kalpaAngle - kalpaGap / 2;

        const kalpaData = ISLANDS_DATA.find(d => d.kalpaIndex === k);
        const kalpaMesh = createSectorMesh(startAng, endAng, KALPA_RING_INNER, KALPA_RING_OUTER, kalpaData ? kalpaData.hexColor : "#a855f7");

        const midAngle = k * kalpaAngle + kalpaAngle / 2;
        const midRadius = (KALPA_RING_INNER + KALPA_RING_OUTER) / 2;
        const localX = Math.cos(midAngle) * midRadius;
        const localZ = -Math.sin(midAngle) * midRadius;

        const kBadge = KALPA_BADGES[k];
        const badgeTexture = createBadgeTexture(kBadge.emoji, `${kBadge.name}劫`, kalpaData ? kalpaData.hexColor : "#38bdf8");
        const spriteMat = new THREE.SpriteMaterial({ map: badgeTexture, transparent: true, depthTest: true });
        const badgeSprite = new THREE.Sprite(spriteMat);
        badgeSprite.scale.set(1.7, 1.7, 1.0);
        badgeSprite.position.set(localX, DISK_HEIGHT / 2 + 1.45, localZ);
        kalpaGroup.add(badgeSprite);

        const worldFocus = KALPA_CENTER.clone().add(new THREE.Vector3(localX, 0, localZ));
        sectorMeshUserData = {
          data: kalpaData,
          markerMesh: badgeSprite,
          focusPos: worldFocus
        };
        kalpaMesh.userData = sectorMeshUserData;
        badgeSprite.userData = sectorMeshUserData;

        clickableMeshes.push(kalpaMesh);
        clickableMeshes.push(badgeSprite);
        kalpaGroup.add(kalpaMesh);
      }
      scene.add(kalpaGroup);
    }

    function onPointerDown(event) {
      if (
        (event.clientX > window.innerWidth - 500 && !document.getElementById("side-drawer").classList.contains("translate-x-full")) ||
        !document.getElementById("narrative-modal").classList.contains("hidden")
      ) {
        return;
      }

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(clickableMeshes, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj && !obj.userData.data && obj.parent) {
          obj = obj.parent;
        }
        if (obj && obj.userData && obj.userData.data) {
          selectIsland(obj.userData);
        }
      }
    }

              <p class="text-xs font-medium text-slate-100">${selectedIsland.course.topicMap}</p>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-slate-400 block mb-1.5">【本單元研讀文獻書目】</span>
              <ul class="space-y-1.5 text-xs">${materialsList}</ul>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-cyan-400 block mb-1">【課堂思辨與比較問題】</span>
              <p class="text-xs text-slate-300 leading-relaxed">${selectedIsland.course.comparisons}</p>
            </div>
          </div>
        `;
      } else if (currentMode === "researcher") {
        contentBox.innerHTML = `
          <div class="space-y-4 font-mono text-[11px]">
            <div class="p-3 rounded-lg bg-slate-800/80 border border-slate-700">
              <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1 font-sans">【索引檢索詞 (Search Terms)】</span>
              <code class="text-amber-300 text-xs">${selectedIsland.researcher.searchTerms}</code>
            </div>
            <div class="p-3 rounded-lg bg-slate-800/80 border border-slate-700">
              <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1 font-sans">【原典圖像 / 寫本標引】</span>
              <div class="p-2 bg-slate-900 rounded border border-slate-800 text-slate-300 flex items-center justify-between">
                <span>${selectedIsland.researcher.imageRef}</span>
                <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 font-sans">經本圖示</span>
              </div>
            </div>
            <div class="p-3 rounded-lg bg-rose-950/30 border border-rose-700/40">
              <span class="text-[10px] uppercase font-bold text-rose-400 block mb-1 font-sans">【版本考異與文獻辨析】</span>
              <p class="text-slate-300 font-sans leading-relaxed text-xs">${selectedIsland.researcher.dispute}</p>
            </div>
          </div>
        `;
      }
    }

    function closeDrawer() {
      document.getElementById("side-drawer").classList.add("translate-x-full");
      selectedIsland = null;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update();
      controls.update();

      const t = time * 0.0015;

      // 左盤北斗星宿自轉
      const zCenterObj = clickableMeshes.find(m => m.userData.data && m.userData.data.id === "beidou");
      if (zCenterObj && zCenterObj.userData.markerMesh) {
        zCenterObj.userData.markerMesh.rotation.y = t * 0.2;
      }

      // 右盤玉京結晶自轉
      const kCenterObj = clickableMeshes.find(m => m.userData.data && m.userData.data.id === "kalpa_center");
      if (kCenterObj && kCenterObj.userData.markerMesh) {
        kCenterObj.userData.markerMesh.rotation.y = t * 0.35;
        kCenterObj.userData.markerMesh.rotation.x = Math.sin(t * 0.8) * 0.15;
      }

      // 徽章微浮動
      clickableMeshes.forEach((mesh, idx) => {
        if (!mesh.userData.data || mesh.userData.data.isCenter) return;
        const marker = mesh.userData.markerMesh;
        if (marker && marker.isSprite) {
          const baseH = mesh.userData.data.isKalpa ? (DISK_HEIGHT / 2 + 1.45) : (DISK_HEIGHT / 2 + 1.25);
          marker.position.y = baseH + Math.sin(t * 1.5 + idx) * 0.08;
        }
      });

      renderer.render(scene, camera);
    }

    loadIslandsData();
  </script>
</body>
</html>
