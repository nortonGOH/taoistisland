  <script>
    let ISLANDS_DATA = [];
    let scene, camera, renderer, controls;
    let raycaster, mouse;
    let currentMode = "beginner";
    let selectedIsland = null;
    const clickableMeshes = [];

    // 三大式盤中心定義
    const PROTO_CENTER = new THREE.Vector3(0, 0, -18);   // 五劫前：五方五氣本體盤
    const ZODIAC_CENTER = new THREE.Vector3(-14, 0, 8);   // 左盤：十二辰星盤
    const KALPA_CENTER = new THREE.Vector3(14, 0, 8);     // 右盤：靈寶五劫天輪

    const DISK_HEIGHT = 0.65;
    const TOTAL_SECTORS = 12;
    const TOTAL_KALPAS = 5;

    const ZODIAC_LIST = [
      { branch: "子", animal: "鼠", emoji: "🐭" },
      { branch: "丑", animal: "牛", emoji: "🐮" },
      { branch: "寅", animal: "虎", emoji: "🐯" },
      { branch: "卯", animal: "兔", emoji: "🐰" },
      { branch: "辰", animal: "龍", emoji: "🐲" },
      { branch: "巳", animal: "蛇", emoji: "🐍" },
      { branch: "午", animal: "馬", emoji: "🐴" },
      { branch: "未", animal: "羊", emoji: "🐑" },
      { branch: "申", animal: "猴", emoji: "🐵" },
      { branch: "酉", animal: "雞", emoji: "🐔" },
      { branch: "戌", animal: "狗", emoji: "🐶" },
      { branch: "亥", animal: "豬", emoji: "🐗" }
    ];

    const KALPA_BADGES = [
      { id: "kalpa_longhan", name: "龍漢", emoji: "🌌", color: "#38bdf8" },
      { id: "kalpa_yankang", name: "延康", emoji: "🌑", color: "#94a3b8" },
      { id: "kalpa_chiming", name: "赤明", emoji: "🔥", color: "#f97316" },
      { id: "kalpa_kaihuang", name: "開皇", emoji: "☀️", color: "#10b981" },
      { id: "kalpa_shanghuang", name: "上皇", emoji: "✨", color: "#a855f7" }
    ];

    function createBadgeTexture(emoji, text, colorHex) {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");

      ctx.beginPath();
      ctx.arc(128, 128, 110, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
      ctx.fill();
      ctx.lineWidth = 8;
      ctx.strokeStyle = colorHex;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(128, 128, 96, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(226, 232, 240, 0.35)";
      ctx.stroke();

      ctx.font = "75px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(emoji, 128, 105);

      ctx.font = "bold 38px sans-serif";
      ctx.fillStyle = colorHex;
      ctx.fillText(text, 128, 185);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    async function loadIslandsData() {
      try {
        const response = await fetch('./islands.json');
        if (!response.ok) throw new Error("Fetch failed");
        ISLANDS_DATA = await response.json();
        ISLANDS_DATA.forEach(item => {
          if (typeof item.color === 'string') item.color = parseInt(item.color, 16);
        });
      } catch (err) {
        console.warn("使用預設備援資料");
      }
      initScene();
    }

    function initScene() {
      const container = document.getElementById("canvas-container");
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060911);
      scene.fog = new THREE.FogExp2(0x060911, 0.014);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 36, 42);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = Math.PI / 2 - 0.05;
      controls.minDistance = 6;
      controls.maxDistance = 100;

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      const ambientLight = new THREE.AmbientLight(0x23324d, 1.5);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xe2e8f0, 1.8);
      dirLight.position.set(0, 40, 20);
      scene.add(dirLight);

      // 三組光源
      const pLight = new THREE.PointLight(0xfacc15, 2.4, 30);
      pLight.position.set(PROTO_CENTER.x, 5, PROTO_CENTER.z);
      scene.add(pLight);

      const zLight = new THREE.PointLight(0x38bdf8, 2.2, 30);
      zLight.position.set(ZODIAC_CENTER.x, 4, ZODIAC_CENTER.z);
      scene.add(zLight);

      const kLight = new THREE.PointLight(0xa855f7, 2.2, 30);
      kLight.position.set(KALPA_CENTER.x, 4, KALPA_CENTER.z);
      scene.add(kLight);

      createStarfield();
      buildAllDisks();

      window.addEventListener("resize", onWindowResize);
      window.addEventListener("pointerdown", onPointerDown);
      window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeNarrativeModal(); });

      animate();
    }

    function createStarfield() {
      const starGeo = new THREE.BufferGeometry();
      const count = 800;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 260;
        positions[i + 1] = Math.random() * 90 - 10;
        positions[i + 2] = (Math.random() - 0.5) * 260;
      }
      starGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const starMat = new THREE.PointsMaterial({ color: 0x94a3b8, size: 0.22, transparent: true, opacity: 0.55 });
      scene.add(new THREE.Points(starGeo, starMat));
    }

    function createSectorMesh(startAng, endAng, innerR, outerR, colorHex) {
      const shape = new THREE.Shape();
      const segments = 32;
      for (let s = 0; s <= segments; s++) {
        const theta = startAng + (endAng - startAng) * (s / segments);
        const x = Math.cos(theta) * outerR;
        const y = Math.sin(theta) * outerR;
        if (s === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
      }
      for (let s = segments; s >= 0; s--) {
        const theta = startAng + (endAng - startAng) * (s / segments);
        const x = Math.cos(theta) * innerR;
        const y = Math.sin(theta) * innerR;
        shape.lineTo(x, y);
      }
      shape.closePath();

      const extrudeSettings = { depth: DISK_HEIGHT, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.05, bevelThickness: 0.05 };
      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.rotateX(Math.PI / 2);

      const mat = new THREE.MeshStandardMaterial({ color: 0x111c30, roughness: 0.55, metalness: 0.25 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = DISK_HEIGHT / 2;

      const edgeGeo = new THREE.EdgesGeometry(geo);
      const edgeMat = new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0.8 });
      mesh.add(new THREE.LineSegments(edgeGeo, edgeMat));
      return mesh;
    }

    // 構建【五劫前：五方五氣本體盤】
    function buildProtoLingbaoDisk() {
      const protoGroup = new THREE.Group();
      protoGroup.position.copy(PROTO_CENTER);

      // 中央一氣黃金台
      const cGeo = new THREE.CylinderGeometry(3.0, 3.0, DISK_HEIGHT, 48);
      const cMat = new THREE.MeshStandardMaterial({ color: 0x221a08, roughness: 0.3, metalness: 0.5 });
      const cMesh = new THREE.Mesh(cGeo, cMat);
      cMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(cGeo), new THREE.LineBasicMaterial({ color: 0xfacc15, opacity: 0.9 })));

      const cLightGeo = new THREE.OctahedronGeometry(1.2, 0);
      const cLightMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xeab308, emissiveIntensity: 0.8 });
      const crystal = new THREE.Mesh(cLightGeo, cLightMat);
      crystal.position.y = DISK_HEIGHT / 2 + 1.4;
      cMesh.add(crystal);

      const centerData = ISLANDS_DATA.find(d => d.id === "proto_center");
      cMesh.userData = { data: centerData, markerMesh: crystal, focusPos: PROTO_CENTER.clone() };
      protoGroup.add(cMesh);
      clickableMeshes.push(cMesh);

      // 四方老數印章 (東9、南3、西7、北5)
      const directions = [
        { id: "proto_east", angle: 0, dist: 6.8, text: "東方九氣", emoji: "🌱", color: "#10b981" },
        { id: "proto_south", angle: -Math.PI / 2, dist: 6.8, text: "南方三氣", emoji: "🔥", color: "#f97316" },
        { id: "proto_west", angle: Math.PI, dist: 6.8, text: "西方七氣", emoji: "⚪", color: "#e2e8f0" },
        { id: "proto_north", angle: Math.PI / 2, dist: 6.8, text: "北方五氣", emoji: "💧", color: "#38bdf8" }
      ];

      directions.forEach(dir => {
        const x = Math.cos(dir.angle) * dir.dist;
        const z = -Math.sin(dir.angle) * dir.dist;

        // 方形氣化印台
        const bGeo = new THREE.BoxGeometry(2.4, DISK_HEIGHT, 2.4);
        const bMat = new THREE.MeshStandardMaterial({ color: 0x131d31, roughness: 0.4 });
        const bMesh = new THREE.Mesh(bGeo, bMat);
        bMesh.position.set(x, DISK_HEIGHT / 2, z);
        bMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(bGeo), new THREE.LineBasicMaterial({ color: dir.color })));

        const tex = createBadgeTexture(dir.emoji, dir.text, dir.color);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
        sprite.scale.set(1.7, 1.7, 1.0);
        sprite.position.set(x, DISK_HEIGHT / 2 + 1.4, z);
        protoGroup.add(sprite);

        const nodeData = ISLANDS_DATA.find(d => d.id === dir.id);
        const worldPos = PROTO_CENTER.clone().add(new THREE.Vector3(x, 0, z));
        bMesh.userData = { data: nodeData, markerMesh: sprite, focusPos: worldPos };
        sprite.userData = bMesh.userData;

        clickableMeshes.push(bMesh);
        clickableMeshes.push(sprite);
        protoGroup.add(bMesh);
      });

      scene.add(protoGroup);
    }

    // 構建全部式盤
    function buildAllDisks() {
      buildProtoLingbaoDisk();

      // 左盤十二辰星盤
      const zGroup = new THREE.Group();
      zGroup.position.copy(ZODIAC_CENTER);
      const zCenterGeo = new THREE.CylinderGeometry(3.2, 3.2, DISK_HEIGHT, 48);
      const zCenterMesh = new THREE.Mesh(zCenterGeo, new THREE.MeshStandardMaterial({ color: 0x0f1a2e }));
      zCenterMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(zCenterGeo), new THREE.LineBasicMaterial({ color: 0x38bdf8 })));
      const zData = ISLANDS_DATA.find(d => d.id === "beidou");
      zCenterMesh.userData = { data: zData, focusPos: ZODIAC_CENTER.clone() };
      zGroup.add(zCenterMesh);
      clickableMeshes.push(zCenterMesh);

      for (let i = 0; i < TOTAL_SECTORS; i++) {
        const ang = (Math.PI * 2) / TOTAL_SECTORS;
        const mesh = createSectorMesh(i * ang + 0.03, (i + 1) * ang - 0.03, 3.5, 8.8, "#fbbf24");
        const midA = i * ang + ang / 2;
        const lx = Math.cos(midA) * 6.2;
        const lz = -Math.sin(midA) * 6.2;
        const zodiac = ZODIAC_LIST[i];
        const tex = createBadgeTexture(zodiac.emoji, `${zodiac.branch}・${zodiac.animal}`, "#fbbf24");
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
        sprite.scale.set(1.4, 1.4, 1.0);
        sprite.position.set(lx, DISK_HEIGHT / 2 + 1.25, lz);
        zGroup.add(sprite);

        const sData = ISLANDS_DATA.find(d => d.sectorIndex === i && !d.isKalpa);
        const wPos = ZODIAC_CENTER.clone().add(new THREE.Vector3(lx, 0, lz));
        mesh.userData = { data: sData, markerMesh: sprite, focusPos: wPos };
        sprite.userData = mesh.userData;
        clickableMeshes.push(mesh);
        clickableMeshes.push(sprite);
        zGroup.add(mesh);
      }
      scene.add(zGroup);

      // 右盤靈寶五劫天輪
      const kGroup = new THREE.Group();
      kGroup.position.copy(KALPA_CENTER);
      const kCenterGeo = new THREE.CylinderGeometry(3.2, 3.2, DISK_HEIGHT, 48);
      const kCenterMesh = new THREE.Mesh(kCenterGeo, new THREE.MeshStandardMaterial({ color: 0x1a0f2e }));
      kCenterMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(kCenterGeo), new THREE.LineBasicMaterial({ color: 0xa855f7 })));
      const kData = ISLANDS_DATA.find(d => d.id === "kalpa_center");
      kCenterMesh.userData = { data: kData, focusPos: KALPA_CENTER.clone() };
      kGroup.add(kCenterMesh);
      clickableMeshes.push(kCenterMesh);

      for (let k = 0; k < TOTAL_KALPAS; k++) {
        const kang = (Math.PI * 2) / TOTAL_KALPAS;
        const kmesh = createSectorMesh(k * kang + 0.03, (k + 1) * kang - 0.03, 3.6, 9.2, "#38bdf8");
        const midA = k * kang + kang / 2;
        const lx = Math.cos(midA) * 6.4;
        const lz = -Math.sin(midA) * 6.4;
        const kBadge = KALPA_BADGES[k];
        const tex = createBadgeTexture(kBadge.emoji, `${kBadge.name}劫`, kBadge.color);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
        sprite.scale.set(1.7, 1.7, 1.0);
        sprite.position.set(lx, DISK_HEIGHT / 2 + 1.45, lz);
        kGroup.add(sprite);

        const kpData = ISLANDS_DATA.find(d => d.kalpaIndex === k);
        const wPos = KALPA_CENTER.clone().add(new THREE.Vector3(lx, 0, lz));
        kmesh.userData = { data: kpData, markerMesh: sprite, focusPos: wPos };
        sprite.userData = kmesh.userData;
        clickableMeshes.push(kmesh);
        clickableMeshes.push(sprite);
        kGroup.add(kmesh);
      }
      scene.add(kGroup);
    }

    function onPointerDown(event) {
      if (event.clientX > window.innerWidth - 500 && !document.getElementById("side-drawer").classList.contains("translate-x-full")) return;
      if (!document.getElementById("narrative-modal").classList.contains("hidden")) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(clickableMeshes, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj && !obj.userData.data && obj.parent) obj = obj.parent;
        if (obj && obj.userData && obj.userData.data) selectIsland(obj.userData);
      }
    }

    function selectIsland(userData) {
      selectedIsland = userData.data;
      const targetPos = userData.focusPos;
      new TWEEN.Tween(controls.target).to({ x: targetPos.x, y: 0.5, z: targetPos.z }, 800).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(camera.position).to({ x: targetPos.x + 5, y: 8, z: targetPos.z + 9 }, 800).easing(TWEEN.Easing.Cubic.Out).start();
      renderDrawer();
    }

    function selectIslandById(id) {
      const mesh = clickableMeshes.find(m => m.userData.data && m.userData.data.id === id);
      if (mesh) selectIsland(mesh.userData);
    }

    function focusOverview() {
      new TWEEN.Tween(controls.target).to({ x: 0, y: 0, z: -2 }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(camera.position).to({ x: 0, y: 38, z: 42 }, 900).easing(TWEEN.Easing.Cubic.Out).start();
    }

    function focusProtoDisk() {
      new TWEEN.Tween(controls.target).to({ x: PROTO_CENTER.x, y: 0, z: PROTO_CENTER.z }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(camera.position).to({ x: PROTO_CENTER.x, y: 22, z: PROTO_CENTER.z + 18 }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      selectIslandById('proto_center');
    }

    function focusZodiacDisk() {
      new TWEEN.Tween(controls.target).to({ x: ZODIAC_CENTER.x, y: 0, z: ZODIAC_CENTER.z }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(camera.position).to({ x: ZODIAC_CENTER.x, y: 22, z: ZODIAC_CENTER.z + 18 }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      selectIslandById('beidou');
    }

    function focusKalpaDisk() {
      new TWEEN.Tween(controls.target).to({ x: KALPA_CENTER.x, y: 0, z: KALPA_CENTER.z }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(camera.position).to({ x: KALPA_CENTER.x, y: 22, z: KALPA_CENTER.z + 18 }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      selectIslandById('kalpa_center');
    }

    function setReaderMode(mode) {
      currentMode = mode;
      document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.classList.remove("bg-indigo-600", "text-white", "shadow-md");
        btn.classList.add("text-slate-300");
      });
      const activeBtn = document.getElementById(`btn-${mode}`);
      if (activeBtn) {
        activeBtn.classList.remove("text-slate-300");
        activeBtn.classList.add("bg-indigo-600", "text-white", "shadow-md");
      }
      if (selectedIsland) renderDrawer();
    }

    function openNarrativeModal() {
      if (!selectedIsland) return;
      const modal = document.getElementById("narrative-modal");
      document.getElementById("modal-title").textContent = `${selectedIsland.title}・深度考證論述`;
      document.getElementById("modal-body").innerHTML = selectedIsland.beginner.step4_narrative || "<p>暫無詳細論述。</p>";
      modal.classList.remove("hidden");
    }

    function closeNarrativeModal() {
      document.getElementById("narrative-modal").classList.add("hidden");
    }

    document.getElementById("narrative-modal").addEventListener("click", (e) => {
      if (e.target.id === "narrative-modal") closeNarrativeModal();
    });

    function renderDrawer() {
      if (!selectedIsland) return;
      const drawer = document.getElementById("side-drawer");
      drawer.classList.remove("translate-x-full");

      document.getElementById("drawer-title").textContent = selectedIsland.title;
      document.getElementById("drawer-subtitle").textContent = selectedIsland.subtitle;
      document.getElementById("drawer-coord").textContent = selectedIsland.modelType;

      const tag = document.getElementById("drawer-tag");
      tag.textContent = selectedIsland.modelType;
      tag.style.backgroundColor = `${selectedIsland.hexColor}25`;
      tag.style.color = selectedIsland.hexColor;

      const contentBox = document.getElementById("drawer-dynamic-content");
      contentBox.innerHTML = "";

      if (currentMode === "beginner") {
        contentBox.innerHTML = `
          <div class="space-y-4">
            <div class="p-3.5 rounded-lg bg-indigo-950/40 border border-indigo-700/50">
              <span class="text-[10px] uppercase font-mono font-bold text-indigo-400 block mb-1">【步驟一：問題導讀】</span>
              <p class="text-xs font-medium text-slate-100 leading-snug">${selectedIsland.beginner.step1_question}</p>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-slate-400 block mb-1">【步驟二：概念簡介】</span>
              <p class="text-xs text-slate-300 leading-relaxed">${selectedIsland.beginner.step2_concept}</p>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-emerald-400 block mb-1">【步驟三：材料例證】</span>
              <blockquote class="text-xs text-emerald-200/90 font-serif border-l-2 border-emerald-500 pl-2.5 py-0.5 leading-relaxed">
                ${selectedIsland.beginner.step3_evidence}
              </blockquote>
            </div>
            <div class="pt-1">
              <button onclick="openNarrativeModal()" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-amber-500/20 via-amber-600/30 to-amber-500/20 border border-amber-500/50 hover:border-amber-400 text-amber-200 hover:text-white transition-all shadow-lg flex items-center justify-between group">
                <span class="text-xs font-bold flex items-center gap-2">
                  <span class="w-2 h-2 rounded-full bg-amber-400 group-hover:scale-125 transition-transform"></span>
                  【步驟四：內容敘述】開啟專題考證對話方塊
                </span>
                <svg class="w-4 h-4 text-amber-400 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
              </button>
            </div>
          </div>
        `;
      } else if (currentMode === "course") {
        const mList = selectedIsland.course.materials.map(m => `<li class="font-serif text-slate-200 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>${m}</li>`).join("");
        contentBox.innerHTML = `
          <div class="space-y-4">
            <div class="p-3.5 rounded-lg bg-amber-950/30 border border-amber-600/40">
              <span class="text-[10px] uppercase font-mono font-bold text-amber-400 block mb-1">【課程主題地圖位階】</span>
              <p class="text-xs font-medium text-slate-100">${selectedIsland.course.topicMap}</p>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-slate-400 block mb-1.5">【本單元研讀文獻書目】</span>
              <ul class="space-y-1.5 text-xs">${mList}</ul>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-cyan-400 block mb-1">【課堂思辨與比較問題】</span>
              <p class="text-xs text-slate-300 leading-relaxed">${selectedIsland.course.comparisons}</p>
            </div>
          </div>
        `;
      } else if (currentMode === "researcher") {
        contentBox.innerHTML = `
          <div class="space-y-4 font-mono text-[11px]">
            <div class="p-3 rounded-lg bg-slate-800/80 border border-slate-700">
              <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1 font-sans">【索引檢索詞 (Search Terms)】</span>
              <code class="text-amber-300 text-xs">${selectedIsland.researcher.searchTerms}</code>
            </div>
            <div class="p-3 rounded-lg bg-slate-800/80 border border-slate-700">
              <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1 font-sans">【原典圖像 / 寫本標引】</span>
              <div class="p-2 bg-slate-900 rounded border border-slate-800 text-slate-300 flex items-center justify-between">
                <span>${selectedIsland.researcher.imageRef}</span>
                <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 font-sans">經本圖示</span>
              </div>
            </div>
            <div class="p-3 rounded-lg bg-rose-950/30 border border-rose-700/40">
              <span class="text-[10px] uppercase font-bold text-rose-400 block mb-1 font-sans">【版本考異與文獻辨析】</span>
              <p class="text-slate-300 font-sans leading-relaxed text-xs">${selectedIsland.researcher.dispute}</p>
            </div>
          </div>
        `;
      }
    }

    function closeDrawer() {
      document.getElementById("side-drawer").classList.add("translate-x-full");
      selectedIsland = null;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update();
      controls.update();

      const t = time * 0.0015;

      clickableMeshes.forEach((mesh, idx) => {
        if (!mesh.userData.data || mesh.userData.data.isCenter) return;
        const marker = mesh.userData.markerMesh;
        if (marker && marker.isSprite) {
          marker.position.y = (DISK_HEIGHT / 2 + 1.35) + Math.sin(t * 1.5 + idx) * 0.08;
        }
      });

      renderer.render(scene, camera);
    }

    loadIslandsData();
  </script>
</body>
</html>
