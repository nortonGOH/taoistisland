  <!-- 中央彈出式對話方塊 (Modal Dialog for Step 4 Narrative) -->

          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>

  <!-- JavaScript 控制與非同步資料載入 -->
  <script>
    let ISLANDS_DATA = [];
    let scene, camera, renderer, controls;
    let raycaster, mouse;
    let currentMode = "beginner";
    let selectedIsland = null;
    const clickableMeshes = [];

    const INNER_RADIUS = 3.4;
    const RING_INNER = 3.8;
    const RING_OUTER = 9.4;
    const DISK_HEIGHT = 0.65;
    const TOTAL_SECTORS = 12;

    const ZODIAC_LIST = [
      { branch: "子", animal: "鼠", emoji: "🐭" },
      { branch: "丑", animal: "牛", emoji: "🐮" },
      { branch: "寅", animal: "虎", emoji: "🐯" },
      { branch: "卯", animal: "兔", emoji: "🐰" },
      { branch: "辰", animal: "龍", emoji: "🐲" },
      { branch: "巳", animal: "蛇", emoji: "🐍" },
      { branch: "午", animal: "馬", emoji: "🐴" },
      { branch: "未", animal: "羊", emoji: "🐑" },
      { branch: "申", animal: "猴", emoji: "🐵" },
      { branch: "酉", animal: "雞", emoji: "🐔" },
      { branch: "戌", animal: "狗", emoji: "🐶" },
      { branch: "亥", animal: "豬", emoji: "🐗" }
    ];

    function createZodiacBadgeTexture(zodiac, colorHex) {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");

      ctx.beginPath();
      ctx.arc(128, 128, 110, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
      ctx.fill();
      ctx.lineWidth = 8;
      ctx.strokeStyle = colorHex;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(128, 128, 96, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(226, 232, 240, 0.35)";
      ctx.stroke();

      ctx.font = "80px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(zodiac.emoji, 128, 105);

      ctx.font = "bold 40px sans-serif";
      ctx.fillStyle = colorHex;
      ctx.fillText(`${zodiac.branch}・${zodiac.animal}`, 128, 185);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    async function loadIslandsData() {
      try {
        const response = await fetch('./islands.json');
        if (!response.ok) {
          throw new Error(`HTTP 錯誤狀態碼: ${response.status}`);
        }
        ISLANDS_DATA = await response.json();

        ISLANDS_DATA.forEach(item => {
          if (typeof item.color === 'string') {
            item.color = parseInt(item.color, 16);
          }
        });

        initScene();
      } catch (error) {
        console.error("文獻載入失敗：", error);
        document.getElementById("canvas-container").innerHTML = `
          <div class="flex items-center justify-center h-full px-4">
            <div class="bg-rose-950/90 border border-rose-500 text-rose-200 px-6 py-5 rounded-xl max-w-lg text-sm shadow-2xl">
              <h3 class="font-bold text-base mb-2">⚠️ 資料庫 (islands.json) 讀取失敗</h3>
              <p class="text-xs leading-relaxed text-rose-300 mb-2">若您是在本機直接雙擊開啟 HTML 檔案，瀏覽器安全性限制（CORS）會阻擋非同步讀取同目錄下的 JSON 檔案。</p>
              <p class="text-xs text-rose-400">請將檔案上傳至 GitHub Pages 託管，或在本機使用簡易 HTTP 伺服器開啟。</p>
            </div>
          </div>
        `;
      }
    }

    function initScene() {
      const container = document.getElementById("canvas-container");

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060911);
      scene.fog = new THREE.FogExp2(0x060911, 0.02);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 21, 24);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = Math.PI / 2 - 0.05;
      controls.minDistance = 6;
      controls.maxDistance = 55;
      controls.target.set(0, 0, 0);

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      const ambientLight = new THREE.AmbientLight(0x23324d, 1.4);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xe2e8f0, 1.6);
      dirLight.position.set(12, 25, 14);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.bias = -0.0005;
      scene.add(dirLight);

      const centerLight = new THREE.PointLight(0x38bdf8, 2.4, 28);
      centerLight.position.set(0, 3, 0);
      scene.add(centerLight);

      createStarfield();
      buildDialSystem();

      window.addEventListener("resize", onWindowResize);
      window.addEventListener("pointerdown", onPointerDown);

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeNarrativeModal();
        }
      });

      animate();
    }

    function createStarfield() {
      const starGeo = new THREE.BufferGeometry();
      const count = 450;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 140;
        positions[i + 1] = Math.random() * 50 - 5;
        positions[i + 2] = (Math.random() - 0.5) * 140;
      }
      starGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const starMat = new THREE.PointsMaterial({
        color: 0x94a3b8,
        size: 0.22,
        transparent: true,
        opacity: 0.55
      });
      scene.add(new THREE.Points(starGeo, starMat));
    }

    function createBeidouAsterism() {
      const group = new THREE.Group();

      const starCoords = [
        { name: "天樞", x: -1.4, z: 0.8 },
        { name: "天璇", x: -1.2, z: -0.6 },
        { name: "天璣", x: 0.1,  z: -0.7 },
        { name: "天權", x: 0.3,  z: 0.4 },
        { name: "玉衡", x: 1.1,  z: 0.9 },
        { name: "開陽", x: 1.7,  z: 0.5 },
        { name: "搖光", x: 2.2,  z: -0.2 }
      ];

      const starMat = new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        emissive: 0x0284c7,
        emissiveIntensity: 0.8,
        roughness: 0.2
      });

      starCoords.forEach(pos => {
        const starMesh = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), starMat);
        starMesh.position.set(pos.x, DISK_HEIGHT / 2 + 0.35, pos.z);
        group.add(starMesh);
      });

      const lineMat = new THREE.LineBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.85,
        linewidth: 2
      });

      const linePoints = [
        new THREE.Vector3(starCoords[0].x, DISK_HEIGHT / 2 + 0.35, starCoords[0].z),
        new THREE.Vector3(starCoords[1].x, DISK_HEIGHT / 2 + 0.35, starCoords[1].z),
        new THREE.Vector3(starCoords[2].x, DISK_HEIGHT / 2 + 0.35, starCoords[2].z),
        new THREE.Vector3(starCoords[3].x, DISK_HEIGHT / 2 + 0.35, starCoords[3].z),
        new THREE.Vector3(starCoords[0].x, DISK_HEIGHT / 2 + 0.35, starCoords[0].z),
        new THREE.Vector3(starCoords[3].x, DISK_HEIGHT / 2 + 0.35, starCoords[3].z),
        new THREE.Vector3(starCoords[4].x, DISK_HEIGHT / 2 + 0.35, starCoords[4].z),
        new THREE.Vector3(starCoords[5].x, DISK_HEIGHT / 2 + 0.35, starCoords[5].z),
        new THREE.Vector3(starCoords[6].x, DISK_HEIGHT / 2 + 0.35, starCoords[6].z)
      ];

      const lineGeo = new THREE.BufferGeometry().setFromPoints(linePoints);
      const beidouLines = new THREE.Line(lineGeo, lineMat);
      group.add(beidouLines);

      return group;
    }

    function buildDialSystem() {
      // 1. 中央天盤樞機 (北斗七星)
      const centerGeo = new THREE.CylinderGeometry(INNER_RADIUS, INNER_RADIUS, DISK_HEIGHT, 48);
      const centerMat = new THREE.MeshStandardMaterial({
        color: 0x111c30,
        roughness: 0.4,
        metalness: 0.3
      });
      const centerMesh = new THREE.Mesh(centerGeo, centerMat);
      centerMesh.receiveShadow = true;
      centerMesh.castShadow = true;

      const centerEdgeGeo = new THREE.EdgesGeometry(centerGeo);
      const centerEdgeMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.8 });
      centerMesh.add(new THREE.LineSegments(centerEdgeGeo, centerEdgeMat));

      const beidouGroup = createBeidouAsterism();
      centerMesh.add(beidouGroup);

      const beidouData = ISLANDS_DATA.find(d => d.id === "beidou");
      centerMesh.userData = {
        data: beidouData,
        markerMesh: beidouGroup,
        focusPos: new THREE.Vector3(0, 0, 0)
      };
      scene.add(centerMesh);
      clickableMeshes.push(centerMesh);

      // 2. 外環十二生肖辰位扇區
      const sectorAngle = (Math.PI * 2) / TOTAL_SECTORS;
      const angleGap = 0.035;

      for (let i = 0; i < TOTAL_SECTORS; i++) {
        const startAng = i * sectorAngle + angleGap / 2;
        const endAng = (i + 1) * sectorAngle - angleGap / 2;

        const shape = new THREE.Shape();
        const segments = 24;
        for (let s = 0; s <= segments; s++) {
          const theta = startAng + (endAng - startAng) * (s / segments);
          const x = Math.cos(theta) * RING_OUTER;
          const y = Math.sin(theta) * RING_OUTER;
          if (s === 0) shape.moveTo(x, y);
          else shape.lineTo(x, y);
        }
        for (let s = segments; s >= 0; s--) {
          const theta = startAng + (endAng - startAng) * (s / segments);
          const x = Math.cos(theta) * RING_INNER;
          const y = Math.sin(theta) * RING_INNER;
          shape.lineTo(x, y);
        }
        shape.closePath();

        const extrudeSettings = {
          depth: DISK_HEIGHT,
          bevelEnabled: true,
          bevelSegments: 2,
          steps: 1,
          bevelSize: 0.05,
          bevelThickness: 0.05
        };

        const sectorGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        sectorGeo.rotateX(Math.PI / 2);

        const sectorData = ISLANDS_DATA.find(d => d.sectorIndex === i);
        const sectorMat = new THREE.MeshStandardMaterial({
          color: 0x16233b,
          roughness: 0.55,
          metalness: 0.2
        });

        const sectorMesh = new THREE.Mesh(sectorGeo, sectorMat);
        sectorMesh.position.y = DISK_HEIGHT / 2;
        sectorMesh.receiveShadow = true;
        sectorMesh.castShadow = true;

        const edgeGeo = new THREE.EdgesGeometry(sectorGeo);
        const edgeMat = new THREE.LineBasicMaterial({
          color: sectorData ? sectorData.color : 0x334155,
          transparent: true,
          opacity: 0.75
        });
        sectorMesh.add(new THREE.LineSegments(edgeGeo, edgeMat));

        const midAngle = i * sectorAngle + sectorAngle / 2;
        const midRadius = (RING_INNER + RING_OUTER) / 2;
        const posX = Math.cos(midAngle) * midRadius;
        const posZ = -Math.sin(midAngle) * midRadius;

        const zodiac = ZODIAC_LIST[i];
        const badgeTexture = createZodiacBadgeTexture(zodiac, sectorData ? sectorData.hexColor : "#fbbf24");
        const spriteMat = new THREE.SpriteMaterial({
          map: badgeTexture,
          transparent: true,
          depthTest: true
        });
        const badgeSprite = new THREE.Sprite(spriteMat);
        badgeSprite.scale.set(1.4, 1.4, 1.0);
        badgeSprite.position.set(posX, DISK_HEIGHT / 2 + 1.25, posZ);
        scene.add(badgeSprite);

        sectorMesh.userData = {
          data: sectorData,
          markerMesh: badgeSprite,
          focusPos: new THREE.Vector3(posX, 0, posZ)
        };
        badgeSprite.userData = sectorMesh.userData;

        clickableMeshes.push(sectorMesh);
        clickableMeshes.push(badgeSprite);
        scene.add(sectorMesh);
      }
    }

    function onPointerDown(event) {
      if (
        (event.clientX > window.innerWidth - 500 && !document.getElementById("side-drawer").classList.contains("translate-x-full")) ||
        !document.getElementById("narrative-modal").classList.contains("hidden")
      ) {
        return;
      }

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(clickableMeshes, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj && !obj.userData.data && obj.parent) {
          obj = obj.parent;
        }
        if (obj && obj.userData && obj.userData.data) {
          selectIsland(obj.userData);
        }
      }
    }

    function selectIsland(userData) {
      selectedIsland = userData.data;
      const targetPos = userData.focusPos;

      new TWEEN.Tween(controls.target)
        .to({ x: targetPos.x, y: 0.5, z: targetPos.z }, 800)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      new TWEEN.Tween(camera.position)
        .to({ x: targetPos.x + 5, y: 8, z: targetPos.z + 8 }, 800)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      renderDrawer();
    }

    function selectIslandById(id) {
      const mesh = clickableMeshes.find(m => m.userData.data && m.userData.data.id === id);
      if (mesh) {
        selectIsland(mesh.userData);
      }
    }

    function setReaderMode(mode) {
      currentMode = mode;
      document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.classList.remove("bg-indigo-600", "text-white", "shadow-md");
        btn.classList.add("text-slate-300");
      });
      const activeBtn = document.getElementById(`btn-${mode}`);
      if (activeBtn) {
        activeBtn.classList.remove("text-slate-300");
        activeBtn.classList.add("bg-indigo-600", "text-white", "shadow-md");
      }

      if (selectedIsland) {
        renderDrawer();
      }
    }

    function openNarrativeModal() {
      if (!selectedIsland) return;
      const modal = document.getElementById("narrative-modal");
      document.getElementById("modal-title").textContent = `${selectedIsland.title}・深度論述`;
      document.getElementById("modal-body").innerHTML = selectedIsland.beginner.step4_narrative || "<p>暫無詳細論述。</p>";
      modal.classList.remove("hidden");
    }

    function closeNarrativeModal() {
      const modal = document.getElementById("narrative-modal");
      modal.classList.add("hidden");
    }

    document.getElementById("narrative-modal").addEventListener("click", (e) => {
      if (e.target.id === "narrative-modal") {
        closeNarrativeModal();
      }
    });

    function renderDrawer() {
      if (!selectedIsland) return;

      const drawer = document.getElementById("side-drawer");
      drawer.classList.remove("translate-x-full");

      document.getElementById("drawer-title").textContent = selectedIsland.title;
      document.getElementById("drawer-subtitle").textContent = selectedIsland.subtitle;

      let posText = "天盤樞機：中央天極北斗七星";
      if (!selectedIsland.isCenter) {
        const zodiac = ZODIAC_LIST[selectedIsland.sectorIndex];
        posText = `圓盤位階：第 ${selectedIsland.sectorIndex + 1} 辰位【${zodiac.emoji} ${zodiac.branch}・${zodiac.animal}】（${selectedIsland.modelType}）`;
      }
      document.getElementById("drawer-coord").textContent = posText;
      
      const tag = document.getElementById("drawer-tag");
      tag.textContent = selectedIsland.modelType;
      tag.style.backgroundColor = `${selectedIsland.hexColor}25`;
      tag.style.color = selectedIsland.hexColor;
      tag.style.borderColor = `${selectedIsland.hexColor}50`;

      const contentBox = document.getElementById("drawer-dynamic-content");
      contentBox.innerHTML = "";

      if (currentMode === "beginner") {
        contentBox.innerHTML = `
          <div class="space-y-4">
            <div class="p-3.5 rounded-lg bg-indigo-950/40 border border-indigo-700/50">
              <span class="text-[10px] uppercase font-mono font-bold text-indigo-400 block mb-1">【步驟一：問題導讀】</span>
              <p class="text-xs font-medium text-slate-100 leading-snug">${selectedIsland.beginner.step1_question}</p>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-slate-400 block mb-1">【步驟二：概念簡介】</span>
              <p class="text-xs text-slate-300 leading-relaxed">${selectedIsland.beginner.step2_concept}</p>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-emerald-400 block mb-1">【步驟三：材料例證】</span>
              <blockquote class="text-xs text-emerald-200/90 font-serif border-l-2 border-emerald-500 pl-2.5 py-0.5 leading-relaxed">
                ${selectedIsland.beginner.step3_evidence}
              </blockquote>
            </div>
            <!-- 步驟四：點選彈跳出中央對話方塊 -->
            <div class="pt-1">
              <button onclick="openNarrativeModal()" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-amber-500/20 via-amber-600/30 to-amber-500/20 border border-amber-500/50 hover:border-amber-400 text-amber-200 hover:text-white transition-all shadow-lg flex items-center justify-between group">
                <span class="text-xs font-bold flex items-center gap-2">
                  <span class="w-2 h-2 rounded-full bg-amber-400 group-hover:scale-125 transition-transform"></span>
                  【步驟四：內容敘述】點擊開啟深度論述對話方塊
                </span>
                <svg class="w-4 h-4 text-amber-400 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                </svg>
              </button>
            </div>
          </div>
        `;
      } else if (currentMode === "course") {
        const materialsList = selectedIsland.course.materials
          .map(m => `<li class="font-serif text-slate-200 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>${m}</li>`)
          .join("");

        contentBox.innerHTML = `
          <div class="space-y-4">
            <div class="p-3.5 rounded-lg bg-amber-950/30 border border-amber-600/40">
              <span class="text-[10px] uppercase font-mono font-bold text-amber-400 block mb-1">【課程主題地圖位階】</span>
              <p class="text-xs font-medium text-slate-100">${selectedIsland.course.topicMap}</p>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-slate-400 block mb-1.5">【本單元研讀文獻書目】</span>
              <ul class="space-y-1.5 text-xs">${materialsList}</ul>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-cyan-400 block mb-1">【課堂思辨與比較問題】</span>
              <p class="text-xs text-slate-300 leading-relaxed">${selectedIsland.course.comparisons}</p>
            </div>
          </div>
        `;
      } else if (currentMode === "researcher") {
        contentBox.innerHTML = `
          <div class="space-y-4 font-mono text-[11px]">
            <div class="p-3 rounded-lg bg-slate-800/80 border border-slate-700">
              <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1 font-sans">【索引檢索詞 (Search Terms)】</span>
              <code class="text-amber-300 text-xs">${selectedIsland.researcher.searchTerms}</code>
            </div>
            <div class="p-3 rounded-lg bg-slate-800/80 border border-slate-700">
              <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1 font-sans">【原典圖像 / 寫本標引】</span>
              <div class="p-2 bg-slate-900 rounded border border-slate-800 text-slate-300 flex items-center justify-between">
                <span>${selectedIsland.researcher.imageRef}</span>
                <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 font-sans">經本圖示</span>
              </div>
            </div>
            <div class="p-3 rounded-lg bg-rose-950/30 border border-rose-700/40">
              <span class="text-[10px] uppercase font-bold text-rose-400 block mb-1 font-sans">【版本考異與文獻辨析】</span>
              <p class="text-slate-300 font-sans leading-relaxed text-xs">${selectedIsland.researcher.dispute}</p>
            </div>
          </div>
        `;
      }
    }

    function closeDrawer() {
      document.getElementById("side-drawer").classList.add("translate-x-full");
      selectedIsland = null;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update();
      controls.update();

      const t = time * 0.0015;

      const centerObj = clickableMeshes.find(m => m.userData.data && m.userData.data.id === "beidou");
      if (centerObj && centerObj.userData.markerMesh) {
        centerObj.userData.markerMesh.rotation.y = t * 0.2;
      }

      clickableMeshes.forEach((mesh, idx) => {
        if (!mesh.userData.data || mesh.userData.data.id === "beidou") return;
        const marker = mesh.userData.markerMesh;
        if (marker && marker.isSprite) {
          marker.position.y = (DISK_HEIGHT / 2 + 1.25) + Math.sin(t * 1.5 + idx) * 0.08;
        }
      });

      renderer.render(scene, camera);
    }

    loadIslandsData();
  </script>
</body>
