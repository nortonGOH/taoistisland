      const canvas = document.createElement("canvas");

      const ctx = canvas.getContext("2d");

      ctx.beginPath();
      ctx.arc(128, 128, 110, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
      ctx.fill();
      ctx.lineWidth = 8;
      ctx.strokeStyle = colorHex;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(128, 128, 96, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(226, 232, 240, 0.35)";
      ctx.stroke();

      ctx.font = "75px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(emoji, 128, 105);

      ctx.font = "bold 30px sans-serif";
      ctx.fillStyle = colorHex;
      ctx.fillText(text, 128, 185);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    function createNaturalTianshuTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext("2d");

      const grad = ctx.createRadialGradient(256, 256, 40, 256, 256, 240);
      grad.addColorStop(0, "rgba(234, 88, 12, 0.95)");
      grad.addColorStop(0.6, "rgba(180, 83, 9, 0.85)");
      grad.addColorStop(1, "rgba(15, 23, 42, 0.0)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      ctx.lineWidth = 6;
      ctx.strokeStyle = "#fef08a";
      ctx.beginPath();
      ctx.arc(256, 256, 190, 0, Math.PI * 2);
      ctx.stroke();

      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(254, 240, 138, 0.6)";
      for (let i = 0; i < 8; i++) {
        const ang = (i * Math.PI) / 4;
        ctx.beginPath();
        ctx.arc(256 + Math.cos(ang) * 110, 256 + Math.sin(ang) * 110, 45, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.font = "bold 56px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "#facc15";
      ctx.shadowBlur = 18;
      ctx.fillText("混洞赤文", 256, 220);
      ctx.font = "bold 34px serif";
      ctx.fillStyle = "#fef08a";
      ctx.fillText("唯道為身・自然天文", 256, 290);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    async function loadIslandsData() {

      initScene();

    function createSectorMesh(startAng, endAng, innerR, outerR, colorHex) {
      const shape = new THREE.Shape();
      const segments = 32;
      for (let s = 0; s <= segments; s++) {
        const theta = startAng + (endAng - startAng) * (s / segments);
        const x = Math.cos(theta) * outerR; const y = Math.sin(theta) * outerR;
        if (s === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
      }
      for (let s = segments; s >= 0; s--) {
        const theta = startAng + (endAng - startAng) * (s / segments);
        const x = Math.cos(theta) * innerR; const y = Math.sin(theta) * innerR;
        shape.lineTo(x, y);
      }
      shape.closePath();

      const extrudeSettings = { depth: DISK_HEIGHT, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.05, bevelThickness: 0.05 };
      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.rotateX(Math.PI / 2);

      const mat = new THREE.MeshStandardMaterial({ color: 0x111c30, roughness: 0.55, metalness: 0.25 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = DISK_HEIGHT / 2;
      mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0.8 })));
      return mesh;
    }

    // 建立【靈寶空間體系】：三十六天王 ── 對稱 ── 三十六土皇九宮格與金剛乘天
    function buildLingbaoSixLayers() {
      const cosmoGroup = new THREE.Group();
      cosmoGroup.position.copy(COSMOLOGY_CENTER);

      const upperLayers = [
        { id: "lingbao_daluo",       y: 28, radius: 2.2, color: "#facc15", text: "第六層【大羅天三十六天王】天道功德", emoji: "👑" },
        { id: "lingbao_sanqing",     y: 22, radius: 3.6, color: "#38bdf8", text: "第五層【三清勝境】清微・禹餘・大赤", emoji: "☁️" },
        { id: "lingbao_four_brahma", y: 16, radius: 5.0, color: "#c084fc", text: "第四層【種民聖界】四種民天 (避劫)", emoji: "✨" },
        { id: "lingbao_three_realms",y: 8,  radius: 6.6, color: "#10b981", text: "第三層【三界界域】三界二十八天", emoji: "🌌" },
        { id: "lingbao_earth_realm", y: 0,  radius: 8.0, color: "#f97316", text: "第二層【凡俗世界】五嶽十洲器界", emoji: "⛰️" }
      ];

      // 1. 中央垂直元始貫通混元光軸（自金剛風澤直達大羅天）
      const axisGeo = new THREE.CylinderGeometry(0.2, 0.2, 46, 16);
      const axisMat = new THREE.MeshStandardMaterial({ color: 0x7e22ce, emissive: 0xa855f7, emissiveIntensity: 0.6, transparent: true, opacity: 0.7 });
      const axisMesh = new THREE.Mesh(axisGeo, axisMat);
      axisMesh.position.y = 8;
      cosmoGroup.add(axisMesh);

      // 2. 生成第 2~6 層圓台與徽章
      upperLayers.forEach(lvl => {
        const ringGeo = new THREE.CylinderGeometry(lvl.radius, lvl.radius, 0.45, 48);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.35, metalness: 0.4, transparent: true, opacity: 0.88 });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.position.y = lvl.y;
        ringMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(ringGeo), new THREE.LineBasicMaterial({ color: lvl.color, opacity: 0.95 })));

        const tex = createBadgeTexture(lvl.emoji, lvl.text, lvl.color);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
        sprite.scale.set(2.0, 2.0, 1.0);
        sprite.position.set(0, lvl.y + 1.35, lvl.radius + 0.9);
        cosmoGroup.add(sprite);

        const nodeData = ISLANDS_DATA.find(d => d.id === lvl.id);
        const worldPos = COSMOLOGY_CENTER.clone().add(new THREE.Vector3(0, lvl.y, lvl.radius + 0.9));
        const userDataObj = { data: nodeData, markerMesh: sprite, focusPos: worldPos };
        ringMesh.userData = userDataObj;
        sprite.userData = userDataObj;

        clickableMeshes.push(ringMesh);
        clickableMeshes.push(sprite);
        cosmoGroup.add(ringMesh);
      });

      // 3. 【第一層地下九壘】：以「3x3 九宮格幾何方陣」建立 (Y = -8)
      const gridY = -8;
      const cellSize = 3.2;
      const cellGap = 0.4;
      const totalOffset = cellSize + cellGap;

      const strataGroup = new THREE.Group();
      strataGroup.position.set(0, gridY, 0);

      const strataNodeData = ISLANDS_DATA.find(d => d.id === "lingbao_nine_strata_gangfeng");

      let cellIdx = 0;
      for (let row = -1; row <= 1; row++) {
        for (let col = -1; col <= 1; col++) {
          const cx = col * totalOffset;
          const cz = row * totalOffset;

          const boxGeo = new THREE.BoxGeometry(cellSize, 0.4, cellSize);
          const boxMat = new THREE.MeshStandardMaterial({ color: 0x0b1329, roughness: 0.35, metalness: 0.3 });
          const boxMesh = new THREE.Mesh(boxGeo, boxMat);
          boxMesh.position.set(cx, 0, cz);

          const edgeMat = new THREE.LineBasicMaterial({ color: 0x64748b, opacity: 0.85, transparent: true });
          boxMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(boxGeo), edgeMat));

          const cellName = NINE_STRATA_NAMES[cellIdx];
          const cellTex = createBadgeTexture("🏛️", cellName, "#94a3b8");
          const cellSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: cellTex, transparent: true }));
          cellSprite.scale.set(1.3, 1.3, 1.0);
          cellSprite.position.set(cx, 0.95, cz);
          strataGroup.add(cellSprite);

          const cellWorldPos = COSMOLOGY_CENTER.clone().add(new THREE.Vector3(cx, gridY + 0.95, cz));
          const cellUserData = { data: strataNodeData, markerMesh: cellSprite, focusPos: cellWorldPos };
          boxMesh.userData = cellUserData;
          cellSprite.userData = cellUserData;

          clickableMeshes.push(boxMesh);
          clickableMeshes.push(cellSprite);
          strataGroup.add(boxMesh);

          cellIdx++;
        }
      }
      cosmoGroup.add(strataGroup);

      // 第一層主標題徽章：「風澤洞虛・金剛乘天」
      const strataMainTex = createBadgeTexture("🌪️", "第一層【九壘三十六土皇】風澤洞虛・金剛乘天", "#94a3b8");
      const strataMainSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: strataMainTex, transparent: true }));
      strataMainSprite.scale.set(2.3, 2.3, 1.0);
      strataMainSprite.position.set(0, gridY + 1.7, totalOffset * 1.5 + 1.4);
      cosmoGroup.add(strataMainSprite);

      const strataMainWorldPos = COSMOLOGY_CENTER.clone().add(new THREE.Vector3(0, gridY + 1.7, totalOffset * 1.5 + 1.4));
      strataMainSprite.userData = { data: strataNodeData, markerMesh: strataMainSprite, focusPos: strataMainWorldPos };
      clickableMeshes.push(strataMainSprite);

      // 4. 【天地對稱動態法理光索】：自大羅天三十六天王連線至九壘三十六土皇九宮格四角
      const rayPoints = [
        new THREE.Vector3(0, 28, 0), new THREE.Vector3(-totalOffset, gridY, -totalOffset),
        new THREE.Vector3(0, 28, 0), new THREE.Vector3(totalOffset, gridY, -totalOffset),
        new THREE.Vector3(0, 28, 0), new THREE.Vector3(-totalOffset, gridY, totalOffset),
        new THREE.Vector3(0, 28, 0), new THREE.Vector3(totalOffset, gridY, totalOffset)
      ];
      const rayGeo = new THREE.BufferGeometry().setFromPoints(rayPoints);
      const rayMat = new THREE.LineDashedMaterial({
        color: 0xfacc15,
        dashSize: 0.8,
        gapSize: 0.4,
        transparent: true,
        opacity: 0.65
      });
      const symmetryLines = new THREE.LineSegments(rayGeo, rayMat);
      symmetryLines.computeLineDistances();
      cosmoGroup.add(symmetryLines);

      // 5. 【風澤洞虛・金剛乘天】懸浮支撐力學場 (Y = -12.5 至 -8)
      // (A) 剛風風澤雙同心剛性金剛環
      const gangfengRingGeo = new THREE.TorusGeometry(10.8, 0.45, 16, 64);
      const gangfengRingMat = new THREE.MeshStandardMaterial({
        color: 0xe2e8f0,
        emissive: 0x94a3b8,
        emissiveIntensity: 0.95,
        roughness: 0.1
      });
      dynamicGangfengRing = new THREE.Mesh(gangfengRingGeo, gangfengRingMat);
      dynamicGangfengRing.rotation.x = Math.PI / 2;
      dynamicGangfengRing.position.y = -12.5;
      cosmoGroup.add(dynamicGangfengRing);

      const innerCarrierRingGeo = new THREE.TorusGeometry(6.4, 0.3, 16, 48);
      const innerCarrierRingMat = new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        emissive: 0x0284c7,
        emissiveIntensity: 0.8,
        transparent: true,
        opacity: 0.8
      });
      const innerCarrierRing = new THREE.Mesh(innerCarrierRingGeo, innerCarrierRingMat);
      innerCarrierRing.rotation.x = Math.PI / 2;
      innerCarrierRing.position.y = -11.0;
      cosmoGroup.add(innerCarrierRing);

      // (B) 風澤向上巨型壓強氣流托舉光線 (Cosmic Carrier Uplift Rays)
      const upliftCount = 18;
      const upliftPoints = [];
      for (let u = 0; u < upliftCount; u++) {
        const uAng = (u * Math.PI * 2) / upliftCount;
        const urx = Math.cos(uAng) * 8.5;
        const urz = Math.sin(uAng) * 8.5;
        upliftPoints.push(new THREE.Vector3(urx, -12.5, urz));
        upliftPoints.push(new THREE.Vector3(urx * 0.45, -8.0, urz * 0.45));
      }
      const upliftGeo = new THREE.BufferGeometry().setFromPoints(upliftPoints);
      const upliftMat = new THREE.LineBasicMaterial({
        color: 0x93c5fd,
        transparent: true,
        opacity: 0.65,
        linewidth: 2
      });
      const upliftLines = new THREE.LineSegments(upliftGeo, upliftMat);
      cosmoGroup.add(upliftLines);

      // (C) 頑空風澤向上浮動粒子光點 (Uplift Particles)
      const particleCount = 120;
      const particlePos = new Float32Array(particleCount * 3);
      for (let p = 0; p < particleCount * 3; p += 3) {
        const pR = Math.random() * 8.5;
        const pTh = Math.random() * Math.PI * 2;
        particlePos[p] = Math.cos(pTh) * pR;
        particlePos[p + 1] = -12.5 + Math.random() * 4.5;
        particlePos[p + 2] = Math.sin(pTh) * pR;
      }
      const particleGeo = new THREE.BufferGeometry();
      particleGeo.setAttribute("position", new THREE.BufferAttribute(particlePos, 3));
      const particleMat = new THREE.PointsMaterial({
        color: 0x93c5fd,
        size: 0.28,
        transparent: true,
        opacity: 0.8
      });
      dynamicUpliftParticles = new THREE.Points(particleGeo, particleMat);
      cosmoGroup.add(dynamicUpliftParticles);

      scene.add(cosmoGroup);
    }

    function buildSceneSystems() {
      buildLingbaoSixLayers();

      // 左盤：十二辰星盤
      const zGroup = new THREE.Group();
      zGroup.position.copy(ZODIAC_CENTER);

      const zCenterGeo = new THREE.CylinderGeometry(3.2, 3.2, DISK_HEIGHT, 48);
      const zCenterMesh = new THREE.Mesh(zCenterGeo, new THREE.MeshStandardMaterial({ color: 0x0f1a2e, roughness: 0.35, metalness: 0.4 }));
      zCenterMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(zCenterGeo), new THREE.LineBasicMaterial({ color: 0x38bdf8 })));
      const beidouAsterism = createBeidouAsterism();
      zCenterMesh.add(beidouAsterism);

      const beidouData = ISLANDS_DATA.find(d => d.id === "beidou");
      zCenterMesh.userData = { data: beidouData, markerMesh: beidouAsterism, focusPos: ZODIAC_CENTER.clone() };
      zGroup.add(zCenterMesh);
      clickableMeshes.push(zCenterMesh);

      const sectorAngle = (Math.PI * 2) / TOTAL_SECTORS;
      for (let i = 0; i < TOTAL_SECTORS; i++) {
        const startAng = i * sectorAngle + 0.035;
        const endAng = (i + 1) * sectorAngle - 0.035;
        const sData = ISLANDS_DATA.find(d => d.sectorIndex === i && !d.isKalpa);
        const sectorMesh = createSectorMesh(startAng, endAng, 3.5, 8.8, sData ? sData.hexColor : "#fbbf24");

        const midA = i * sectorAngle + sectorAngle / 2;
        const lx = Math.cos(midA) * 6.2;
        const lz = -Math.sin(midA) * 6.2;

        const zodiac = ZODIAC_LIST[i];
        const badgeTexture = createBadgeTexture(zodiac.emoji, `${zodiac.branch}・${zodiac.animal}`, sData ? sData.hexColor : "#fbbf24");
        const badgeSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: badgeTexture, transparent: true }));
        badgeSprite.scale.set(1.4, 1.4, 1.0);
        badgeSprite.position.set(lx, DISK_HEIGHT / 2 + 1.25, lz);
        zGroup.add(badgeSprite);

        const wPos = ZODIAC_CENTER.clone().add(new THREE.Vector3(lx, 0, lz));
        const sUserData = { data: sData, markerMesh: badgeSprite, focusPos: wPos };
        sectorMesh.userData = sUserData;
        badgeSprite.userData = sUserData;

        clickableMeshes.push(sectorMesh);
        clickableMeshes.push(badgeSprite);
        zGroup.add(sectorMesh);
      }
      scene.add(zGroup);

      // 右盤下層：靈寶五劫天輪 (KALPA_CENTER, Y = 0)
      const kalpaGroup = new THREE.Group();
      kalpaGroup.position.copy(KALPA_CENTER);

      const kCenterGeo = new THREE.CylinderGeometry(3.2, 3.2, DISK_HEIGHT, 48);
      const kCenterMesh = new THREE.Mesh(kCenterGeo, new THREE.MeshStandardMaterial({ color: 0x1a0f2e, roughness: 0.35, metalness: 0.4 }));
      kCenterMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(kCenterGeo), new THREE.LineBasicMaterial({ color: 0xa855f7 })));

      const kalpaCenterData = ISLANDS_DATA.find(d => d.id === "kalpa_center");
      kCenterMesh.userData = { data: kalpaCenterData, focusPos: KALPA_CENTER.clone() };
      kalpaGroup.add(kCenterMesh);
      clickableMeshes.push(kCenterMesh);

      const kalpaAngle = (Math.PI * 2) / TOTAL_KALPAS;
      for (let k = 0; k < TOTAL_KALPAS; k++) {
        const startAng = k * kalpaAngle + 0.035;
        const endAng = (k + 1) * kalpaAngle - 0.035;
        const kpData = ISLANDS_DATA.find(d => d.kalpaIndex === k);
        const kalpaMesh = createSectorMesh(startAng, endAng, 3.6, 9.2, kpData ? kpData.hexColor : "#38bdf8");

        const midA = k * kalpaAngle + kalpaAngle / 2;
        const lx = Math.cos(midA) * 6.4;
        const lz = -Math.sin(midA) * 6.4;

        const kBadge = KALPA_BADGES[k];
        const tex = createBadgeTexture(kBadge.emoji, `${kBadge.name}劫`, kpData ? kpData.hexColor : "#38bdf8");
        const badgeSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
        badgeSprite.scale.set(1.7, 1.7, 1.0);
        badgeSprite.position.set(lx, DISK_HEIGHT / 2 + 1.45, lz);
        kalpaGroup.add(badgeSprite);

        const wPos = KALPA_CENTER.clone().add(new THREE.Vector3(lx, 0, lz));
        const kUserData = { data: kpData, markerMesh: badgeSprite, focusPos: wPos };
        kalpaMesh.userData = kUserData;
        badgeSprite.userData = kUserData;

        clickableMeshes.push(kalpaMesh);
        clickableMeshes.push(badgeSprite);
        kalpaGroup.add(kalpaMesh);
      }
      scene.add(kalpaGroup);

      // 右盤上層：五方五氣本體盤 (垂直位移 Y = PROTO_HEIGHT)
      const protoGroup = new THREE.Group();
      protoGroup.position.set(KALPA_CENTER.x, PROTO_HEIGHT, KALPA_CENTER.z);

      const pBaseGeo = new THREE.CylinderGeometry(5.8, 5.8, 0.2, 48);
      const pBaseMat = new THREE.MeshStandardMaterial({ color: 0x221a08, transparent: true, opacity: 0.65, roughness: 0.3 });
      const pBaseMesh = new THREE.Mesh(pBaseGeo, pBaseMat);
      pBaseMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(pBaseGeo), new THREE.LineBasicMaterial({ color: 0xfacc15, opacity: 0.7 })));
      protoGroup.add(pBaseMesh);

      const tianshuTex = createNaturalTianshuTexture();
      const tianshuSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tianshuTex, transparent: true, depthTest: true }));
      tianshuSprite.scale.set(3.4, 3.4, 1.0);
      tianshuSprite.position.set(0, 1.2, 0);
      protoGroup.add(tianshuSprite);

      const pCenterHitMesh = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 0.6, 24), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 }));
      pCenterHitMesh.position.set(0, 0.4, 0);

      const protoCenterData = ISLANDS_DATA.find(d => d.id === "proto_center");
      const protoCenterWorldPos = new THREE.Vector3(KALPA_CENTER.x, PROTO_HEIGHT, KALPA_CENTER.z);
      const pCenterUserData = { data: protoCenterData, markerMesh: tianshuSprite, focusPos: protoCenterWorldPos };
      pCenterHitMesh.userData = pCenterUserData;
      tianshuSprite.userData = pCenterUserData;
      clickableMeshes.push(pCenterHitMesh);
      clickableMeshes.push(tianshuSprite);
      protoGroup.add(pCenterHitMesh);

      const directions = [
        { id: "proto_east",  angle: 0,           dist: 4.5, text: "東方九氣", emoji: "🌱", color: "#10b981" },
        { id: "proto_south", angle: -Math.PI / 2, dist: 4.5, text: "南方三氣", emoji: "🔥", color: "#f97316" },
        { id: "proto_west",  angle: Math.PI,      dist: 4.5, text: "西方七氣", emoji: "⚪", color: "#e2e8f0" },
        { id: "proto_north", angle: Math.PI / 2,  dist: 4.5, text: "北方五氣", emoji: "💧", color: "#38bdf8" }
      ];

      directions.forEach(dir => {
        const lx = Math.cos(dir.angle) * dir.dist;
        const lz = -Math.sin(dir.angle) * dir.dist;

        const bGeo = new THREE.BoxGeometry(1.6, 0.35, 1.6);
        const bMesh = new THREE.Mesh(bGeo, new THREE.MeshStandardMaterial({ color: 0x131d31, roughness: 0.3 }));
        bMesh.position.set(lx, 0.2, lz);
        bMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(bGeo), new THREE.LineBasicMaterial({ color: dir.color })));

        const tex = createBadgeTexture(dir.emoji, dir.text, dir.color);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
        sprite.scale.set(1.4, 1.4, 1.0);
        sprite.position.set(lx, 1.15, lz);
        protoGroup.add(sprite);

        const nodeData = ISLANDS_DATA.find(d => d.id === dir.id);
        const nodeWorldPos = new THREE.Vector3(KALPA_CENTER.x + lx, PROTO_HEIGHT, KALPA_CENTER.z + lz);
        const dirUserData = { data: nodeData, markerMesh: sprite, focusPos: nodeWorldPos };
        bMesh.userData = dirUserData;
        sprite.userData = dirUserData;

        clickableMeshes.push(bMesh);
        clickableMeshes.push(sprite);
        protoGroup.add(bMesh);
      });

      scene.add(protoGroup);
    }

    function onPointerDown(event) {
      if (event.clientX > window.innerWidth - 500 && !document.getElementById("side-drawer").classList.contains("translate-x-full")) return;
      if (!document.getElementById("narrative-modal").classList.contains("hidden")) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(clickableMeshes, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj && !obj.userData.data && obj.parent) obj = obj.parent;
        if (obj && obj.userData && obj.userData.data) selectIsland(obj.userData);
      }
    }

    function selectIsland(userData) {
      selectedIsland = userData.data;
      const targetPos = userData.focusPos;
      new TWEEN.Tween(controls.target).to({ x: targetPos.x, y: targetPos.y + 0.3, z: targetPos.z }, 800).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(camera.position).to({ x: targetPos.x + 5, y: targetPos.y + 7.5, z: targetPos.z + 8.5 }, 800).easing(TWEEN.Easing.Cubic.Out).start();
      renderDrawer();
    }

    function selectIslandById(id) {
      const mesh = clickableMeshes.find(m => m.userData.data && m.userData.data.id === id);
      if (mesh) selectIsland(mesh.userData);
    }

    // 視角快速導航
    function focusOverview() {
      new TWEEN.Tween(controls.target).to({ x: 0, y: 5, z: 0 }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(camera.position).to({ x: 0, y: 40, z: 50 }, 900).easing(TWEEN.Easing.Cubic.Out).start();
    }

    function focusCelestialSymmetry() {
      new TWEEN.Tween(controls.target).to({ x: COSMOLOGY_CENTER.x, y: 10, z: COSMOLOGY_CENTER.z }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(camera.position).to({ x: COSMOLOGY_CENTER.x + 18, y: 16, z: COSMOLOGY_CENTER.z + 28 }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      selectIslandById('lingbao_daluo');
    }

    function focusNineStrataGrid() {
      new TWEEN.Tween(controls.target).to({ x: COSMOLOGY_CENTER.x, y: -7.5, z: COSMOLOGY_CENTER.z }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(camera.position).to({ x: COSMOLOGY_CENTER.x, y: 5, z: COSMOLOGY_CENTER.z + 14 }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      selectIslandById('lingbao_nine_strata_gangfeng');
    }

    function focusProtoDisk() {
      new TWEEN.Tween(controls.target).to({ x: KALPA_CENTER.x, y: PROTO_HEIGHT, z: KALPA_CENTER.z }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(camera.position).to({ x: KALPA_CENTER.x, y: PROTO_HEIGHT + 14, z: KALPA_CENTER.z + 12 }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      selectIslandById('proto_center');
    }

    function focusZodiacDisk() {
      new TWEEN.Tween(controls.target).to({ x: ZODIAC_CENTER.x, y: 0, z: ZODIAC_CENTER.z }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(camera.position).to({ x: ZODIAC_CENTER.x, y: 20, z: ZODIAC_CENTER.z + 17 }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      selectIslandById('beidou');
    }

    function focusKalpaDisk() {
      new TWEEN.Tween(controls.target).to({ x: KALPA_CENTER.x, y: 0, z: KALPA_CENTER.z }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(camera.position).to({ x: KALPA_CENTER.x, y: 20, z: KALPA_CENTER.z + 18 }, 900).easing(TWEEN.Easing.Cubic.Out).start();
      selectIslandById('kalpa_center');
    }

    function setReaderMode(mode) {
      currentMode = mode;
      document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.classList.remove("bg-indigo-600", "text-white", "shadow-md");
        btn.classList.add("text-slate-300");
      });
      const activeBtn = document.getElementById(`btn-${mode}`);
      if (activeBtn) {
        activeBtn.classList.remove("text-slate-300");
        activeBtn.classList.add("bg-indigo-600", "text-white", "shadow-md");
      }
      if (selectedIsland) renderDrawer();
    }

    function openNarrativeModal() {
      if (!selectedIsland) return;
      const modal = document.getElementById("narrative-modal");
      document.getElementById("modal-title").textContent = `${selectedIsland.title}・深度考證論述`;
      document.getElementById("modal-body").innerHTML = selectedIsland.beginner.step4_narrative || "<p>暫無詳細論述。</p>";
      modal.classList.remove("hidden");
    }

    function closeNarrativeModal() {
      document.getElementById("narrative-modal").classList.add("hidden");
    }

    document.getElementById("narrative-modal").addEventListener("click", (e) => {
      if (e.target.id === "narrative-modal") closeNarrativeModal();
    });

    function renderDrawer() {
      if (!selectedIsland) return;
      const drawer = document.getElementById("side-drawer");
      drawer.classList.remove("translate-x-full");

      document.getElementById("drawer-title").textContent = selectedIsland.title;
      document.getElementById("drawer-subtitle").textContent = selectedIsland.subtitle;
      document.getElementById("drawer-coord").textContent = selectedIsland.modelType;

      const tag = document.getElementById("drawer-tag");
      tag.textContent = selectedIsland.modelType;
      tag.style.backgroundColor = `${selectedIsland.hexColor}25`;
      tag.style.color = selectedIsland.hexColor;

      const contentBox = document.getElementById("drawer-dynamic-content");
      contentBox.innerHTML = "";

      if (currentMode === "beginner") {
        contentBox.innerHTML = `
          <div class="space-y-4">
            <div class="p-3.5 rounded-lg bg-indigo-950/40 border border-indigo-700/50">
              <span class="text-[10px] uppercase font-mono font-bold text-indigo-400 block mb-1">【步驟一：問題導讀】</span>
              <p class="text-xs font-medium text-slate-100 leading-snug">${selectedIsland.beginner.step1_question}</p>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-slate-400 block mb-1">【步驟二：概念簡介】</span>
              <p class="text-xs text-slate-300 leading-relaxed">${selectedIsland.beginner.step2_concept}</p>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-emerald-400 block mb-1">【步驟三：材料例證】</span>
              <blockquote class="text-xs text-emerald-200/90 font-serif border-l-2 border-emerald-500 pl-2.5 py-0.5 leading-relaxed">
                ${selectedIsland.beginner.step3_evidence}
              </blockquote>
            </div>
            <div class="pt-1">
              <button onclick="openNarrativeModal()" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-amber-500/20 via-amber-600/30 to-amber-500/20 border border-amber-500/50 hover:border-amber-400 text-amber-200 hover:text-white transition-all shadow-lg flex items-center justify-between group">
                <span class="text-xs font-bold flex items-center gap-2">
                  <span class="w-2 h-2 rounded-full bg-amber-400 group-hover:scale-125 transition-transform"></span>
                  【步驟四：內容敘述】開啟專題考證對話方塊
                </span>
                <svg class="w-4 h-4 text-amber-400 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
              </button>
            </div>
          </div>
        `;
      } else if (currentMode === "course") {
        const mList = selectedIsland.course.materials.map(m => `<li class="font-serif text-slate-200 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>${m}</li>`).join("");
        contentBox.innerHTML = `
          <div class="space-y-4">
            <div class="p-3.5 rounded-lg bg-amber-950/30 border border-amber-600/40">
              <span class="text-[10px] uppercase font-mono font-bold text-amber-400 block mb-1">【課程主題地圖位階】</span>
              <p class="text-xs font-medium text-slate-100">${selectedIsland.course.topicMap}</p>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-slate-400 block mb-1.5">【本單元研讀文獻書目】</span>
              <ul class="space-y-1.5 text-xs">${mList}</ul>
            </div>
            <div class="p-3.5 rounded-lg bg-slate-800/60 border border-slate-700/60">
              <span class="text-[10px] uppercase font-mono font-bold text-cyan-400 block mb-1">【課堂思辨與比較問題】</span>
              <p class="text-xs text-slate-300 leading-relaxed">${selectedIsland.course.comparisons}</p>
            </div>
          </div>
        `;
      } else if (currentMode === "researcher") {
        contentBox.innerHTML = `
          <div class="space-y-4 font-mono text-[11px]">
            <div class="p-3 rounded-lg bg-slate-800/80 border border-slate-700">
              <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1 font-sans">【索引檢索詞 (Search Terms)】</span>
              <code class="text-amber-300 text-xs">${selectedIsland.researcher.searchTerms}</code>
            </div>
            <div class="p-3 rounded-lg bg-slate-800/80 border border-slate-700">
              <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1 font-sans">【原典圖像 / 寫本標引】</span>
              <div class="p-2 bg-slate-900 rounded border border-slate-800 text-slate-300 flex items-center justify-between">
                <span>${selectedIsland.researcher.imageRef}</span>
                <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 font-sans">經本圖示</span>
              </div>
            </div>
            <div class="p-3 rounded-lg bg-rose-950/30 border border-rose-700/40">
              <span class="text-[10px] uppercase font-bold text-rose-400 block mb-1 font-sans">【版本考異與文獻辨析】</span>
              <p class="text-slate-300 font-sans leading-relaxed text-xs">${selectedIsland.researcher.dispute}</p>
            </div>
          </div>
        `;
      }
    }

    function closeDrawer() {
      document.getElementById("side-drawer").classList.add("translate-x-full");
      selectedIsland = null;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update();
      controls.update();

      const t = time * 0.0015;

      // 北斗星圖微轉動
      const zCenterObj = clickableMeshes.find(m => m.userData.data && m.userData.data.id === "beidou");
      if (zCenterObj && zCenterObj.userData.markerMesh) {
        zCenterObj.userData.markerMesh.rotation.y = t * 0.2;
      }

      // 赤文自然天文微轉動
      const pCenterObj = clickableMeshes.find(m => m.userData.data && m.userData.data.id === "proto_center");
      if (pCenterObj && pCenterObj.userData.markerMesh) {
        pCenterObj.userData.markerMesh.material.rotation = -t * 0.15;
      }

      // 底層「風澤洞虛・金剛乘天」剛風金剛環旋轉與粒子向上浮動
      if (dynamicGangfengRing) {
        dynamicGangfengRing.rotation.z = t * 0.45;
      }
      if (dynamicUpliftParticles) {
        const positions = dynamicUpliftParticles.geometry.attributes.position.array;
        for (let i = 1; i < positions.length; i += 3) {
          positions[i] += 0.055; // 粒子自下而上持續湧昇
          if (positions[i] > -8.0) {
            positions[i] = -12.5; // 重置到底部風澤
          }
        }
        dynamicUpliftParticles.geometry.attributes.position.needsUpdate = true;
      }

      // 各標記微浮動
      clickableMeshes.forEach((mesh, idx) => {
        if (!mesh.userData.data || mesh.userData.data.isCenter) return;
        const marker = mesh.userData.markerMesh;
        if (marker && marker.isSprite) {
          let baseH = 1.25;
          if (mesh.userData.data.disk === "proto_lingbao") baseH = 1.15;
          else if (mesh.userData.data.disk === "cosmology_lingbao") baseH = 1.35;
          else if (mesh.userData.data.isKalpa) baseH = DISK_HEIGHT / 2 + 1.45;
          marker.position.y = (mesh.userData.focusPos.y + baseH) + Math.sin(t * 1.5 + idx) * 0.06;
        }
      });

      renderer.render(scene, camera);
    }

    loadIslandsData();
  </script>
</body>
</html>
